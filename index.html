function undim(){ lastTouch = Date.now(); const d=document.getElementById("dim-layer"); if(d) d.classList.remove("on"); }
document.addEventListener("pointerdown", ()=>{ lastTouch = Date.now(); }, true);
document.addEventListener("keydown", ()=>{ lastTouch = Date.now(); }, true);
setInterval(()=>{
  const on = entrenandoAhora();
  if(on){ if(document.visibilityState==="visible"){ requestWakeLock(); noSleepOn(); } }
  else { if(wakeLock && !runningTimerDate()) releaseWakeLock(); noSleepOff(); }
  const ai = document.getElementById("awake-ind"); if(ai) ai.hidden = !on;
  const d = dimLayer();
  if(on && Date.now()-lastTouch > DIM_AFTER_MS){ if(!d.classList.contains("on")) d.classList.add("on"); }
  else if(!on && d.classList.contains("on")) d.classList.remove("on");
}, 1000);

/* ======================= GUARDAR IDEAS =======================
   Anotás (escribiendo o DICTANDO, que pasa la voz a texto al instante) o grabás un audio.
   Todo queda guardado en ESTE celular (IndexedDB). "Enviar a Claude" arma un archivo de texto con
   todas las ideas pendientes + los audios, y abre el menú Compartir del celular para mandarlos
   (al chat de Claude, a WhatsApp, a Drive…). Claude lee el texto; los audios quedan de respaldo. */
const Ideas = { list:[], rec:null, recChunks:[], recStart:0, recTick:null, dict:null, dictOn:false };
function ideasDb(){
  return new Promise((ok,ko)=>{ try{
    const r = indexedDB.open("entrenador-ideas", 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("ideas", { keyPath:"id" });
    r.onsuccess = ()=> ok(r.result); r.onerror = ()=> ko(r.error);
  }catch(e){ ko(e); } });
}
async function ideasLoad(){
  try{ const dbi = await ideasDb();
    Ideas.list = await new Promise(ok=>{ const q = dbi.transaction("ideas").objectStore("ideas").getAll(); q.onsuccess=()=>ok(q.result||[]); q.onerror=()=>ok([]); });
    Ideas.list.sort((a,b)=> a.id<b.id?1:-1);
  }catch(_){ Ideas.list = []; }
  if(state.view==="guardar") renderGuardar();
}
async function ideasPut(it){ try{ const dbi = await ideasDb(); await new Promise(ok=>{ const tx=dbi.transaction("ideas","readwrite"); tx.objectStore("ideas").put(it); tx.oncomplete=ok; tx.onerror=ok; }); }catch(_){} }
async function ideasDel(id){ try{ const dbi = await ideasDb(); await new Promise(ok=>{ const tx=dbi.transaction("ideas","readwrite"); tx.objectStore("ideas").delete(id); tx.oncomplete=ok; tx.onerror=ok; }); }catch(_){} }
function ideaFecha(id){ const d=new Date(Number(id.split("-")[0])); return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}); }
function ideaAudioExt(mime){ return /mp4|m4a|aac/.test(mime||"") ? "m4a" : (/ogg/.test(mime||"") ? "ogg" : "webm"); }
function ideasPanelHtml(){
  const pend = Ideas.list.filter(x=>!x.enviada);
  const canDict = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  const canRec = !!(navigator.mediaDevices && window.MediaRecorder);
  const esc = t=> String(t||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  return `<div class="today-panel guia">
    <div class="guia-root">💡 GUARDAR IDEAS</div>
    <p style="font-size:.86rem;color:var(--ink-2);margin:10px 0 10px;">Se te ocurre algo en el gym → escribilo, <b>dictalo</b> (pasa la voz a texto) o grabá un audio. Después tocá <b>Enviar a Claude</b> y pegás/adjuntás en el chat.</p>
    <div class="idea-new">
      <textarea id="idea-txt" placeholder="Ej: que el descanso suene también en el reloj…">${esc(Ideas.borrador||"")}</textarea>
      <div class="idea-tools">
        ${canDict?`<button type="button" class="btn ${Ideas.dictOn?"rec-on":""}" data-idea="dict">${Ideas.dictOn?"⏹ Parar dictado":"🗣️ Dictar"}</button>`:""}
        ${canRec?`<button type="button" class="btn ${Ideas.rec?"rec-on":""}" data-idea="rec">${Ideas.rec?`⏹ Parar audio <span id="idea-rec-t">0:00</span>`:"🎙️ Grabar audio"}</button>`:""}
        <button type="button" class="btn btn-primary" data-idea="save" style="margin-left:auto;">Guardar idea</button>
      </div>
    </div>
    ${Ideas.list.length?`<ul class="idea-list">${Ideas.list.map(it=>`<li class="idea-item ${it.enviada?"sent":""}">
      <div class="idea-meta"><span>${ideaFecha(it.id)}${it.enviada?" · ✓ enviada":""}${it.audio?" · 🎙️ audio":""}</span>
        <button type="button" class="btn btn-sm btn-ghost" data-idea="del" data-id="${it.id}" title="Borrar idea">🗑</button></div>
      ${it.texto?`<p class="idea-txt">${esc(it.texto)}</p>`:""}
      ${it.audio?`<audio controls preload="none" data-idea-audio="${it.id}"></audio>`:""}
    </li>`).join("")}</ul>`:`<p style="font-size:.84rem;color:var(--ink-2);margin-top:12px;">Todavía no guardaste ideas.</p>`}
    <div class="idea-send">
      <button type="button" class="btn btn-primary" data-idea="send" ${pend.length?"":"disabled"}>📤 Enviar a Claude${pend.length?` (${pend.length})`:""}</button>
      ${Ideas.list.some(x=>x.enviada)?`<button type="button" class="btn btn-sm" data-idea="clear-sent">Borrar las enviadas</button>`:""}
    </div>
    <div class="rules-note" style="margin-top:12px;">✍️ Claude lee el <b>texto</b> (lo escrito y lo dictado). Los audios van de respaldo: Claude no siempre puede escucharlos, así que para pedidos importantes usá <b>Dictar</b>.</div>
  </div>`;
}
function ideasAttachAudio(){
  document.querySelectorAll("[data-idea-audio]").forEach(a=>{
    const it = Ideas.list.find(x=>x.id===a.dataset.ideaAudio);
    if(it && it.audio && !a.src){ a.src = URL.createObjectURL(it.audio); }
  });
}
function ideasKeepDraft(){ const t=document.getElementById("idea-txt"); if(t) Ideas.borrador = t.value; }
async function ideaRecToggle(){
  ideasKeepDraft();
  if(Ideas.rec){ try{ Ideas.rec.stop(); }catch(_){} return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    const mime = ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg"].find(m=> MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
    const rec = new MediaRecorder(stream, mime?{ mimeType:mime }:undefined);
    Ideas.recChunks = []; Ideas.rec = rec; Ideas.recStart = Date.now();
    rec.ondataavailable = e=>{ if(e.data && e.data.size) Ideas.recChunks.push(e.data); };
    rec.onstop = ()=>{
      stream.getTracks().forEach(t=>t.stop());
      clearInterval(Ideas.recTick); Ideas.recTick = null;
      Ideas.pendingAudio = new Blob(Ideas.recChunks, { type: rec.mimeType || mime || "audio/webm" });
      Ideas.pendingDur = Math.round((Date.now()-Ideas.recStart)/1000);
      Ideas.rec = null; renderGuardar();
      toast(`🎙️ Audio de ${Ideas.pendingDur}s listo · tocá Guardar idea`);
    };
    rec.start(1000);
    Ideas.recTick = setInterval(()=>{ const el=document.getElementById("idea-rec-t"); if(el){ const s=Math.round((Date.now()-Ideas.recStart)/1000); el.textContent = Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); } }, 500);
    renderGuardar();
  }catch(e){ Ideas.rec = null; toast("No se pudo usar el micrófono · dale permiso a la app"); }
}
function ideaDictToggle(){
  ideasKeepDraft();
  if(Ideas.dictOn && Ideas.dict){ try{ Ideas.dict.stop(); }catch(_){} return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if(!SR) return;
  const r = new SR(); r.lang = "es-AR"; r.continuous = true; r.interimResults = true;
  const base = (Ideas.borrador||"").trim();
  let finalTxt = "";
  r.onresult = e=>{
    let interim = "";
    for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) finalTxt += t+" "; else interim += t; }
    const ta = document.getElementById("idea-txt"); const v = (base?base+" ":"")+finalTxt+interim;
    if(ta) ta.value = v; Ideas.borrador = (base?base+" ":"")+finalTxt;
  };
  r.onend = ()=>{ Ideas.dictOn = false; Ideas.dict = null; ideasKeepDraft(); renderGuardar(); };
  r.onerror = ev=>{ if(ev.error==="not-allowed") toast("Dale permiso al micrófono para dictar"); };
  Ideas.dict = r; Ideas.dictOn = true;
  try{ r.start(); }catch(_){ Ideas.dictOn = false; }
  renderGuardar();
}
async function ideaSave(){
  ideasKeepDraft();
  const texto = (Ideas.borrador||"").trim();
  if(!texto && !Ideas.pendingAudio){ toast("Escribí, dictá o grabá algo primero"); return; }
  const it = { id: Date.now()+"-"+Math.random().toString(36).slice(2,6), texto, enviada:false };
  if(Ideas.pendingAudio){ it.audio = Ideas.pendingAudio; it.mime = Ideas.pendingAudio.type; it.dur = Ideas.pendingDur; }
  await ideasPut(it);
  Ideas.borrador = ""; Ideas.pendingAudio = null;
  await ideasLoad(); toast("💡 Idea guardada");
}
async function ideasSend(){
  const pend = Ideas.list.filter(x=>!x.enviada).slice().reverse();   // de la más vieja a la más nueva
  if(!pend.length) return;
  const stamp = todayStr();
  const files = [];
  let txt = `IDEAS PARA LA APP "ENTRENADOR PERSONAL" · ${fmtDateLong(stamp)}\nVersión de la app: ${typeof APP_VERSION!=="undefined"?APP_VERSION:""}\n\n`;
  pend.forEach((it,i)=>{
    let aname = "";
    if(it.audio){ aname = `idea-${i+1}-audio.${ideaAudioExt(it.mime)}`; files.push(new File([it.audio], aname, { type: (it.mime||"audio/webm").split(";")[0] })); }
    txt += `${i+1}. [${ideaFecha(it.id)}] ${it.texto||"(solo audio)"}${aname?`\n   🎙️ Audio adjunto: ${aname} (${it.dur||"?"} s)`:""}\n\n`;
  });
  txt += "Claude: aplicá estos cambios en la app (si algo no se entiende, preguntame).\n";
  const tfile = new File([txt], `ideas-entrenador-${stamp}.txt`, { type:"text/plain" });
  files.unshift(tfile);
  let ok = false;
  try{
    if(navigator.canShare && navigator.canShare({ files })){ await navigator.share({ files, title:"Ideas para la app", text:"Ideas para Entrenador Personal" }); ok = true; }
    else if(navigator.canShare && navigator.canShare({ files:[tfile] })){ await navigator.share({ files:[tfile], title:"Ideas para la app" }); ok = true; if(files.length>1) ideasDownload(files.slice(1)); }
  }catch(e){ if(e && e.name==="AbortError") return; }
  if(!ok){ ideasDownload(files); try{ await navigator.clipboard.writeText(txt); toast("📋 Texto copiado y archivos descargados · pegalos en el chat de Claude"); }catch(_){ toast("Archivos descargados · adjuntalos en el chat de Claude"); } }
  for(const it of pend){ it.enviada = true; await ideasPut(it); }
  await ideasLoad();
}
function ideasDownload(files){
  files.forEach((f,i)=> setTimeout(()=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000); }, i*400));
}
document.addEventListener("click", async e=>{
  const b = e.target.closest && e.target.closest("[data-idea]"); if(!b) return;
  const k = b.dataset.idea;
  if(k==="rec") return ideaRecToggle();
  if(k==="dict") return ideaDictToggle();
  if(k==="save") return ideaSave();
  if(k==="send") return ideasSend();
  if(k==="del"){ if(!armConfirm(b, "¿Borrar?")) return; await ideasDel(b.dataset.id); return ideasLoad(); }
  if(k==="clear-sent"){ for(const it of Ideas.list.filter(x=>x.enviada)) await ideasDel(it.id); return ideasLoad(); }
});
document.addEventListener("input", e=>{ if(e.target && e.target.id==="idea-txt") Ideas.borrador = e.target.value; });
ideasLoad();

/* ======================= INIT ======================= */
initStorage();
})();
