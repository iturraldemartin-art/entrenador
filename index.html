<title>Entrenador Personal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --ink:#1f2421; --ink-2:#5b6560;
    --paper:#eef1ee; --surface:#ffffff; --surface-2:#e4e8e3;
    --line:#d7dbd3;
    --accent:#d9530a; --accent-ink:#fff8f0; --accent-soft:rgba(217,83,10,.14); --accent-soft-2:rgba(217,83,10,.30);
    --good:#3f7a4d; --good-soft:rgba(63,122,77,.14);
    --rest:#8a8f86;
    --danger:#b3413a; --danger-soft:rgba(179,65,58,.14);
    --shadow: 0 10px 30px -12px rgba(20,20,15,.35);
    --radius: 7px;
    --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#eda100; --cat-5:#e87ba4; --cat-6:#008300; --cat-7:#4a3aa7;
    --skin:#eabf94; --skin-shade:#d29e6c; --skin-line:#b47f4f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eef1ee; --ink-2:#9aa39d;
      --paper:#16181a; --surface:#202325; --surface-2:#262a2c;
      --line:#34383a;
      --accent:#ff7a29; --accent-ink:#1a0f00; --accent-soft:rgba(255,122,41,.18); --accent-soft-2:rgba(255,122,41,.34);
      --good:#6fbf7a; --good-soft:rgba(111,191,122,.16);
      --rest:#6b716c;
      --danger:#e06a62; --danger-soft:rgba(224,106,98,.16);
      --shadow: 0 10px 30px -12px rgba(0,0,0,.6);
      --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#008300; --cat-7:#9085e9;
      --skin:#c9976a; --skin-shade:#a97a4e; --skin-line:#8a5f3a;
    }
  }
  :root[data-theme="dark"]{
    --ink:#eef1ee; --ink-2:#9aa39d;
    --paper:#16181a; --surface:#202325; --surface-2:#262a2c;
    --line:#34383a;
    --accent:#ff7a29; --accent-ink:#1a0f00; --accent-soft:rgba(255,122,41,.18); --accent-soft-2:rgba(255,122,41,.34);
    --good:#6fbf7a; --good-soft:rgba(111,191,122,.16);
    --rest:#6b716c;
    --danger:#e06a62; --danger-soft:rgba(224,106,98,.16);
    --shadow: 0 10px 30px -12px rgba(0,0,0,.6);
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181; --cat-6:#008300; --cat-7:#9085e9;
    --skin:#c9976a; --skin-shade:#a97a4e; --skin-line:#8a5f3a;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:"Rajdhani",system-ui,sans-serif; font-weight:700; letter-spacing:.01em; text-wrap:balance; margin:0; }
  .mono{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
  button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  a{color:inherit;}
  ::selection{ background:var(--accent-soft-2); }

  /* ---------- Shell ---------- */
  #app{ display:grid; grid-template-columns:1fr; min-height:100vh; }
  #app > .sidebar{ display:none !important; }   /* el menú lateral pasó a solapas arriba */
  .toptabs{ display:flex; align-items:center; gap:4px; padding:0 22px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:6; overflow-x:auto; scrollbar-width:none; }
  .toptabs::-webkit-scrollbar{ display:none; }
  .toptabs .brand{ padding:6px 14px 6px 0; margin-right:6px; border-right:1px solid var(--line); flex:none; }
  .toptabs .brand-mark{ width:28px; height:28px; }
  .toptabs nav{ display:flex; gap:2px; }
  .toptabs .navlink{ width:auto; flex:none; padding:13px 14px 11px; border:none; border-bottom:3px solid transparent; border-radius:0; gap:8px; white-space:nowrap; }
  .toptabs .navlink.active{ background:none; border-bottom-color:var(--accent); color:var(--ink); }
  .toptabs .navlink:hover{ background:var(--surface-2); }
  .toptabs .storage-pill{ margin:0 0 0 auto; flex:none; padding-left:12px; }
  .sidebar{
    background:var(--surface); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:18px 14px; gap:22px;
    position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 4px; }
  .brand-mark{ width:34px; height:34px; flex:none; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .brand-mark .bm-dumbbells{ transform-origin:100px 100px; transition:transform .55s cubic-bezier(.34,1.56,.64,1); }
  .brand-mark .bm-letters{ transform-origin:100px 118px; transition:transform .3s ease; }
  .brand-mark:hover .bm-dumbbells, .brand-mark:active .bm-dumbbells{ transform:rotate(18deg) scale(1.06); }
  .brand-mark:hover .bm-letters, .brand-mark:active .bm-letters{ transform:scale(1.07); }
  .brand-name{ font-family:"Rajdhani",sans-serif; font-weight:700; font-size:1.08rem; line-height:1.1; }
  .brand-sub{ font-size:.68rem; color:var(--ink-2); text-transform:uppercase; letter-spacing:.09em; }

  nav.navlist{ display:flex; flex-direction:column; gap:3px; }
  .navlink{
    display:flex; align-items:center; gap:11px; padding:9px 10px;
    border-radius:5px; border:1px solid transparent; border-left:2px solid transparent;
    cursor:pointer; color:var(--ink-2); background:none; text-align:left; width:100%;
    font-family:"Rajdhani",sans-serif; font-weight:600; font-size:.98rem; letter-spacing:.01em;
  }
  .navlink svg{ width:19px; height:19px; flex:none; }
  .navlink:hover{ background:var(--surface-2); color:var(--ink); }
  .navlink.active{ background:var(--accent-soft); color:var(--ink); border-left-color:var(--accent); }
  .navlink.active svg{ color:var(--accent); }

  .side-foot{ margin-top:auto; padding-top:12px; border-top:1px solid var(--line); }
  .side-today{ font-size:.72rem; color:var(--ink-2); text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px;}
  .side-today-val{ font-family:"Rajdhani",sans-serif; font-weight:600; font-size:.95rem; }
  .storage-pill{ display:inline-flex; align-items:center; gap:5px; font-size:.68rem; color:var(--ink-2); margin-top:10px; }
  .storage-dot{ width:6px; height:6px; border-radius:50%; background:var(--good); flex:none; }
  .storage-dot.local{ background:var(--ink-2); }

  main{ min-width:0; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 26px; border-bottom:1px solid var(--line); background:var(--paper);
    position:relative; z-index:5;
  }
  .topbar h1{ font-size:1.5rem; }
  .topbar .sub{ color:var(--ink-2); font-size:.82rem; margin-top:2px; }
  .topbar-actions{ display:flex; gap:8px; align-items:center; }
  .topbar-title{ min-width:0; margin-right:auto; }
  .title-line{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .title-date{ font-family:"Rajdhani",sans-serif; font-weight:600; font-size:1.05rem; color:var(--accent); }

  /* ---------- Cronómetro ---------- */
  .timer-box{ display:flex; align-items:center; gap:8px; padding:7px 10px; border:1.5px solid var(--line); border-radius:var(--radius); background:var(--surface); }
  .btn.armed, .btn.armed:hover{ background:var(--danger) !important; border-color:var(--danger) !important; color:#fff !important; opacity:1 !important; padding:5px 9px; width:auto; font-size:.74rem; }
  .timer-box.running{ border-color:var(--accent); background:var(--accent-soft); }
  .timer-main{ min-width:92px; }
  .timer-label{ font-size:.62rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-2); line-height:1.1; }
  .timer-val{ font-size:1.3rem; font-weight:600; line-height:1.15; }
  .timer-box.running .timer-val{ color:var(--accent); }
  .cal-time{ font-size:.64rem; color:var(--ink-2); font-family:"IBM Plex Mono",monospace; }
  .day-time{ font-size:.78rem; color:var(--ink-2); font-family:"IBM Plex Mono",monospace; text-transform:none; }

  .view{ display:none; padding:22px 26px 60px; max-width:1500px; margin:0 auto; }
  .view.active{ display:block; }

  /* ---------- Buttons / inputs ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:7px; justify-content:center;
    padding:9px 14px; border-radius:var(--radius); border:1px solid var(--line);
    background:var(--surface); color:var(--ink); cursor:pointer;
    font-weight:600; font-size:.87rem; white-space:nowrap;
  }
  .btn svg{ width:15px;height:15px; }
  .btn:hover{ border-color:var(--ink-2); }
  .btn:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:none; border-color:transparent; }
  .btn-ghost:hover{ background:var(--surface-2); border-color:transparent; }
  .btn-danger{ color:var(--danger); }
  .btn-sm{ padding:5px 9px; font-size:.78rem; }
  .btn-icon{ padding:8px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  label{ font-size:.76rem; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-2); display:block; margin-bottom:5px; }
  input[type=text], input[type=password], input[type=number], input[type=date], input[type=datetime-local], select, textarea{
    width:100%; padding:8px 10px; border-radius:6px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink);
  }
  textarea{ resize:vertical; min-height:60px; }
  .field{ margin-bottom:13px; }
  .field-row{ display:flex; gap:10px; }
  .field-row > .field{ flex:1; }
  input[type=number]{ font-family:"IBM Plex Mono",monospace; }

  .chip{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:.74rem; font-weight:600; background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line); }
  .chip.on{ background:var(--accent-soft); color:var(--ink); border-color:var(--accent-soft-2); }
  .chip-dot{ width:7px;height:7px;border-radius:50%; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
  .empty{ color:var(--ink-2); font-size:.9rem; padding:30px 10px; text-align:center; border:1px dashed var(--line); border-radius:var(--radius); }

  /* ---------- Hoy ---------- */
  .stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:20px; }
  .stat{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; }
  .stat-label{ font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-2); }
  .stat-val{ font-family:"Rajdhani",sans-serif; font-weight:700; font-size:1.9rem; margin-top:2px; }
  .reset-banner{ background:var(--danger-soft); border:1.5px solid var(--danger); color:var(--ink); border-radius:var(--radius); padding:12px 14px; margin-bottom:16px; font-size:.9rem; }
  .reset-banner b{ color:var(--danger); }
  .stat-foot{ font-size:.72rem; color:var(--ink-2); margin-top:2px; }
  .stat-phase{ border-color:var(--accent); background:var(--accent-soft); }
  .day-ex-card.just-added{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .btn-add-below{ color:var(--accent); border-color:var(--accent-soft-2); }
  .stat-val small{ font-size:.9rem; color:var(--ink-2); font-weight:600; }

  .today-panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:22px; }
  .today-panel-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .today-date{ color:var(--ink-2); font-size:.85rem; text-transform:capitalize; }
  .streak-row{ display:flex; gap:6px; margin-top:14px; }
  .streak-dot{ width:26px; height:26px; padding:0; border-radius:5px; background:var(--surface-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:.65rem; color:var(--ink-2); font-family:"IBM Plex Mono",monospace; cursor:pointer; }
  .streak-dot.done{ background:var(--good-soft); border-color:var(--good); color:var(--good); }
  .streak-dot.today{ outline:1.5px solid var(--accent); }
  .streak-dot.viewing{ background:var(--accent-soft); color:var(--ink); border-color:var(--accent-soft-2); font-weight:700; }

  .day-nav{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .day-nav .lbl{ font-family:"Rajdhani",sans-serif; font-weight:600; font-size:1.05rem; text-transform:capitalize; flex:1; }

  /* ---------- Exercise list rows ---------- */
  .ex-row{ display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:var(--surface); }
  .ex-row + .ex-row{ margin-top:8px; }
  .ex-row-name{ font-weight:600; flex:1; min-width:0; }
  .ex-row-tags{ display:flex; gap:5px; flex-wrap:wrap; }
  .last-ref{ font-size:.68rem; color:var(--ink-2); font-family:"IBM Plex Mono",monospace; }

  /* ---------- Hoy: tarjeta de ejercicio (4 cuadros: ejercicio / series / repeticiones / kilos) ---------- */
  .day-ex-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px; margin-bottom:10px; }
  .day-ex-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .day-ex-thumb{ width:38px; height:38px; flex:none; background:var(--surface-2); border-radius:6px; }
  .day-ex-thumb svg{ width:100%; height:100%; display:block; }
  .day-ex-name{ font-family:"Rajdhani",sans-serif; font-weight:700; font-size:1.05rem; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .day-ex-fields{ display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:8px; }
  .day-field{ background:var(--surface-2); border:1px solid var(--line); border-radius:6px; padding:7px 9px; min-width:0; }
  .day-field label{ margin-bottom:3px; }
  .day-field-val{ font-weight:600; font-size:.92rem; font-family:"Rajdhani",sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .guia{ max-width:640px; }
  .guia-root{ font-family:"Rajdhani",sans-serif; font-weight:700; font-size:1.25rem; letter-spacing:.04em; padding-bottom:10px; border-bottom:2px solid var(--accent); }
  .guia-tree{ list-style:none; margin:0; padding:6px 0 0 14px; border-left:2px solid var(--line); margin-left:10px; }
  .guia-tree > li{ position:relative; display:flex; gap:10px; align-items:flex-start; padding:12px 0 4px 14px; }
  .guia-tree > li::before{ content:""; position:absolute; left:-14px; top:26px; width:22px; border-top:2px solid var(--line); }
  .guia-tree > li.ok .guia-t{ color:var(--good); }
  .guia-tree > li.ok ul{ opacity:.6; }
  .guia-t{ font-family:"Rajdhani",sans-serif; font-weight:700; font-size:1.05rem; letter-spacing:.03em; }
  .guia-tree ul{ margin:4px 0 0; padding-left:16px; font-size:.9rem; color:var(--ink-2); }
  .guia-tree ul li{ margin:2px 0; }
  .guia-tree code{ font-size:.82rem; background:var(--surface-2); padding:1px 4px; border-radius:4px; }
  .guia-chk{ flex:0 0 auto; width:30px; height:30px; border-radius:50%; border:2px solid var(--line); background:var(--surface); color:transparent; display:grid; place-items:center; cursor:pointer; margin-top:-2px; }
  .guia-chk svg{ width:16px; height:16px; }
  .guia-tree > li.ok .guia-chk{ background:var(--good); border-color:var(--good); color:#fff; }
  .guia-foot{ margin-top:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:.88rem; color:var(--ink-2); }
  .day-ex-card.has-agr .day-ex-fields{ grid-template-columns:2fr 1fr 1fr 1fr 1.25fr; }
  .agr-field label{ color:var(--accent); }
  .agr-row{ display:flex; align-items:center; gap:8px; }
  .agr-row select{ flex:1 1 auto; min-width:0; }
  .lift-total{ flex:0 0 auto; font-family:"Rajdhani",sans-serif; font-weight:700; font-size:1.25rem; line-height:1; color:var(--accent); }
  .lift-total small{ font-size:.7rem; margin-left:2px; opacity:.85; }
  .day-field select{ padding:5px 4px; font-family:"IBM Plex Mono",monospace; font-weight:600; background:var(--surface); border-color:var(--line); }
  .day-ex-foot{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .last-ref{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .day-ex-foot-actions{ display:flex; gap:6px; align-items:center; flex:none; }

  /* ---------- Reordenar ejercicios: flechas subir/bajar + arrastrar (grip) ---------- */
  .drag-handle{ cursor:grab; touch-action:none; -webkit-user-select:none; user-select:none; }
  .drag-handle:active{ cursor:grabbing; }
  .day-ex-card.dragging, .semana-slot.dragging{ opacity:.55; box-shadow:var(--shadow); position:relative; z-index:2; }
  .day-ex-card.dragging *, .semana-slot.dragging *{ user-select:none; }

  /* ---------- Agregar ejercicio a mano (texto libre, en vez del desplegable) ---------- */
  .manual-ex-row{ display:flex; align-items:center; gap:6px; }
  .manual-ex-row input[type="text"]{ flex:1; min-width:0; padding:6px 7px; font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:.85rem; background:var(--surface); border:1px solid var(--line); border-radius:6px; color:var(--ink); }
  .manual-ex-row .btn-icon{ flex:none; }

  /* ---------- Grids ---------- */
  .ex-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
  .ex-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px; cursor:pointer; display:flex; flex-direction:column; gap:8px; }
  .ex-card:hover{ border-color:var(--ink-2); }
  .ex-card-top{ display:flex; gap:10px; align-items:center; }
  .ex-thumb{ width:44px; height:44px; flex:none; background:var(--surface-2); border-radius:6px; }
  .ex-thumb svg{ width:100%; height:100%; }
  .ex-card h4{ font-family:"Rajdhani",sans-serif; font-weight:600; font-size:1rem; }
  .ex-card .cat{ font-size:.72rem; color:var(--ink-2); }
  .filter-bar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }

  .focus-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:10px; }
  .focus-tile{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 8px 12px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; text-align:center; }
  .focus-tile:hover{ border-color:var(--ink-2); }
  .focus-tile.active{ border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 1px var(--accent) inset; }
  .focus-tile-icon{ width:58px; height:58px; }
  .focus-tile-icon svg{ width:100%; height:100%; display:block; }
  .focus-tile-label{ font-family:"Rajdhani",sans-serif; font-weight:700; font-size:.95rem; }

  .week-summary th{ font-size:.68rem; text-transform:uppercase; color:var(--ink-2); letter-spacing:.06em; }

  /* ---------- Muscle mannequin ---------- */

  .mann-fig-label{ text-align:center; font-size:.68rem; color:var(--ink-2); text-transform:uppercase; letter-spacing:.07em; margin-top:4px; }
  .m-region{ fill:var(--skin-shade); stroke:var(--skin-line); stroke-width:1.4; transition:fill .15s; }
  .m-region.primary{ fill:var(--accent); stroke:var(--accent-ink); stroke-width:1; }
  .m-region.secondary{ fill:var(--accent-soft-2); stroke:var(--accent); stroke-width:1; }
  .m-outline{ fill:var(--skin); stroke:var(--skin-line); stroke-width:1.4; }
  .m-shade{ fill:var(--skin-line); opacity:.28; stroke:none; }

  .muscle-legend-item .chip-dot.secondary{ background:var(--accent-soft-2); border:1px solid var(--accent); }

  /* ---------- Exercise detail / pattern demo ---------- */

  .demo-part.demo-active{ stroke:var(--accent); }
  .demo-head{ fill:var(--skin); stroke:var(--skin-line); stroke-width:1.5; }
  .cues-list{ margin:0; padding-left:18px; font-size:.88rem; }

  .detail-head{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:16px; }

  /* ---------- Progress ---------- */
  .chart-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:18px; }
  .chart-card canvas{ max-height:280px; }
  .pr-table{ width:100%; border-collapse:collapse; }
  .pr-table th, .pr-table td{ text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); font-size:.86rem; }
  .pr-table th{ font-size:.68rem; text-transform:uppercase; color:var(--ink-2); letter-spacing:.06em; }

  /* ---------- Modal / Drawer ---------- */

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:20px; font-size:.85rem; font-weight:600; z-index:80; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }

  .rules-list{ margin:0; padding-left:18px; font-size:.86rem; }

  .semana-tabs{ display:flex; gap:6px; flex-wrap:wrap; }

  .semana-tab-count{ background:rgba(0,0,0,.18); border-radius:10px; padding:1px 6px; font-size:.7rem; font-family:"IBM Plex Mono",monospace; }

  .semana-slot-list{ display:flex; flex-direction:column; gap:8px; }
  .semana-slot{ display:flex; gap:6px; align-items:center; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--surface-2); flex-wrap:wrap; }
  .semana-slot select{ padding:7px 6px; font-size:.85rem; }
  .semana-slot select[data-action="semana-ex"]{ flex:1; min-width:170px; }
  .semana-slot input[type="text"]{ flex:1; min-width:170px; padding:7px 8px; font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:.85rem; background:var(--surface); border:1px solid var(--line); border-radius:6px; color:var(--ink); }
  .semana-slot select[data-action="semana-sets"], .semana-slot select[data-action="semana-reps"]{ width:58px; text-align:center; }
  .semana-slot-x{ color:var(--ink-2); font-size:.8rem; }
  .semana-slot-thumb{ width:30px; height:30px; flex:none; background:var(--surface); border-radius:6px; }
  .semana-slot-thumb svg{ width:100%; height:100%; display:block; }

  /* ---------- Mobile ---------- */
  .bottombar{ display:none; }
  @media (max-width: 760px){
    #app{ grid-template-columns:1fr; }
    .sidebar{ display:none; }
    .toptabs{ display:none; }
    main{ padding-bottom:64px; }

      display:flex; position:fixed; bottom:0; left:0; right:0; z-index:40;

    }

    .view{ padding:16px 14px 30px; }

    .topbar h1{ font-size:1.3rem; }
    .timer-box{ order:3; flex:1 1 100%; gap:5px; padding:7px 8px; }

    .timer-box{ gap:3px; }

    .timer-box .btn-icon{ width:27px; }

  }

  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

  /* pattern-demo keyframes */
  @keyframes pose-push{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(10px);} }
  @keyframes pose-arm-push{ 0%,100%{ transform:rotate(0deg);} 50%{ transform:rotate(-28deg);} }
  @keyframes pose-arm-pull{ 0%,100%{ transform:rotate(-8deg);} 50%{ transform:rotate(46deg);} }
  @keyframes pose-torso-hinge{ 0%,100%{ transform:rotate(0deg);} 50%{ transform:rotate(38deg);} }
  @keyframes pose-leg-squat{ 0%,100%{ transform:rotate(0deg) translateY(0);} 50%{ transform:rotate(24deg) translateY(6px);} }
  @keyframes pose-shin-squat{ 0%,100%{ transform:rotate(0deg);} 50%{ transform:rotate(-40deg);} }
  @keyframes pose-arm-curl{ 0%,100%{ transform:rotate(0deg);} 50%{ transform:rotate(-70deg);} }
  @keyframes pose-heel{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-8px);} }
  @keyframes pose-plank{ 0%,100%{ transform:translateY(0) rotate(0deg);} 50%{ transform:translateY(2px) rotate(1.5deg);} }

  /* ---------- Fotos de ejercicios + mapa muscular ---------- */
  .ph-thumb{ width:100%; height:100%; object-fit:cover; display:block; border-radius:inherit; }
  .ex-card .ex-photo{ position:relative; aspect-ratio:3/2; margin:-12px -12px 0; border-radius:var(--radius) var(--radius) 0 0; overflow:hidden; background:#111; }
  .ex-card .ex-photo img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 30%; }
  .ex-card .ex-photo img.f1{ opacity:0; transition:opacity .35s; }
  .ex-card:hover .ex-photo img.f1{ animation:phswap 1.6s infinite; }
  .ex-photo-tag{ position:absolute; left:8px; bottom:8px; background:rgba(0,0,0,.6); color:#fff; font-size:.66rem; font-weight:600; padding:2px 7px; border-radius:10px; letter-spacing:.04em; text-transform:uppercase; }
  .ex-card .ex-card-body{ display:flex; gap:10px; align-items:center; }
  .ex-card .ex-mini{ width:34px; height:34px; flex:none; background:var(--surface-2); border-radius:6px; }
  .ex-card .ex-mini svg{ width:100%; height:100%; }
  .ex-grid.photos{ grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); }
  @media (max-width:760px){ .ex-grid.photos{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; } .ex-grid.photos .ex-card h4{ font-size:.92rem; } .ex-grid.photos .ex-mini{ display:none; } }
  .ph-demo{ position:relative; width:100%; aspect-ratio:3/2; background:#111; border-radius:10px; overflow:hidden; cursor:pointer; margin-bottom:16px; }
  .ph-demo img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .ph-demo img.f1, .ph-demo .t1{ animation:phswap 2.4s infinite; }
  .ph-demo .t0{ animation:phswapInv 2.4s infinite; }
  .ph-demo.paused img.f1, .ph-demo.paused .t0, .ph-demo.paused .t1{ animation-play-state:paused; }
  .ph-steps-tag{ position:absolute; left:10px; top:10px; background:var(--accent); color:#fff; font-family:"Rajdhani",sans-serif; font-weight:700; font-size:.9rem; padding:3px 10px; border-radius:6px; min-width:76px; height:26px; }
  .ph-steps-tag span{ position:absolute; left:10px; top:3px; }
  .ph-pause{ position:absolute; right:10px; top:10px; background:rgba(0,0,0,.6); color:#fff; font-size:.7rem; padding:3px 8px; border-radius:10px; display:none; }
  .ph-demo.paused .ph-pause{ display:block; }
  @keyframes phswap{ 0%,42%{opacity:0} 50%,92%{opacity:1} 100%{opacity:0} }
  @keyframes phswapInv{ 0%,42%{opacity:1} 50%,92%{opacity:0} 100%{opacity:1} }
  .steps-list{ margin:0 0 14px; padding:0; list-style:none; counter-reset:st; }
  .steps-list li{ counter-increment:st; position:relative; padding:6px 0 6px 36px; font-size:.9rem; border-bottom:1px solid var(--line); }
  .steps-list li:last-child{ border-bottom:none; }
  .steps-list li::before{ content:counter(st); position:absolute; left:0; top:6px; width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; font-family:"Rajdhani",sans-serif; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:.85rem; }
  .detail-sec-title{ font-size:.85rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-2); margin:4px 0 8px; }
  .detail-cols{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:640px){ .detail-cols{ grid-template-columns:1fr; } }
  .credit{ font-size:.68rem; color:var(--ink-2); margin-top:10px; }
  .day-ex-thumb{ cursor:pointer; overflow:hidden; width:64px !important; height:64px !important; border-radius:8px !important; }
  .day-ex-thumb .ph-thumb{ object-position:center 30%; }
  .semana-slot-thumb{ width:44px !important; height:44px !important; }
  .vid-demo{ margin-bottom:16px; }

  .vid-frames{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .vid-frames figure{ margin:0; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .vid-frames img{ display:block; width:100%; aspect-ratio:432/525; object-fit:cover; }
  .vid-frames figcaption{ padding:6px 8px; font-size:.74rem; line-height:1.35; color:var(--ink-2); }
  .vid-frames figcaption b{ display:block; color:var(--accent); font-family:"Rajdhani",sans-serif; font-size:.9rem; }
  .semana-slot-thumb{ overflow:hidden; }

  .bm-card{ display:flex; gap:22px; align-items:center; flex-wrap:wrap; background:#15181b; border:1px solid #2a2f33; border-radius:12px; padding:18px 20px; margin-bottom:22px; color:#eef1ee; }

  .bm-fig svg{ width:100%; height:auto; display:block; }

  .pg-click{ cursor:pointer; }

  .pg-h3{ font-size:.82rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-2); margin:18px 0 8px; }

<script>
/* ======================= ENTRENADOR PERSONAL · CONEXIÓN A FIREBASE =======================
   Reemplaza la base de claude.ai por tu propio Firebase (proyecto entrenador-mmi).
   - Ingreso solo con Google, y solo con iturraldemartin@gmail.com (además de las reglas de Firestore).
   - Firestore guarda una copia en el celular: funciona sin internet y sincroniza cuando vuelve la señal.
   - La app usa la misma forma de hablar con la base que antes (collection/doc/onSnapshot/set/delete). */
window.__STANDALONE__ = true;
(function(){
  var CFG = {
    apiKey: "AIzaSyDkM9vnrjRnmi4M2dy89O8KfIwB7Aq_rjU",
    authDomain: "entrenador-mmi.firebaseapp.com",
    projectId: "entrenador-mmi",
    storageBucket: "entrenador-mmi.firebasestorage.app",
    messagingSenderId: "146275919296",
    appId: "1:146275919296:web:6a2f8e5edde779f0115425"
  };
  var PERMITIDO = "iturraldemartin@gmail.com";
  var resolveDb, dbPromise = new Promise(function(r){ resolveDb = r; });
  var fs = null, auth = null, ready = false;

  function el(id){ return document.getElementById(id); }
  function showLogin(msg, busy){
    var o = el("login-screen"); if(!o) return;
    o.hidden = false;
    el("login-msg").textContent = msg || "";
    el("login-btn").disabled = !!busy;
    el("login-btn").textContent = busy ? "Conectando…" : "Entrar con Google";
  }
  function hideLogin(){ var o = el("login-screen"); if(o) o.hidden = true; }

  try{
    firebase.initializeApp(CFG);
    auth = firebase.auth();
    fs = firebase.firestore();
    fs.enablePersistence({ synchronizeTabs: true }).catch(function(){ /* otro celular/pestaña o navegador sin soporte: sigue online */ });
  }catch(e){ console.error(e); }

  var provider = auth ? new firebase.auth.GoogleAuthProvider() : null;
  if(provider) provider.setCustomParameters({ login_hint: PERMITIDO, prompt: "select_account" });

  function entrar(){
    if(!auth) return;
    showLogin("", true);
    auth.signInWithPopup(provider).catch(function(e){
      var c = e && e.code || "";
      if(c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment" || c === "auth/cancelled-popup-request"){
        auth.signInWithRedirect(provider);
      } else if(c === "auth/popup-closed-by-user"){
        showLogin("Se cerró la ventana de Google. Tocá de nuevo para entrar.");
      } else if(c === "auth/network-request-failed"){
        showLogin("Sin internet. Conectate una vez para entrar; después funciona sin señal.");
      } else if(c === "auth/unauthorized-domain"){
        showLogin("Falta autorizar esta dirección en Firebase (Authentication → Configuración → Dominios autorizados).");
      } else {
        showLogin("No se pudo entrar (" + c + "). Probá de nuevo.");
      }
    });
  }

  document.addEventListener("DOMContentLoaded", function(){
    var b = el("login-btn"); if(b) b.addEventListener("click", entrar);
    var s = el("logout-btn"); if(s) s.addEventListener("click", function(){ if(auth) auth.signOut().then(function(){ location.reload(); }); });
    if(!auth){ showLogin("No se pudo cargar Firebase. Revisá la conexión y recargá."); return; }
    auth.getRedirectResult().catch(function(e){ showLogin("No se pudo entrar (" + (e && e.code) + ")."); });
    auth.onAuthStateChanged(function(u){
      if(u && (u.email || "").toLowerCase() === PERMITIDO){
        hideLogin();
        var who = el("who-email"); if(who) who.textContent = u.email;
        if(!ready){ ready = true; resolveDb(fs); }
      } else if(u){
        auth.signOut();
        showLogin("La cuenta " + u.email + " no tiene acceso. Entrá con " + PERMITIDO + ".");
      } else {
        showLogin("");
      }
    });
  });

  // Descargar archivos (copia de seguridad) directo en el celular
  var downloads = {
    save: function(o){
      return new Promise(function(res){
        var blob = new Blob([o.data], { type: "application/json" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = o.filename || "entrenador.json";
        document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); res(); }, 500);
      });
    }
  };

  window.claude = { use: function(name){
    if(name === "db") return dbPromise;
    if(name === "downloads") return Promise.resolve(downloads);
    return Promise.resolve(null);   // "sample" (Claude dentro de la app) no existe fuera de claude.ai
  }};

      navigator.serviceWorker.register("./sw.js", { updateViaCache:"none" }).then(function(reg){
        document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible") reg.update().catch(function(){}); });
      }).catch(function(){});
    });
    // Cuando entra una versión nueva, la app se recarga sola una vez (salvo con el cronómetro andando)
    var hadCtrl = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(!hadCtrl || reloaded) { hadCtrl = true; return; }
      reloaded = true;
      var t = document.getElementById("timer-box");
      if(t && t.classList.contains("running")) return;   // no cortar un entreno: se aplica al próximo arranque
      location.reload();
    });

function alarmChain(){
  if(alarmOut || !audioCtx) return alarmOut;
  const comp = audioCtx.createDynamicsCompressor();
  comp.threshold.value = -24; comp.knee.value = 0; comp.ratio.value = 20; comp.attack.value = 0.002; comp.release.value = 0.12;
  const shaper = audioCtx.createWaveShaper(), n = 1024, curve = new Float32Array(n);
  for(let i=0;i<n;i++){ const x = i*2/n-1; curve[i] = Math.tanh(2.5*x); }
  shaper.curve = curve;
  const master = audioCtx.createGain(); master.gain.value = avisoGain(); alarmMaster = master;
  comp.connect(shaper); shaper.connect(master); master.connect(audioCtx.destination);
  alarmOut = comp; return alarmOut;
}
function tone(t, dur, freq, type, peak, opts){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(opts && opts.vibrato){ const l = audioCtx.createOscillator(), lg = audioCtx.createGain(); l.frequency.value = opts.vibrato; lg.gain.value = freq*0.06; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t+dur); }
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t+0.008);
  if(opts && opts.decay){ g.gain.exponentialRampToValueAtTime(0.0001, t+dur); }
  else{ g.gain.setValueAtTime(peak, t+dur-0.03); g.gain.exponentialRampToValueAtTime(0.0001, t+dur); }
  o.connect(g); g.connect(alarmChain());

}

      o.connect(g); g.connect(alarmChain()); o.start(t); o.stop(t+1.02);

    [0, 0.9, 1.8].forEach(r=> [1047,1319,1568,2093].forEach((f,i)=> tone(t0+r+i*0.14, i===3?0.45:0.16, f*1.5, "triangle", 1.0, i===3?{decay:true}:null)) );

    [0, 0.55, 1.1].forEach((off,i)=> tone(t0+off, i===2?0.9:0.4, 2900, "sine", 1.0, { vibrato:28 }) );

  }
}

// Mantener vivo el cronómetro con la pantalla apagada: mientras corre, se reproduce en bucle un audio casi
// inaudible. Con eso el celular (Android/Chrome) trata la página como "reproduciendo audio" y no la congela
// al bloquear la pantalla, así los pitidos de cada 15 min siguen sonando. Aparece como reproducción en
// la pantalla de bloqueo ("Bitácora · cronómetro").
let keepAliveEl = null;
function keepAliveSrc(){
  const rate = 8000, n = rate; // 1 segundo, 8 bits mono
  const buf = new Uint8Array(44+n), dv = new DataView(buf.buffer);
  const w = (o,str)=>{ for(let i=0;i<str.length;i++) buf[o+i]=str.charCodeAt(i); };
  w(0,"RIFF"); dv.setUint32(4,36+n,true); w(8,"WAVE"); w(12,"fmt "); dv.setUint32(16,16,true);
  dv.setUint16(20,1,true); dv.setUint16(22,1,true); dv.setUint32(24,rate,true); dv.setUint32(28,rate,true);
  dv.setUint16(32,1,true); dv.setUint16(34,8,true); w(36,"data"); dv.setUint32(40,n,true);
  for(let i=0;i<n;i++) buf[44+i] = 128 + (i%2 ? 1 : -1); // ruido mínimo: no es silencio absoluto (algunos celulares cortan el silencio)
  let bin=""; for(let i=0;i<buf.length;i++) bin += String.fromCharCode(buf[i]);
  return "data:audio/wav;base64,"+btoa(bin);
}
// Modo "No bajar mi música": en vez del <audio> (que en Android pide el foco de audio y baja/pausa Spotify, YouTube, etc.)
// se mantiene vivo con Web Audio, que se mezcla con la música sin pedir el foco.
function keepAliveWA(){
  ensureAudio(); if(!audioCtx) return null;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.value = 30; g.gain.value = 0.0004; o.connect(g); g.connect(audioCtx.destination); o.start();
  return { paused:false, wa:true, pause(){ try{ o.stop(); o.disconnect(); g.disconnect(); }catch(e){} this.paused = true; } };
}
function startKeepAlive(){
  try{
    if(avisoMezcla){
      if(keepAliveEl && !keepAliveEl.wa){ keepAliveEl.pause(); keepAliveEl = null; }
      if(!keepAliveEl || keepAliveEl.paused) keepAliveEl = keepAliveWA();
      return;
    }
    if(keepAliveEl && keepAliveEl.wa){ keepAliveEl.pause(); keepAliveEl = null; }
    if(!keepAliveEl){
      keepAliveEl = new Audio(keepAliveSrc());
      keepAliveEl.loop = true; keepAliveEl.volume = 0.05;
      keepAliveEl.setAttribute("playsinline","");
    }
    const pr = keepAliveEl.play(); if(pr && pr.catch) pr.catch(()=>{});
    if("mediaSession" in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({ title:"Cronómetro de entreno", artist:"Entrenador Personal", album:"Aviso cada 15 min" });
      try{ navigator.mediaSession.setActionHandler("pause", ()=>{ const p2=keepAliveEl.play(); if(p2&&p2.catch) p2.catch(()=>{}); }); }catch(e){}
    }
  }catch(e){}
}
function stopKeepAlive(){
  try{ if(keepAliveEl){ keepAliveEl.pause(); } if("mediaSession" in navigator) navigator.mediaSession.metadata = null; }catch(e){}
}

function renderTimer(){

  if(!box) return;
  const runDate = runningTimerDate();
  const shownDate = runDate || todayStr();
  const ms = timerMsFor(shownDate);
  document.getElementById("timer-val").textContent = fmtClock(ms);
  box.classList.toggle("running", !!runDate);
  const startBtn = document.getElementById("timer-start"), stopBtn = document.getElementById("timer-stop");
  startBtn.disabled = !!runDate;
  startBtn.textContent = (!runDate && ms>0) ? "Continuar" : "Iniciar";
  stopBtn.disabled = !runDate;
  const dc = document.getElementById("day-close-btn"); if(dc && !dc.dataset.armed) dc.classList.toggle("done", !runDate && dayClosed(todayStr()));
  if(runDate){
    const q = Math.floor(ms/BEEP_EVERY_MS);
    if(q > lastBeepQuarter){ lastBeepQuarter = q; playBeep(`${q*15>=60?fmtDur(q*BEEP_EVERY_MS):q*15+" min"} de entreno`); toast(q*15>=120 ? `⏱ ${fmtDur(q*BEEP_EVERY_MS)} · ¿Te olvidaste de finalizar? Tocá ✎ para corregir` : `⏱ ${q*15} minutos de entreno`); }
    if(!timerTick) timerTick = setInterval(renderTimer, 1000);
  }else if(timerTick){ clearInterval(timerTick); timerTick = null; }
}
async function timerStart(){
  if(runningTimerDate()) return;
  ensureAudio();
  const d = todayStr();
  const cur = state.timers[d] || { date:d, totalMs:0, runningSince:null };
  lastBeepQuarter = Math.floor((Number(cur.totalMs)||0)/BEEP_EVERY_MS);
  startKeepAlive();
  requestWakeLock();
  await saveTimer(d, { date:d, totalMs:Number(cur.totalMs)||0, runningSince:Date.now() });
  // si el día estaba cerrado y seguís entrenando, se vuelve a abrir
  const ses = state.sessions[d];
  if(ses && ses.cerrado){ try{ await saveSession(d, Object.assign({}, ses, { cerrado:false })); }catch(_){} }
  toast("Cronómetro iniciado · suena cada 15 min");
}
async function timerStop(){
  const d = runningTimerDate();
  if(!d) return;
  const total = timerMsFor(d);
  releaseWakeLock(); stopKeepAlive();
  await saveTimer(d, { date:d, totalMs: total, runningSince:null });
  await closeDayData(d);
  toast(`✓ Día cerrado · ${fmtDur(total)} de entreno`);
  if(state.view==="hoy" || state.view==="calendario") render();
}
// Cierra el día: guarda todo lo que hiciste y lo marca como completo (lo usan "Finalizar" y 🏁).
async function closeDayData(d){
  try{ restStop(); }catch(_){}
  try{
    let entries, notes = "";
    if(dayDraft && dayDraft.dateStr===d){
      syncDayDraftFromDom();
      entries = JSON.parse(JSON.stringify(dayDraft.entries.filter(x=>x.exerciseId)));
      entries.forEach(en=>{ normalizeEntrySets(en); en.abierto = false; if(exActive(en)) en.detenido = true; });
      notes = dayDraft.notes||"";
      dayDraftDirty = false;
    } else if(state.sessions[d]){ entries = state.sessions[d].entries||[]; notes = state.sessions[d].notes||""; }
    if(entries && entries.length) await saveSession(d, { date:d, entries, notes, cerrado:true });
  }catch(_){}
}
async function dayCloseAction(el){
  const d = todayStr();
  if(dayClosed(d) && !runningTimerDate()){ toast("El día de hoy ya está terminado ✓ · tocá Iniciar si querés seguir"); return; }
  if(el && !armConfirm(el, "¿Terminar el día? Tocá de nuevo")) return;
  if(runningTimerDate()){ await timerStop(); return; }
  if(!(dayDraft && dayDraft.dateStr===d && dayDraft.entries.some(x=>x.exerciseId)) && !state.sessions[d]){ toast("No hay ejercicios cargados hoy"); return; }
  await closeDayData(d);
  toast("🏁 Día terminado · quedó como realizado");
  render();
}
// La página corre dentro de un marco de claude.ai que bloquea confirm()/alert() (devuelven "no" sin
// mostrar nada). Por eso las acciones que borran algo se confirman con un segundo toque en el mismo botón.
function armConfirm(el, label){
  if(el.dataset.armed==="1"){ clearTimeout(el._armT); el.dataset.armed=""; el.classList.remove("armed"); if(el._origHtml!=null) el.innerHTML=el._origHtml; return true; }
  el.dataset.armed="1"; el._origHtml = el.innerHTML; el.classList.add("armed");
  el.innerHTML = label;
  el._armT = setTimeout(()=>{ el.dataset.armed=""; el.classList.remove("armed"); el.innerHTML = el._origHtml; }, 3500);
  return false;
}
async function timerReset(el){
  const d = runningTimerDate() || todayStr();
  if(!timerMsFor(d)){ toast("El cronómetro ya está en cero"); return; }
  if(el && !armConfirm(el, "¿Poner en 0? Tocá de nuevo")) return;
  releaseWakeLock(); stopKeepAlive();
  await saveTimer(d, { date:d, totalMs:0, runningSince:null });
  lastBeepQuarter = 0; autoTimer = null;
  // Si ese día no hiciste ninguna serie, se borra el "arranque": el día vuelve a quedar como no entrenado.
  const ses = state.sessions[d];
  if(ses && !sessionHasWork(ses)){
    try{ await deleteSession(d); }catch(_){}
    if(dayDraft && dayDraft.dateStr===d){ dayDraft = null; dayDraftDirty = false; }
    try{ restStop(); }catch(_){}
    toast("Cronómetro en cero · el día quedó sin empezar");
  } else toast("Cronómetro en cero");
  if(state.view==="hoy" || state.view==="calendario") render();
}

// Editar a mano el tiempo de un día (por si quedó el cronómetro andando, o para cargar un día sin cronómetro).
function openTimeEdit(dateStr){
  dateStr = dateStr || runningTimerDate() || todayStr();
  const ms = timerMsFor(dateStr), running = !!(state.timers[dateStr] && state.timers[dateStr].runningSince);
  const m = Math.round(ms/60000), h = Math.floor(m/60);
  const quick = [45,60,75,90,120].map(v=>`<button type="button" class="btn btn-sm" data-action="timer-edit-quick" data-min="${v}">${v>=60?(Math.floor(v/60)+" h"+(v%60?" "+(v%60):"")):v+" min"}</button>`).join("");
  openModal(`
    <div class="modal-head"><div><h2>Tiempo de entreno</h2><div class="day-time" style="text-transform:capitalize;">${fmtDateLong(dateStr)}</div></div><button class="modal-close" data-action="close-modal">${ICON.close}</button></div>
    ${running?`<div class="reset-banner">El cronómetro de este día <b>está corriendo</b>. Al guardar se detiene y queda el tiempo que pongas acá.</div>`:""}
    <div class="field-row">
      <div class="field"><label for="te-h">Horas</label><input type="number" id="te-h" min="0" max="12" step="1" inputmode="numeric" value="${h}"></div>
      <div class="field"><label for="te-m">Minutos</label><input type="number" id="te-m" min="0" max="59" step="1" inputmode="numeric" value="${m%60}"></div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">${quick}</div>
    <div class="modal-foot">
      <button class="btn" data-action="close-modal">Cancelar</button>
      <button class="btn btn-primary" data-action="timer-edit-save" data-date="${dateStr}">Guardar</button>
    </div>`);
  const hi=document.getElementById("te-h"); if(hi){ hi.focus(); hi.select(); }
}
async function saveTimeEdit(dateStr){
  const h = Math.max(0, parseInt(document.getElementById("te-h").value,10)||0);
  const mi = Math.max(0, parseInt(document.getElementById("te-m").value,10)||0);
  const total = (h*60+mi)*60000;
  if(total > 12*3600000){ toast("Máximo 12 horas"); return; }
  if(runningTimerDate()===dateStr){ releaseWakeLock(); stopKeepAlive(); }
  await saveTimer(dateStr, { date:dateStr, totalMs:total, runningSince:null });
  lastBeepQuarter = 0;
  closeModal();
  toast(total ? `Tiempo guardado: ${fmtDur(total)}` : "Tiempo del día en cero");
  render();
}

async function initStorage(){
  try{
    if(window.claude && window.claude.use){
      db = await window.claude.use("db");
      downloads = await window.claude.use("downloads");
    }
  }catch(e){ db=null; }

  if(db){
    state.storage = "cloud";
    db.collection("exercises").onSnapshot(snap=>{
      state.exercisesCustom = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
      render();
    }, ()=>{});
    db.doc("meta/weekplan").onSnapshot(snap=>{
      state.weekPlan = snap.exists ? snap.data() : {};
      render();
    }, ()=>{});
    db.collection("timers").onSnapshot(snap=>{
      const t={};
      snap.docs.forEach(d=>{ t[d.id]=d.data(); });
      state.timers = t;
      timerSyncBeepBase();
      render();
    }, ()=>{});
    db.collection("sessions").onSnapshot(snap=>{
      const s={}, fut={}, t=todayStr();
      // Un día futuro nunca cuenta como hecho: si se guardó algo (por abrirlo antes), queda aparte.
      snap.docs.forEach(d=>{ (d.id > t ? fut : s)[d.id]=d.data(); });
      state.sessions = s; state.futureSessions = fut;
      render();
    }, ()=>{});
  }else{
    state.storage = "local";
    localLoad();
    timerSyncBeepBase();
  }
  render();
}

// Elige de qué lado del cuerpo conviene mostrar la miniatura: si el ejercicio trabaja más músculos
// que sólo existen en la vista de espalda (espalda/glúteos/isquios/tríceps), usa esa vista — si no,
// mostrar siempre "de frente" dejaba ejercicios como Peso muerto o Jalón al pecho sin nada resaltado.
const FRONT_ONLY_MUSCLES = new Set(["pecho","abdominales","biceps","cuadriceps"]);
const BACK_ONLY_MUSCLES = new Set(["espalda","triceps","gluteos","isquios"]);
function bestMannequinView(mus, mus2){
  let front=0, back=0;
  [...(mus||[]), ...(mus2||[])].forEach(m=>{
    if(FRONT_ONLY_MUSCLES.has(m)) front++;
    if(BACK_ONLY_MUSCLES.has(m)) back++;
  });
  return back>front ? "back" : "front";
}
function mannequinThumb(mus, mus2, viewBox){
  const p = new Set(mus||[]), s = new Set((mus2||[]).filter(m=>!p.has(m)));
  return bestMannequinView(mus, mus2)==="back" ? mannequinBack(p,s,viewBox) : mannequinFront(p,s,viewBox);
}

/* ======================= RENDER: HOY ======================= */
// Each logged entry is now a single {exerciseId, series, reps, peso} row per exercise per day —
// no per-set breakdown, matching how Martin actually tracks it (una fila por ejercicio, no por serie).
function volumeFor(entries){
  let v=0; (entries||[]).forEach(en=>{ v += (Number(en.series)||0)*(Number(en.reps)||0)*(Number(en.peso)||0); });
  return v;
}
// Most recent PRIOR session (strictly before `beforeDate`) that logged this exercise with a weight.
function lastSessionFor(exId, beforeDate){
  const dates = Object.keys(state.sessions).filter(d=> !beforeDate || d<beforeDate).sort();
  for(let i=dates.length-1;i>=0;i--){
    const s = state.sessions[dates[i]];
    const en = (s.entries||[]).find(e=>e.exerciseId===exId);
    if(en && en.peso) return { date: dates[i], series: en.series, reps: en.reps, peso: en.peso };
  }
  return null;
}
function lastWeightFor(exId, beforeDate){
  const last = lastSessionFor(exId, beforeDate);
  if(!last) return null;
  return { date: last.date, weight: last.peso };
}
// Para cada ejercicio registrado desde `scopeStartDate` en adelante, compara el último peso cargado
// en el período contra el peso de la sesión inmediatamente anterior a que empezara el período.
// Devuelve cuántos ejercicios subieron de peso sobre el total de ejercicios con un registro previo
// para comparar (los que se hacen por primera vez no cuentan, no hay con qué compararlos).
function weightProgressStats(scopeStartDateStr){
  const inScopeLatest = {}; // exerciseId -> {date, peso}
  Object.keys(state.sessions).filter(d=>d>=scopeStartDateStr).sort().forEach(d=>{
    (state.sessions[d].entries||[]).forEach(en=>{
      if(!en.peso) return;
      inScopeLatest[en.exerciseId] = { date:d, peso:Number(en.peso) };
    });
  });
  let up=0, comparable=0;
  Object.keys(inScopeLatest).forEach(exId=>{
    const baseline = lastSessionFor(exId, scopeStartDateStr);
    if(!baseline) return;
    comparable++;
    if(inScopeLatest[exId].peso > Number(baseline.peso)) up++;
  });
  return { up, comparable };
}
// Prefill for a fresh (unsaved) day: series/reps come from the plan for that weekday when there is one
// (falling back to last time's numbers, then a sane default); el peso siempre se trae de la última vez
// que se cargó ese ejercicio, así solo hay que ajustarlo hacia arriba — progresión semana a semana.
/* ---- Ciclo de peso por bloques de 4 semanas (lunes a viernes), desde el lunes 05/10/2026 ----
   YA NO SE SUMA +20% AUTOMÁTICO. Cada ejercicio tiene:
     · BASE  = el peso de siempre (lo que muestra "Kilos").
     · AGREGADO = lo que vas sumando a mano en las semanas 1 y 2, a medida que el cuerpo da.
     · Lo que levantás = base + agregado (el número naranja). Se guarda en "peso" como siempre.
   Semanas 1 y 2: base + agregado (el agregado se arrastra al próximo día de ese ejercicio).
   Semana 3: vuelve a la base, sin agregados. Semana 4: descarga al 50% de la base.
   Ciclo siguiente = ESPEJO del anterior: misma base y mismos agregados del mismo día del ciclo
   anterior (sin sumar otro 20%). Si cambiás la base a mano, esa base nueva pasa para adelante. */
const CYCLE_ANCHOR = "2026-10-05"; // lunes
// El plan de incremento llega hasta fin de diciembre: 3 ciclos completos (05/10, 02/11, 30/11), el último
// termina con la descarga del 21 al 25/12. Después NO arranca otro ciclo: aparece el aviso para resetear
// todas las rutinas y los pesos quedan "sin cambios" (último peso cargado) hasta que se arme el plan nuevo.
const CYCLE_END = "2026-12-25"; // viernes, fin de la última descarga
const CYCLE_WARN_FROM = "2026-12-21"; // semana de la última descarga: aviso anticipado
const PHASES = {
  0: { f:1.00, title:"Sin cambios", what:"peso de siempre", short:"igual" },
  1: { f:1.00, title:"Fase 1", what:"base + agregado", short:"+ agregado" },
  2: { f:1.00, title:"Fase 2", what:"volvé a la base", short:"base" },
  3: { f:0.50, title:"Fase 3", what:"descarga al 50%", short:"50%" },
};
function dsToDate(ds){ return new Date(ds+"T00:00:00"); }
function daysBetween(a,b){ return Math.round((dsToDate(b)-dsToDate(a))/86400000); }
function addDays(ds,n){ const d=dsToDate(ds); d.setDate(d.getDate()+n); return todayStr(d); }
// -> {phase, cycle, cycleStart, phaseStart, phaseEnd(viernes)}
function cycleInfo(ds){
  const diff = daysBetween(CYCLE_ANCHOR, ds);
  if(diff < 0) return { phase:0, cycle:-1, cycleStart:null, phaseStart:null, phaseEnd:addDays(CYCLE_ANCHOR,-3) };
  if(ds > CYCLE_END) return { phase:0, cycle:99, ended:true, cycleStart:null, phaseStart:null, phaseEnd:null };
  const week = Math.floor(diff/7), cycle = Math.floor(week/4), wk = week%4;
  const cycleStart = addDays(CYCLE_ANCHOR, cycle*28);
  const phase = wk<=1 ? 1 : (wk===2 ? 2 : 3);
  const phaseStart = addDays(cycleStart, phase===1?0:(phase===2?14:21));
  const phaseEnd = addDays(cycleStart, phase===1?11:(phase===2?18:25));
  return { phase, cycle, cycleStart, phaseStart, phaseEnd };
}
function phaseFor(ds){ return cycleInfo(ds).phase; }
function ceilKg(x){ return Math.ceil(Math.round(x*1000)/1000); } // el round evita que 10×1.2=12.0000001 suba a 13
// ¿Este día usa base + agregado? (semanas 1 a 3 del ciclo; la descarga usa el 50% directo)
function usesBase(ds){ const p=phaseFor(ds); return p===1 || p===2; }
// Base y agregado de un registro guardado. Los registros viejos (sin "base") de la semana 1 del primer
// ciclo se cargaron con el +20% automático: se separan en base (peso de antes del ciclo) + agregado.
function entryBE(en, ds){
  const w = Number(en.peso)||0;
  if(en.base!==undefined && en.base!=="" && en.base!==null) return { base:Number(en.base)||0, extra:Number(en.extra)||0 };
  if(phaseFor(ds)===1){
    const b = baseBefore(en.exerciseId, cycleInfo(ds).cycleStart);
    if(b && w>=b) return { base:b, extra:w-b };
  }
  return { base:w, extra:0 };
}
// Última base conocida de ese ejercicio antes de la fecha (la descarga no cuenta).
function baseBefore(exId, ds){
  if(!exId) return null;
  const dates = Object.keys(state.sessions).filter(d=>d<ds).sort();
  for(let i=dates.length-1;i>=0;i--){
    const d = dates[i];
    if(cycleInfo(d).phase===3) continue;
    const en = (state.sessions[d].entries||[]).find(e=>e.exerciseId===exId);
    if(!en || !Number(en.peso)) continue;
    return entryBE(en, d).base || null;
  }
  return null;
}
function baseWeightFor(exId, ds){ return phaseFor(ds)===0 ? null : baseBefore(exId, ds); }
// Agregado sugerido (solo semanas 1 y 2): el último que usaste en esta fase; si todavía no hiciste
// ese ejercicio en la fase, el ESPEJO del ciclo anterior (mismo punto del mes pasado); si no, 0.
function suggestedExtra(exId, ds){
  const ci = cycleInfo(ds);
  if(ci.phase!==1 || !exId) return 0;
  const pick = (from, to)=>{
    const dates = Object.keys(state.sessions).filter(d=>d>=from && d<to && cycleInfo(d).phase===1).sort();
    for(let i=dates.length-1;i>=0;i--){
      const en = (state.sessions[dates[i]].entries||[]).find(e=>e.exerciseId===exId);
      if(en && Number(en.peso)) return entryBE(en, dates[i]).extra;
    }
    return null;
  };
  const here = pick(ci.phaseStart, ds);
  if(here!==null) return here;
  if(ci.cycle>0){ const m = pick(addDays(ci.phaseStart,-28), addDays(ds,-27)); if(m!==null) return m; }
  return 0;
}
// Peso sugerido para un día sin guardar -> {peso, base?, extra?}
function suggestedBE(exId, ds){
  const ph = phaseFor(ds);
  const last = lastSessionFor(exId, ds);
  const lastW = last && Number(last.peso) ? Number(last.peso) : null;
  if(ph===0 || !exId) return { peso: last ? last.peso : "" };
  const b = baseBefore(exId, ds) || lastW;
  if(!b) return ph===3 ? { peso:"" } : { peso:"", base:"", extra:0 };
  if(ph===3) return { peso:String(ceilKg(b*0.5)) };
  const extra = ph===1 ? suggestedExtra(exId, ds) : 0;
  return { peso:String(b+extra), base:String(b), extra };
}
function suggestedWeight(exId, ds){ return suggestedBE(exId, ds).peso; }
// Kilos totales de un registro: base + agregado.
function applyBE(en){ if(en.base!==undefined){ en.extra = Number(en.extra)||0; en.peso = Number(en.base) ? String(Number(en.base)+en.extra) : ""; } }
function fmtShort(ds){ return ds.slice(8,10)+"/"+ds.slice(5,7); }
function prefillEntry(exId, dateStr, planSeries, planReps){
  const last = lastSessionFor(exId, dateStr);
  const sw = exId ? suggestedBE(exId, dateStr) : (usesBase(dateStr) ? { peso:"", base:"", extra:0 } : { peso:"" });
  return Object.assign({
    series: planSeries!=null ? planSeries : (last ? last.series : 3),
    reps: planReps!=null ? planReps : (last ? last.reps : 10),
  }, sw);
}

let dayDraft = null; // {dateStr, entries, notes} — the day currently shown/edited on la pestaña Hoy
// Se pone en true apenas se agrega o saca un ejercicio a mano (antes de guardar el día), para que un
// render() de fondo (por ejemplo, al guardar un ejercicio nuevo desde "Agregar manual") no pise esos
// cambios todavía no guardados reconstruyendo el día desde cero.
let dayDraftDirty = false;

function syncDayDraftFromDom(){
  if(!dayDraft) return;
  const root = document.getElementById("day-editor");
  if(!root) return;
  root.querySelectorAll('[data-role="series"]').forEach(sel=>{ const en=dayDraft.entries[Number(sel.dataset.ei)]; if(en) en.series = sel.value; });
  root.querySelectorAll('[data-role="reps"]').forEach(sel=>{ const en=dayDraft.entries[Number(sel.dataset.ei)]; if(en) en.reps = sel.value; });
  root.querySelectorAll('[data-role="peso"]').forEach(sel=>{ const en=dayDraft.entries[Number(sel.dataset.ei)]; if(!en) return; if(en.base!==undefined){ en.base = sel.value; applyBE(en); } else en.peso = sel.value; });
  root.querySelectorAll('[data-role="extra"]').forEach(sel=>{ const en=dayDraft.entries[Number(sel.dataset.ei)]; if(!en) return; en.extra = Number(sel.value)||0; applyBE(en); });
  root.querySelectorAll('[data-role="set-reps"]').forEach(sel=>{ const en=dayDraft.entries[Number(sel.dataset.ei)]; const st=en&&en.detalle&&en.detalle[Number(sel.dataset.si)]; if(st) st.reps = sel.value; });
  root.querySelectorAll('[data-role="set-peso"]').forEach(sel=>{ const en=dayDraft.entries[Number(sel.dataset.ei)]; const st=en&&en.detalle&&en.detalle[Number(sel.dataset.si)]; if(st) st.peso = sel.value; });
}
// Capture in-progress dropdown choices keyed by exerciseId (not raw array index) so they can be
// re-applied after a full rebuild — a rebuild happens on every visit to "Hoy" so a plan change made
// elsewhere shows up immediately, but we still don't want to wipe a selection mid-edit.
function captureTypedValues(forDate){
  if(!dayDraft || dayDraft.dateStr !== forDate) return null;
  const root = document.getElementById("day-editor");
  if(!root) return null;
  const vals = {};
  root.querySelectorAll('[data-role="series"]').forEach(sel=>{ const en=dayDraft.entries[Number(sel.dataset.ei)]; if(!en) return; vals[en.exerciseId]=vals[en.exerciseId]||{}; vals[en.exerciseId].series=sel.value; });
  root.querySelectorAll('[data-role="reps"]').forEach(sel=>{ const en=dayDraft.entries[Number(sel.dataset.ei)]; if(!en) return; vals[en.exerciseId]=vals[en.exerciseId]||{}; vals[en.exerciseId].reps=sel.value; });
  return { vals };
}
function applyTypedValues(draft, captured){
  if(!captured) return;
  draft.entries.forEach(en=>{
    const v = captured.vals[en.exerciseId];
    if(v){ if(v.series!==undefined) en.series=v.series; if(v.reps!==undefined) en.reps=v.reps; if(v.peso!==undefined) en.peso=v.peso; }
  });
}
function buildDayEditState(dateStr){
  const dow = dowKeyFromDate(new Date(dateStr+"T00:00:00"));
  const existing = state.sessions[dateStr] || (state.futureSessions||{})[dateStr];
  let entries;
  if(existing){
    // migra registros viejos (con sets[] por serie) al formato nuevo de una fila por ejercicio, por las dudas.
    entries = JSON.parse(JSON.stringify(existing.entries||[])).map(en=>{
      if(en.series===undefined && Array.isArray(en.sets)){
        const withW = en.sets.filter(s=>s.weight);
        const maxW = withW.length ? Math.max(...withW.map(s=>Number(s.weight)||0)) : "";
        return { exerciseId: en.exerciseId, series: en.sets.length||3, reps: (en.sets[0]&&en.sets[0].reps)||10, peso: maxW };
      }
      return en;
    });
    // semanas 1 a 3: separar base + agregado para mostrarlos (no cambia nada guardado hasta que guardes)
    if(usesBase(dateStr)) entries.forEach(en=>{
      if(!en.exerciseId || en.base!==undefined) return;
      if(Number(en.peso)){ const be = entryBE(en, dateStr); en.base = String(be.base); en.extra = be.extra; }
      else { en.base = ""; en.extra = 0; }
    });
  }else{
    const planned = state.weekPlan[dow] || [];
    // progressive overload: series/reps del plan, peso de la última vez — solo hay que ajustar el peso hacia arriba.
    entries = planned.map(it=> Object.assign({exerciseId: it.exerciseId}, prefillEntry(it.exerciseId, dateStr, it.sets, it.reps)));
  }
  return { dateStr, entries, notes: existing?(existing.notes||""):"" };
}
function gotoDay(dateStr){
  state.hoyDate = dateStr;
  state.view = "hoy";
  dayDraft = null;
  dayDraftDirty = false;
  manualEntrySlot = null;
  render();
}

function renderHoy(){
  const t = todayStr();
  const viewDate = state.hoyDate || t;
  // Rebuild fresh from the current routine/template/session cada vez que se entra al día (así una rutina
  // que acabás de asignar aparece al toque), pero si hay ejercicios agregados/quitados a mano todavía sin
  // guardar (dayDraftDirty), no se reconstruye — si no, un guardado de fondo (ej: crear un ejercicio nuevo
  // desde "Agregar manual") borraría esos cambios antes de que llegues a apretar "Guardar registro".
  if(!(dayDraft && dayDraft.dateStr===viewDate && dayDraftDirty)){
    const typed = captureTypedValues(viewDate);
    dayDraft = buildDayEditState(viewDate);
    applyTypedValues(dayDraft, typed);
  }
  const isToday = viewDate===t;

  // 7-day streak strip (always the real last 7 days, independent of the day being viewed)
  let streak = "";
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = todayStr(d);
    const has = sessionHasWork(state.sessions[ds]);
    streak += `<button class="streak-dot ${has?"done":""} ${ds===t?"today":""} ${ds===viewDate?"viewing":""}" data-action="goto-day" data-date="${ds}" title="${fmtDateLong(ds)}">${d.getDate()}</button>`;
  }

  // week / month stats (about the real current week & month)
  const now = new Date();
  const weekStart = new Date(now); weekStart.setDate(now.getDate() - ((now.getDay()+6)%7));
  const weekStartStr = todayStr(weekStart);
  const monthStartStr = todayStr(new Date(now.getFullYear(), now.getMonth(), 1));
  let sessionsThisWeek=0, sessionsThisMonth=0;
  Object.keys(state.sessions).forEach(ds=>{
    const s = state.sessions[ds];
    if(!sessionHasWork(s)) return;
    const [y,m,d] = ds.split("-").map(Number);
    const dt = new Date(y,m-1,d);
    if(dt >= new Date(weekStart.getFullYear(),weekStart.getMonth(),weekStart.getDate())) sessionsThisWeek++;
    if(y===now.getFullYear() && (m-1)===now.getMonth()) sessionsThisMonth++;
  });
  const weekProgress = weightProgressStats(weekStartStr);
  const monthProgress = weightProgressStats(monthStartStr);
  const ciNow = cycleInfo(t);
  const phNow = ciNow.phase;
  // sesiones (lun–vie) que quedan en la fase, contando hoy
  let phLeft = 0;
  if(ciNow.phaseEnd) for(let d=t; d<=ciNow.phaseEnd; d=addDays(d,1)){ const wd=dsToDate(d).getDay(); if(wd>=1&&wd<=5) phLeft++; }
  const nextStart = ciNow.phaseEnd ? addDays(ciNow.phaseEnd, 3) : t;
  const phNext = phaseFor(nextStart);
  const phRange = ciNow.ended ? "plan terminado" : (ciNow.phaseStart ? `${fmtShort(ciNow.phaseStart)} al ${fmtShort(ciNow.phaseEnd)}` : `hasta el ${fmtShort(ciNow.phaseEnd)}`);
  const resetBanner = t > CYCLE_END
    ? `<div class="reset-banner"><b>⚠️ TERMINÓ EL PLAN DE INCREMENTO (05/10 → 25/12).</b> Hay que <b>RESETEAR TODAS LAS RUTINAS</b> y armar el plan nuevo. Mientras tanto se sugiere el último peso cargado, sin subas.</div>`
    : (t >= CYCLE_WARN_FROM ? `<div class="reset-banner"><b>⚠️ Última semana del plan.</b> El viernes 25/12 termina el plan de incremento: a partir del lunes 28/12 hay que <b>RESETEAR TODAS LAS RUTINAS</b>.</div>` : "");
  const monthPrefix = t.slice(0,7);
  const monthTimeMs = Object.keys(state.timers).filter(d=>d.startsWith(monthPrefix)).reduce((a,d)=>a+timerMsFor(d),0);
  const progressVal = (p)=> p.comparable ? `${p.up}<small> / ${p.comparable} ejerc.</small>` : `—`;

  let html = resetBanner + `<div class="stat-row">
    ${mediaTileRadio()}
    <div class="stat stat-phase"><div class="stat-label">Ciclo de peso · ${phRange}</div><div class="stat-val">${PHASES[phNow].title} <small>· ${PHASES[phNow].what}</small></div><div class="stat-foot">${ciNow.ended ? "Resetear rutinas para arrancar un plan nuevo" : `${phLeft<=1?"Última sesión de la fase":"Quedan "+phLeft+" sesiones"} · lun ${fmtShort(nextStart)}: ${nextStart>CYCLE_END ? "⚠️ resetear rutinas" : `${PHASES[phNext].title} (${PHASES[phNext].what})`}`}</div></div>
    <div class="stat"><div class="stat-label">Tiempo entrenado · mes</div><div class="stat-val">${monthTimeMs>=60000?fmtDur(monthTimeMs):"0 min"}</div><div class="stat-foot">${sessionsThisMonth} sesi${sessionsThisMonth===1?"ón":"ones"} este mes</div></div>
    ${mediaTileApps()}
  </div>`;

  const prevDate = todayStr(new Date(new Date(viewDate+"T00:00:00").getTime()-86400000));
  const nextDate = todayStr(new Date(new Date(viewDate+"T00:00:00").getTime()+86400000));
  html += `<div class="day-nav">
    <button class="btn btn-icon btn-sm" data-action="goto-day" data-date="${prevDate}" title="Día anterior">${ICON.chevL}</button>
    <div class="lbl">${isToday?"Hoy · ":""}${fmtDateLong(viewDate)}${timerMsFor(viewDate)>=60000?` <span class="day-time">· ⏱ ${fmtDur(timerMsFor(viewDate))}</span>`:""} <button class="btn btn-ghost btn-sm" data-action="timer-edit" data-date="${viewDate}" title="Editar tiempo de entreno de este día" style="padding:2px 7px;vertical-align:middle;">✎ ${timerMsFor(viewDate)>=60000?"Editar tiempo":"Cargar tiempo"}</button></div>
    <button class="btn btn-icon btn-sm" data-action="goto-day" data-date="${nextDate}" title="Día siguiente">${ICON.chevR}</button>
    ${!isToday?`<button class="btn btn-sm" data-action="goto-day" data-date="${t}">Volver a hoy</button>`:""}
  </div>`;

  html += `<div class="today-panel" id="day-editor">${dayEditorBody(dayDraft)}</div>`;
  html += `<div class="streak-row">${streak}</div>`;

  document.getElementById("view-hoy").innerHTML = html;
  wireDayEditorEvents();
}

/* ======================= RENDER: CALENDARIO ======================= */
function renderCalendario(){
  const y = state.calYear, m = state.calMonth;
  const first = new Date(y,m,1);
  const startOffset = (first.getDay()+6)%7; // monday-first
  const daysInMonth = new Date(y,m+1,0).getDate();
  const prevDays = new Date(y,m,0).getDate();

  let cells = [];
  for(let i=0;i<startOffset;i++){
    const dnum = prevDays - startOffset + 1 + i;
    cells.push({d:dnum, other:true, dateStr:null});
  }
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(y,m,d);
    cells.push({d, other:false, dateStr: todayStr(dt), dow: dowKeyFromDate(dt)});
  }
  let nextD = 1;
  while(cells.length % 7 !== 0){ cells.push({d: nextD++, other:true, dateStr:null}); }

  const t = todayStr();
  // Solo de lunes a viernes: se arma la grilla de 7 y se muestran las primeras 5 columnas de cada semana.
  let grid = DOW.slice(0,5).map(k=>`<div class="cal-dow">${DOW_LABEL[k].slice(0,3)}</div>`).join("");
  cells.forEach((c,ci)=>{
    if(ci%7>=5) return;
    if(c.other){ grid += `<div class="cal-cell other"><div class="cal-daynum">${c.d}</div></div>`; return; }
    const planItems = state.weekPlan[c.dow] || [];
    const session = state.sessions[c.dateStr];
    const hasData = sessionHasWork(session);
    const done = hasData && dayClosed(c.dateStr);
    const logged = hasData && (c.dateStr < t || done);  // pasado, o hoy ya cerrado / con todas las series hechas
    const inProgress = hasData && c.dateStr === t && !done;
    const mark = hasData ? null : dayMark(c.dateStr);   // si entrenaste ese día, cuenta normal
    const hol = FERIADOS_2026[c.dateStr] && !mark ? (FERIADOS_2026[c.dateStr]) : null;
    const missed = !hasData && !mark && planItems.length && c.dateStr < t;
    const tag = planItems.length ? `${planItems.length} ejercicio${planItems.length===1?"":"s"}` : "Descanso";
    grid += `<button class="cal-cell ${c.dateStr===t?"today":""} ${logged?"logged":""} ${mark?"marked mk-"+mark.tipo:""}" data-action="cal-day-detail" data-date="${c.dateStr}">
      ${mark?`<span class="cal-wm" aria-hidden="true">${DAY_MARKS[mark.tipo].wm}</span>`:""}
      <div class="cal-daynum-row"><span class="cal-daynum">${c.d}</span>${logged?'<span class="cal-dot done" title="Registrado"></span>':(missed?'<span class="cal-dot missed" title="Planificado, sin registrar"></span>':"")}</div>
      ${mark?`<span class="cal-mark">${DAY_MARKS[mark.tipo].icon} ${mark.motivo||DAY_MARKS[mark.tipo].label}</span>`:`<span class="cal-tag ${planItems.length?"":"rest"}">${tag}</span>`}
      ${hol?`<span class="cal-hol">🏋️ ${hol.motivo||"Feriado"} · gym abierto</span>`:""}
      ${(!mark && planItems.length && phaseFor(c.dateStr)>0)?`<span class="cal-phase ph${phaseFor(c.dateStr)}">${PHASES[phaseFor(c.dateStr)].short}</span>`:""}
      ${logged?`<span class="cal-check">✓ Registrado</span>`:""}
      ${inProgress?`<span class="cal-check" style="color:var(--accent)">● En curso</span>`:""}
      ${timerMsFor(c.dateStr)>=60000?`<span class="cal-time">⏱ ${fmtDur(timerMsFor(c.dateStr))}</span>`:""}
    </button>`;
  });

  // week summary within month — conteos simples (sesiones, ejercicios, series), nunca una suma de kilos
  // (series×reps×peso mezclado en un solo número confunde más de lo que aclara: ver charla con Martin).
  let weekRows = "";
  for(let i=0;i<cells.length;i+=7){
    const week = cells.slice(i,i+5).filter(c=>!c.other);
    if(!week.length) continue;
    let sessions=0, exCount=0, seriesCount=0, timeMs=0;
    week.forEach(c=>{
      timeMs += timerMsFor(c.dateStr);
      const s = state.sessions[c.dateStr];
      if(sessionHasWork(s) && c.dateStr <= t){
        sessions++;
        exCount += s.entries.length;
        s.entries.forEach(en=>{ seriesCount += Number(en.series)||0; });
      }
    });
    const label = week[0].dateStr.slice(8)+" – "+week[week.length-1].dateStr.slice(8)+" "+MONTHS[m].slice(0,3);
    weekRows += `<tr><td>Semana ${label}</td><td class="mono">${sessions}</td><td class="mono">${exCount}</td><td class="mono">${seriesCount}</td><td class="mono">${timeMs>=60000?fmtDur(timeMs):"—"}</td></tr>`;
  }

  document.getElementById("view-calendario").innerHTML = `
    <div class="cal-nav">
      <button class="btn btn-icon" data-action="cal-prev">${ICON.chevL}</button>
      <div class="cal-month-label display">${MONTHS[m]} ${y}</div>
      <button class="btn btn-icon" data-action="cal-next">${ICON.chevR}</button>
      <button class="btn btn-sm" data-action="cal-today" style="margin-left:auto">Hoy</button>
    </div>
    <div class="cal-grid">${grid}</div>
    ${monthComplianceHtml(y, m)}
    <div class="week-summary">
      <h2 style="font-size:1rem;margin-bottom:6px;">Resumen por semana</h2>
      <table><thead><tr><th>Semana</th><th>Sesiones</th><th>Ejercicios</th><th>Series totales</th><th>Tiempo</th></tr></thead><tbody>${weekRows}</tbody></table>
    </div>
  `;
}

/* ======================= RENDER: PROGRESO ======================= */
// Gráficos propios en SVG (sin librerías externas). A = semana/mes de referencia (azul, línea punteada),
// B = semana/mes a comparar (naranja, línea llena).
let PGW = 640;
const PG = { w1A:null, w1B:null, w2A:null, w2B:null, mode:"semana", dA:null, dB:null };
const DOW_SHORT = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const MES_CORTO = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function nf(n, dec){ return Number(n||0).toLocaleString("es-AR",{maximumFractionDigits:dec||0, minimumFractionDigits:0}); }
function mondayOf(ds){ const d=dsToDate(ds); const k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); return todayStr(d); }
function dayKg(ds){ const s=state.sessions[ds]; return s ? volumeFor(s.entries) : 0; }
function dayMin(ds){ return (timerMsFor(ds)||0)/60000; }
// ¿Ese día se entrenó de verdad? Cuenta si tildaste al menos una serie, si tocaste "Guardar registro"
// o "Finalizar", o si es un registro viejo (sin series una por una). Abrir un ejercicio para mirarlo NO cuenta.
function sessionHasWork(s){
  if(!s || !Array.isArray(s.entries) || !s.entries.length) return false;
  if(s.registrado || s.cerrado) return true;
  return s.entries.some(e=> e.exerciseId && (Array.isArray(e.detalle) ? e.detalle.some(z=>z.ok) : (Number(e.peso)||Number(e.series))));
}
// Día cerrado: tocaste "Finalizar" en el cronómetro, o hiciste todas las series de todos los ejercicios.
function dayClosed(ds){
  const s = state.sessions[ds]; if(!s) return false;
  if(s.cerrado) return true;
  const ens = (s.entries||[]).filter(e=>e.exerciseId);
  return ens.length>0 && ens.every(e=> Array.isArray(e.detalle) && e.detalle.length>0 && e.detalle.every(z=>z.ok));
}
function dayTrained(ds){ return sessionHasWork(state.sessions[ds]); }
function fmtMin(m){ m=Math.round(m||0); if(m<60) return m+" min"; return Math.floor(m/60)+" h "+String(m%60).padStart(2,"0")+" min"; }
function weekLabel(mon){
  const a=dsToDate(mon), b=dsToDate(addDays(mon,4));
  return a.getMonth()===b.getMonth() ? `${a.getDate()}–${b.getDate()} ${MES_CORTO[b.getMonth()]}` : `${a.getDate()} ${MES_CORTO[a.getMonth()]}–${b.getDate()} ${MES_CORTO[b.getMonth()]}`;
}
function monthLabel(ym){ const [y,m]=ym.split("-").map(Number); return MONTHS[m-1].replace(/^./,c=>c.toUpperCase())+" "+y; }
function allWeeks(){
  const ds = Object.keys(state.sessions).filter(dayTrained).concat(Object.keys(state.timers||{}).filter(d=>dayMin(d)>0));
  const cur = mondayOf(todayStr());
  if(!ds.length) return [cur];
  let w = mondayOf(ds.sort()[0]); const out=[];
  while(w<=cur){ out.push(w); w=addDays(w,7); }
  return out;
}
function weeksWithData(){ return allWeeks().filter(w=>[0,1,2,3,4,5,6].some(i=>dayTrained(addDays(w,i))||dayMin(addDays(w,i))>0)); }
function allMonths(){ return Array.from(new Set(allWeeks().flatMap(w=>[w.slice(0,7), addDays(w,6).slice(0,7)]))).filter(m=>m<=todayStr().slice(0,7)).sort(); }
function defaultPair(){
  const wd = weeksWithData(); const cur = mondayOf(todayStr());
  const B = wd.includes(cur) ? cur : (wd[wd.length-1] || cur);
  const before = wd.filter(w=>w<B); const A = before.length ? before[before.length-1] : addDays(B,-7);
  return [A,B];
}
function weekOptions(sel){
  const byMonth = {};
  allWeeks().slice().reverse().forEach(w=>{ const m=addDays(w,4).slice(0,7); (byMonth[m]=byMonth[m]||[]).push(w); });
  return Object.keys(byMonth).sort().reverse().map(m=>`<optgroup label="${monthLabel(m)}">${byMonth[m].map(w=>`<option value="${w}" ${w===sel?"selected":""}>Semana ${weekLabel(w)}</option>`).join("")}</optgroup>`).join("");
}
function monthOptions(sel){ return allMonths().slice().reverse().map(m=>`<option value="${m}" ${m===sel?"selected":""}>${monthLabel(m)}</option>`).join(""); }
function rangeOf(kind, key){
  if(kind==="semana") return [key, addDays(key,6)];
  const [y,m]=key.split("-").map(Number); const last=new Date(y,m,0).getDate();
  return [key+"-01", key+"-"+String(last).padStart(2,"0")];
}
