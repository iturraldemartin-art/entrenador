/* ---- Detalle de un día (desde el Calendario) ---- */
// Nunca mezcla series×reps×peso en una sola suma: por ejercicio muestra series/reps/kilos tal cual
// se cargaron, y el cambio de peso vs. la vez anterior que se hizo ese ejercicio (▲/▼/=), que es lo
// que realmente sirve para ver si hubo progreso. Los totales del día son conteos simples (ejercicios,
// series), nunca kilos sumados.
function dayDetailHtml(dateStr){
  const session = state.sessions[dateStr];
  const entries = (session && session.entries) || [];
  const dow = dowKeyFromDate(new Date(dateStr+"T00:00:00"));
  const planItems = state.weekPlan[dow] || [];
  const tms = timerMsFor(dateStr);
  const head = `<div class="modal-head"><div><h2 style="text-transform:capitalize;">${fmtDateLong(dateStr)}</h2>${tms>=60000?`<div class="day-time">⏱ Tiempo de entreno: ${fmtDur(tms)}</div>`:""}`;

  if(!entries.length && planItems.length){
    // Vista previa del día planificado: series×reps de la rutina + peso sugerido por el ciclo (base + agregado / base / 50%).
    const ph = phaseFor(dateStr), isFut = dateStr > todayStr();
    const phLbl = ph===0 ? (dateStr > CYCLE_END ? "Plan terminado · peso de siempre" : "Sin cambios · peso de siempre") : `${PHASES[ph].title} · ${PHASES[ph].what}`;
    let tSeries = 0;
    const prow = planItems.map(it=>{
      const ex = exerciseById(it.exerciseId);
      const pf = prefillEntry(it.exerciseId, dateStr, it.sets, it.reps);
      tSeries += Number(pf.series)||0;
      const b = ph>0 ? baseWeightFor(it.exerciseId, dateStr) : null;
      const ref = b ? (ph===1 ? `base ${b}${Number(pf.extra)?` + ${pf.extra} agregado`:""} kg` : ph===2 ? `base ${b} kg` : `50% de ${b} kg`) : (pf.peso ? "último peso" : "sin dato");
      // Cuánto cambia contra el último peso que cargaste de verdad en ese ejercicio
      const lastS = lastSessionFor(it.exerciseId, dateStr);
      let dHtml = '<span style="color:var(--ink-2)">—</span>';
      if(lastS && Number(lastS.peso) && Number(pf.peso)){
        const lw = Number(lastS.peso), nw = Number(pf.peso), df = nw - lw;
        const pc = Math.round(nw/lw*100);
        const when = `<div style="color:var(--ink-2);font-size:.7rem;">vs ${lw} kg · ${fmtShort(lastS.date)}</div>`;
        if(df>0) dHtml = `<span style="color:var(--good);font-weight:700;">▲ +${df} kg</span>${when}`;
        else if(df<0) dHtml = `<span style="color:${ph===3?"var(--cat-1)":"var(--danger)"};font-weight:700;">▼ ${df} kg${ph===3?" (50%)":""}</span>${when}`;
        else dHtml = `<span style="color:var(--ink-2);font-weight:700;">= igual</span>${when}`;
      } else if(Number(pf.peso)) dHtml = '<span style="color:var(--ink-2)">primera vez</span>';
      return `<tr><td>${ex ? ex.n : it.exerciseId}<div style="color:var(--ink-2);font-size:.72rem;">${ref}</div></td><td class="num">${pf.series}×${pf.reps}</td><td class="num"><b>${pf.peso ? pf.peso+" kg" : "—"}</b></td><td class="num" style="font-size:.82rem;">${dHtml}</td></tr>`;
    }).join("");
    return `${head}<div style="color:var(--ink-2);font-size:.85rem;">${planItems.length} ejercicio${planItems.length===1?"":"s"} · ${tSeries} series · ${isFut?"planificado":"sin registrar"}</div></div>
      <button class="modal-close" data-action="close-modal">${ICON.close}</button></div>
      <div class="rules-note"><b>${phLbl}</b>${isFut?" · pesos sugeridos según lo cargado hasta hoy (se recalculan cuando registres los días anteriores)":""}</div>
      <table class="pr-table"><thead><tr><th>Ejercicio</th><th>Series×Rep</th><th>Kilos</th><th>Cambio</th></tr></thead><tbody>${prow}</tbody></table>
      <div class="modal-foot">
        <button class="btn" data-action="close-modal">Cerrar</button>
        ${dateStr===todayStr()
          ? `<button class="btn" data-action="detail-edit-day" data-date="${dateStr}">Solo abrir</button>
             <button class="btn btn-primary" data-action="detail-start-day" data-date="${dateStr}">▶ Arrancar entreno</button>`
          : `<button class="btn btn-primary" data-action="detail-edit-day" data-date="${dateStr}">${isFut?"Abrir este día":"Cargar este día"}</button>`}
      </div>`;
  }
  if(!entries.length){
    return `${head}<div style="color:var(--ink-2);font-size:.85rem;">${dateStr}</div></div>
      <button class="modal-close" data-action="close-modal">${ICON.close}</button></div>
      <p style="color:var(--ink-2);font-size:.9rem;">${planItems.length ? "Todavía no registraste este día." : "Día de descanso, sin ejercicios planificados."}</p>
      <div class="modal-foot">
        <button class="btn" data-action="close-modal">Cerrar</button>
        <button class="btn btn-primary" data-action="detail-edit-day" data-date="${dateStr}">Cargar este día</button>
      </div>`;
  }

  let totalSeries = 0;
  const catsWorked = new Set();
  const rows = entries.map(en=>{
    const ex = exerciseById(en.exerciseId);
    totalSeries += Number(en.series)||0;
    if(ex) catsWorked.add(ex.cat);
    const baseline = lastSessionFor(en.exerciseId, dateStr);
    let deltaHtml = '<span style="color:var(--ink-2)">primera vez</span>';
    if(baseline && baseline.peso && en.peso){
      const diff = Number(en.peso) - Number(baseline.peso);
      if(diff>0) deltaHtml = `<span style="color:var(--good)">▲ +${diff} kg</span>`;
      else if(diff<0) deltaHtml = `<span style="color:var(--danger)">▼ ${diff} kg</span>`;
      else deltaHtml = `<span style="color:var(--ink-2)">= igual</span>`;
    }
    return `<tr>
      <td>${ex ? ex.n : en.exerciseId}</td>
      <td class="num">${en.series||"—"}×${en.reps||"—"}</td>
      <td class="num">${en.peso ? en.peso+" kg" : "—"}</td>
      <td class="num">${deltaHtml}</td>
    </tr>`;
  }).join("");

  const catChips = [...catsWorked].map(c=>`<span class="chip">${c}</span>`).join("");

  return `${head}<div style="color:var(--ink-2);font-size:.85rem;">${entries.length} ejercicio${entries.length===1?"":"s"} · ${totalSeries} series en total</div></div>
    <button class="modal-close" data-action="close-modal">${ICON.close}</button></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">${catChips}</div>
    <table class="pr-table"><thead><tr><th>Ejercicio</th><th>Series×Rep</th><th>Kilos</th><th>Vs. anterior</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="modal-foot">
      <button class="btn" data-action="close-modal">Cerrar</button>
      <button class="btn btn-primary" data-action="detail-edit-day" data-date="${dateStr}">Editar este día</button>
    </div>`;
}

/* ---- Agregar ejercicio "a mano" directo desde el desplegable ----
   Elegís "➕ Agregar a mano" en el select de ejercicio y, en ese mismo casillero, aparece un campo de
   texto con el teclado listo para escribir el nombre — sin abrir ningún formulario aparte. Al confirmar
   se crea el ejercicio con ese nombre y queda elegido ahí mismo; las opciones ya cargadas del desplegable
   no se tocan. */
let manualEntrySlot = null; // {mode:"day", ei} | {mode:"semana", dow, i}
function startManualEntry(target){
  manualEntrySlot = target;
  if(target.mode==="day") redrawDayEditor(); else renderSemana();
  requestAnimationFrame(()=>{
    const inp = document.querySelector('input[data-role="ejercicio-manual"]');
    if(inp) inp.focus();
  });
}
function cancelManualEntry(){
  manualEntrySlot = null;
  if(dayDraft) redrawDayEditor();
  if(document.getElementById("view-semana")) renderSemana();
}
async function confirmManualEntry(){
  const target = manualEntrySlot;
  if(!target) return;
  const inp = document.querySelector('input[data-role="ejercicio-manual"]');
  const name = inp ? inp.value.trim() : "";
  if(!name){ toast("Escribí un nombre para el ejercicio"); if(inp) inp.focus(); return; }
  const ex = { id:"custom_"+uid(), n:name, cat:"Otros", mus:[], mus2:[], eq:"", pat:"push", cues:[] };
  await saveExercise(ex);
  manualEntrySlot = null;
  if(target.mode==="day" && dayDraft && dayDraft.entries[target.ei]){
    const en = dayDraft.entries[target.ei];
    en.exerciseId = ex.id;
    const last = lastSessionFor(en.exerciseId, dayDraft.dateStr);
    if(last) en.peso = last.peso;
    redrawDayEditor();
  }else if(target.mode==="semana"){
    const {dow, i} = target;
    const wp = Object.assign({}, state.weekPlan);
    const arr = (wp[dow]||[]).slice();
    if(arr[i]){
      arr[i] = Object.assign({}, arr[i], {exerciseId: ex.id});
      wp[dow] = arr;
      await saveWeekPlan(wp);
    }else{
      renderSemana();
    }
  }
  toast("Ejercicio agregado · lo estoy clasificando…");
  autoCompleteExercise(ex);
}
function renderExerciseEditor(){

/* ---- Reordenar arrastrando (además de las flechas subir/bajar de cada tarjeta/fila) ----
   Funciona con mouse y con el dedo (Pointer Events unifica los dos). Se agarra solo del "grip" (⠿),
   no de cualquier parte de la tarjeta, para no interferir con los demás controles. Mientras se arrastra
   se va reordenando en pantalla en tiempo real (se mueve el propio elemento, sin recrear el DOM); al
   soltar se aplica el nuevo orden al array real vía onCommit, que guarda/redibuja como corresponda. */
function wireDragReorder(container, itemSel, handleSel, getArr, onCommit){
  if(!container) return;
  container.querySelectorAll(handleSel).forEach(handle=>{
    handle.addEventListener("pointerdown", e=>{
      const item = handle.closest(itemSel);
      if(!item) return;
      e.preventDefault();
      const items0 = Array.from(container.querySelectorAll(itemSel));
      let order = items0.map((_,idx)=>idx); // orden actual en pantalla -> índice original en el array
      item.classList.add("dragging");
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}
      const onMove = (ev)=>{
        const items = Array.from(container.querySelectorAll(itemSel));
        const curPos = items.indexOf(item);
        if(curPos<0) return;
        const y = ev.clientY;
        let target = curPos;
        for(let i=0;i<items.length;i++){
          if(i===curPos) continue;
          const r = items[i].getBoundingClientRect();
          const mid = r.top + r.height/2;
          if(i<curPos && y<mid) target = i;
          if(i>curPos && y>mid) target = i;
        }
        if(target!==curPos){
          // usamos el padre real del elemento (puede no ser `container` directamente, si los ítems
          // están anidados dentro de un wrapper) para que insertBefore no falle.
          const parent = item.parentNode;
          if(target<curPos) parent.insertBefore(item, items[target]);
          else parent.insertBefore(item, items[target].nextSibling);
          const moved = order.splice(curPos,1)[0];
          order.splice(target,0,moved);
        }
      };
      const onUp = async (ev)=>{
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        item.classList.remove("dragging");
        const arr = getArr();
        const newArr = order.map(idx=>arr[idx]);
        await onCommit(newArr, order);
      };
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
    });
  });
}
function phaseHint(exId, dateStr){
  if(!exId) return "";
  const ph = phaseFor(dateStr);
  if(ph===0) return dateStr > CYCLE_END ? "Plan terminado · resetear rutinas · " : "Sin cambios hasta el lun 05/10 · ";
  const b = baseWeightFor(exId, dateStr);
  if(ph===1) return b ? `Sem. 1-2 · base ${b} kg + lo que agregues · ` : "Sem. 1-2 · ejercicio nuevo: cargá tu base · ";
  if(ph===2) return b ? `Sem. 3 · vuelve a la base ${b} kg, sin agregados · ` : "Sem. 3 · base, sin agregados · ";
  return b ? `Sem. 4 · descarga: 50% de ${b} → ${ceilKg(b*0.5)} kg · ` : "Sem. 4 · descarga al 50% · ";
}

function redrawDayEditor(){
  const root = document.getElementById("day-editor");
  if(!root || !dayDraft) return;
  root.innerHTML = dayEditorBody(dayDraft);
  wireDayEditorEvents();
}
function wireDayEditorEvents(){
  const root = document.getElementById("day-editor");
  if(!root) return;
  root.querySelectorAll('select[data-role="ejercicio"]').forEach(sel=>{
    sel.addEventListener("change", e=>{
      syncDayDraftFromDom();
      const ei = Number(e.target.dataset.ei);
      if(e.target.value==="__manual__"){
        startManualEntry({mode:"day", ei});
        return;
      }
      const en = dayDraft.entries[ei];
      en.exerciseId = e.target.value;
      // ejercicio nuevo en esta fila: arranca limpio (sin las series tildadas del anterior) y con su peso
      delete en.detalle; delete en.empezado; delete en.detenido; delete en.abierto; delete en.base; delete en.extra;
      Object.assign(en, suggestedBE(en.exerciseId, dayDraft.dateStr));
      if(usesBase(dayDraft.dateStr) && en.base===undefined && phaseFor(dayDraft.dateStr)!==3){ en.base = en.peso||""; en.extra = 0; }
      dayDraftDirty = true;
      redrawDayEditor();
    });
  });
}

function openBackupModal(){
  openModal(`

    <p style="color:var(--ink-2);font-size:.88rem;">Tus datos ${state.storage==="cloud"?"ya se guardan en la nube de esta herramienta y podés abrirla desde cualquier dispositivo con este mismo link.":"se guardan en este dispositivo."} Exportá un archivo cuando quieras tener tu propia copia — por ejemplo, antes de cambiar de celular.</p>
    <div class="modal-foot" style="justify-content:flex-start;flex-wrap:wrap;">
      <button class="btn btn-primary" data-action="export-json">Exportar copia (.json)</button>
      <label class="btn" style="cursor:pointer;">Importar copia<input type="file" id="import-file" accept=".json,application/json" style="display:none;"></label>
    </div>
    <p id="import-status" style="font-size:.8rem;color:var(--ink-2);margin-top:8px;"></p>
  `);
  document.getElementById("import-file").addEventListener("change", handleImportFile);
}
async function exportBackup(){
  const payload = { version:3, exportedAt:new Date().toISOString(), exercisesCustom:state.exercisesCustom, weekPlan:state.weekPlan,
    sessions:Object.assign({}, state.sessions, state.futureSessions||{}), timers:state.timers||{}, notas:exNotes||{}, dias:dayMarksDb||{} };
  const json = JSON.stringify(payload, null, 2);
  const filename = "entrenador-personal-"+todayStr()+".json";
  if(downloads){
    try{
      await downloads.save({ filename, data: json });
      toast("Copia exportada");
    }catch(e){ toast("No se pudo exportar (" + (e && e.code || "error") + ")"); }
  }else{
    toast("Exportación no disponible en esta vista");
  }
}
function handleImportFile(e){
  const file = e.target.files[0];
  const status = document.getElementById("import-status");
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const data = JSON.parse(reader.result);
      let n=0;
      if(Array.isArray(data.exercisesCustom)) for(const ex of data.exercisesCustom){ await saveExercise(ex); n++; }
      if(data.weekPlan) await saveWeekPlan(Object.assign({}, state.weekPlan, data.weekPlan));
      if(data.sessions) for(const ds of Object.keys(data.sessions)){ await saveSession(ds, data.sessions[ds]); n++; }
      if(db && data.timers) for(const ds of Object.keys(data.timers)){ await db.doc("timers/"+ds).set(data.timers[ds]); }
      if(db && data.notas && Object.keys(data.notas).length) await db.doc("meta/notas").set(Object.assign({}, exNotes, data.notas));
      if(db && data.dias && Object.keys(data.dias).length) await db.doc("meta/dias").set(Object.assign({}, dayMarksDb, data.dias));
      status.textContent = "Importado correctamente.";
      status.style.color = "var(--good)";
      toast("Datos importados");
    }catch(err){
      status.textContent = "El archivo no es una copia válida.";
      status.style.color = "var(--danger)";
    }
  };
  reader.readAsText(file);
}

document.body.addEventListener("click", async (e)=>{
  const nav = e.target.closest("[data-nav]");
  if(nav){ state.view = nav.dataset.nav; render(); return; }

  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;

  if(action==="close-modal"){ closeModal(); return; }
  if(action==="timer-start"){ await timerStart(); return; }
  if(action==="timer-stop"){ await timerStop(); return; }
  if(action==="day-close"){ await dayCloseAction(el); return; }
  if(action==="timer-reset"){ await timerReset(el); return; }
  if(action==="alarm-settings"){ openAlarmModal(); return; }
  if(action==="vol-menos" || action==="vol-mas"){ avisoVolSet(avisoVol + (action==="vol-mas"?10:-10)); avisoPrueba(); const bx = el.closest(".vol-box"); if(bx){ const d = document.createElement("div"); d.innerHTML = avisoVolHtml(); bx.replaceWith(d.firstElementChild); } return; }
  if(action==="vol-mezcla"){ avisoMezcla = el.checked; try{ localStorage.setItem("entrenador-aviso-mezcla", avisoMezcla?"1":"0"); }catch(e){} avisoSesion(); if(keepAliveEl && !keepAliveEl.paused){ stopKeepAlive(); startKeepAlive(); } return; }
  if(action==="rest-pick"){ restSound = el.dataset.sound; try{ localStorage.setItem("entrenador-rest-sound", restSound); }catch(e){} try{ playAlarmSound(restSound); }catch(e){} openAlarmModal(); return; }
  if(action==="alarm-pick"){ alarmSound = el.dataset.sound; try{ localStorage.setItem("bitacora-alarm-sound", alarmSound); }catch(e){} playBeep(); openAlarmModal(); return; }
  if(action==="media-open"){ openMediaModal(); return; }
  if(action==="media-play"){ mediaPicked(el); return; }
  if(action==="timer-edit"){ openTimeEdit(el.dataset.date); return; }
  if(action==="timer-edit-quick"){ const v=+el.dataset.min; document.getElementById("te-h").value=Math.floor(v/60); document.getElementById("te-m").value=v%60; return; }
  if(action==="timer-edit-save"){ await saveTimeEdit(el.dataset.date); return; }
  if(action==="cal-prev"){ state.calMonth--; if(state.calMonth<0){state.calMonth=11; state.calYear--;} renderCalendario(); return; }
  if(action==="cal-next"){ state.calMonth++; if(state.calMonth>11){state.calMonth=0; state.calYear++;} renderCalendario(); return; }
  if(action==="cal-today"){ const n=new Date(); state.calMonth=n.getMonth(); state.calYear=n.getFullYear(); renderCalendario(); return; }
  if(action==="goto-day"){ gotoDay(el.dataset.date); return; }
  if(action==="cal-day-detail"){ openDayDetail(el.dataset.date); return; }
  if(action==="detail-edit-day"){ closeModal(); gotoDay(el.dataset.date); return; }
  if(action==="detail-start-day"){ closeModal(); gotoDay(el.dataset.date); await timerStart(); return; }

  if(action==="semana-tab"){ state.semanaDow = el.dataset.dow; renderSemana(); return; }
  if(action==="semana-add-slot"){
    const dow = el.dataset.dow;
    const wp = Object.assign({}, state.weekPlan);
    const firstEx = allExercises()[0];
    wp[dow] = (wp[dow]||[]).concat([{ exerciseId: firstEx?firstEx.id:"", sets:3, reps:10 }]);
    await saveWeekPlan(wp);
    return;
  }
  if(action==="semana-rm-slot"){
    const dow = el.dataset.dow, i = Number(el.dataset.i);
    const wp = Object.assign({}, state.weekPlan);
    wp[dow] = (wp[dow]||[]).filter((_,idx)=>idx!==i);
    if(manualEntrySlot && manualEntrySlot.mode==="semana" && manualEntrySlot.dow===dow){
      if(manualEntrySlot.i===i) manualEntrySlot=null;
      else if(manualEntrySlot.i>i) manualEntrySlot.i--;
    }
    await saveWeekPlan(wp);
    return;
  }
  if(action==="semana-move-up" || action==="semana-move-down"){
    const dow = el.dataset.dow, i = Number(el.dataset.i);
    const j = action==="semana-move-up" ? i-1 : i+1;
    const wp = Object.assign({}, state.weekPlan);
    const arr = (wp[dow]||[]).slice();
    if(j<0 || j>=arr.length) return;
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    wp[dow] = arr;
    if(manualEntrySlot && manualEntrySlot.mode==="semana" && manualEntrySlot.dow===dow){
      if(manualEntrySlot.i===i) manualEntrySlot.i = j;
      else if(manualEntrySlot.i===j) manualEntrySlot.i = i;
    }
    await saveWeekPlan(wp);
    return;
  }

  if(action==="focus-cat"){ exFilterCat = (exFilterCat===el.dataset.val) ? "Todos" : el.dataset.val; renderEjercicios(); return; }
  if(action==="filter-mus"){ exFilterMus = el.dataset.val; renderEjercicios(); return; }
  if(action==="open-exercise"){ openExerciseDetail(el.dataset.id); return; }
  if(action==="pg-mode"){ if(PG.mode!==el.dataset.val){ PG.mode=el.dataset.val; PG.dA=null; PG.dB=null; renderProgreso(); } return; }
  if(action==="pg-pick1"){ PG.w1B=el.dataset.week; renderProgreso(); return; }
  if(action==="pg-pick2"){ PG.w2B=el.dataset.week; renderProgreso(); return; }
  if(action==="demo-toggle"){ el.classList.toggle("paused"); return; }
  if(action==="bodymap-mus"){ exFilterMus = (exFilterMus===el.dataset.val) ? "" : el.dataset.val; renderEjercicios();
    if(exFilterMus){ const a=document.getElementById("ex-list-anchor"); if(a) a.scrollIntoView({behavior:"smooth", block:"start"}); }
    return; }
  if(action==="new-exercise"){ openExerciseEditor(); return; }
  if(action==="toggle-mus"){
    syncExerciseFromDom();
    const role = el.dataset.role==="primary" ? "mus":"mus2";
    const arr = editingExercise[role];
    const m = el.dataset.m;
    const i = arr.indexOf(m);
    if(i>=0) arr.splice(i,1); else arr.push(m);
    renderExerciseEditor();
    return;
  }
  if(action==="save-exercise"){
    syncExerciseFromDom();
    editingExercise.n = editingExercise.n.trim();
    editingExercise.eq = editingExercise.eq.trim();
    editingExercise.cues = editingExercise.cues.map(s=>s.trim()).filter(Boolean);
    if(!editingExercise.n){ toast("Poné un nombre al ejercicio"); return; }
    await saveExercise(editingExercise);
    closeModal(); toast("Ejercicio guardado");
    if(!editingExercise.mus.length || !editingExercise.cues.length) autoCompleteExercise(Object.assign({}, editingExercise));
    return;
  }

  if(action==="manual-ex-confirm"){ await confirmManualEntry(); return; }
  if(action==="manual-ex-cancel"){ cancelManualEntry(); return; }
  if(action==="delete-exercise"){
    if(armConfirm(el, "¿Eliminar? Tocá de nuevo")){ await deleteExerciseCustom(el.dataset.id); closeModal(); toast("Ejercicio eliminado"); }
    return;
  }

  if(action==="day-rm-ex"){
    syncDayDraftFromDom();
    const rmEi = Number(el.dataset.ei);
    dayDraft.entries.splice(rmEi,1);
    dayDraftDirty=true;
    // si se estaba escribiendo "a mano" en esa fila (o en una que se corrió de lugar), recalculamos o cancelamos.
    if(manualEntrySlot && manualEntrySlot.mode==="day"){
      if(manualEntrySlot.ei===rmEi) manualEntrySlot=null;
      else if(manualEntrySlot.ei>rmEi) manualEntrySlot.ei--;
    }
    redrawDayEditor();
    return;
  }
  if(action==="day-move-up" || action==="day-move-down"){
    syncDayDraftFromDom();
    const ei = Number(el.dataset.ei);
    const j = action==="day-move-up" ? ei-1 : ei+1;
    if(j<0 || j>=dayDraft.entries.length) return;
    const tmp = dayDraft.entries[ei]; dayDraft.entries[ei] = dayDraft.entries[j]; dayDraft.entries[j] = tmp;
    dayDraftDirty = true;
    if(manualEntrySlot && manualEntrySlot.mode==="day"){
      if(manualEntrySlot.ei===ei) manualEntrySlot.ei = j;
      else if(manualEntrySlot.ei===j) manualEntrySlot.ei = ei;
    }
    redrawDayEditor();
    return;
  }
  if(action==="day-add-blank" || action==="day-add-below"){
    syncDayDraftFromDom();
    const at = action==="day-add-below" ? Number(el.dataset.ei)+1 : dayDraft.entries.length;
    dayDraft.entries.splice(at, 0, Object.assign({exerciseId: ""}, prefillEntry("", dayDraft.dateStr, 3, 10)));
    if(manualEntrySlot && manualEntrySlot.mode==="day" && manualEntrySlot.ei>=at) manualEntrySlot.ei++;
    dayDraftDirty = true;
    redrawDayEditor();
    const sel = document.querySelector(`#day-editor select[data-role="ejercicio"][data-ei="${at}"]`);
    if(sel){ const card = sel.closest(".day-ex-card"); if(card){ card.classList.add("just-added"); card.scrollIntoView({block:"center", behavior:"smooth"}); } sel.focus(); }
    return;
  }
  if(action==="day-discard"){
    dayDraft = buildDayEditState(dayDraft.dateStr);
    dayDraftDirty = false;
    manualEntrySlot = null;
    redrawDayEditor();
    toast("Cambios descartados");
    return;
  }
  if(action==="save-day"){
    syncDayDraftFromDom();
    dayDraft.entries = dayDraft.entries.filter(en=>en.exerciseId);
    dayDraft.entries.forEach(normalizeEntrySets);
    await saveSession(dayDraft.dateStr, { date: dayDraft.dateStr, entries: dayDraft.entries, notes: dayDraft.notes, registrado:true });
    dayDraftDirty = false;
    // Lo que cambiaste en ejercicios (agregados, quitados, reemplazados, orden, series y reps) pasa a la
    // planificación de ese día de la semana, así la semana siguiente aparece igual. Solo si es el registro
    // más reciente de ese día de la semana: corregir un día viejo no pisa la rutina actual.
    const dowSaved = dowKeyFromDate(dsToDate(dayDraft.dateStr));
    const newerSameDow = Object.keys(state.sessions).some(d=> d>dayDraft.dateStr && dowKeyFromDate(dsToDate(d))===dowSaved && sessionHasWork(state.sessions[d]));
    let planMsg = "";
    if(!newerSameDow && dayDraft.entries.length){
      const newPlan = dayDraft.entries.map(en=>({ exerciseId:en.exerciseId, sets:Number(en.series)||3, reps:Number(en.reps)||10 }));
      if(JSON.stringify(newPlan)!==JSON.stringify(state.weekPlan[dowSaved]||[])){
        const wp = Object.assign({}, state.weekPlan); wp[dowSaved] = newPlan;
        await saveWeekPlan(wp);
        planMsg = ` · rutina del ${DOW_LABEL[dowSaved].toLowerCase()} actualizada`;
      }
    }
    toast("Registro guardado"+planMsg);
    return;
  }

  if(action==="export-json"){ exportBackup(); return; }
});

document.body.addEventListener("change", async (e)=>{
  const act = e.target.dataset.action;
  if(act==="semana-ex" || act==="semana-sets" || act==="semana-reps"){
    const dow = e.target.dataset.dow, i = Number(e.target.dataset.i);
    if(act==="semana-ex" && e.target.value==="__manual__"){
      startManualEntry({mode:"semana", dow, i});
      return;
    }
    const wp = Object.assign({}, state.weekPlan);
    const arr = (wp[dow]||[]).slice();
    if(!arr[i]) return;
    arr[i] = Object.assign({}, arr[i]);
    if(act==="semana-ex") arr[i].exerciseId = e.target.value;
    else if(act==="semana-sets") arr[i].sets = Number(e.target.value)||1;
    else if(act==="semana-reps") arr[i].reps = Number(e.target.value)||1;
    wp[dow] = arr;
    await saveWeekPlan(wp);
  }
});

   Botón fijo: escribís (o dictás) lo que querés cambiar, y opcionalmente señalás algo de la pantalla.
   Queda guardado en la colección "pedidos" de la base de la Bitácora. Cuando Martin le dice a Claude

const Ped = { list:[], draft:{ texto:"", objetivo:null }, picking:false, hoverEl:null };
const PED_ICON = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5A2.5 2.5 0 016.5 3h11A2.5 2.5 0 0120 5.5v8a2.5 2.5 0 01-2.5 2.5H10l-4.5 4v-4h0A1.5 1.5 0 014 14.5v-9z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 9.5h7M8.5 12.5h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
function pedEsc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function pedRenderFab(){
  let b = document.getElementById("ped-fab");
  if(!b){ b = document.createElement("button"); b.id="ped-fab"; b.className="ped-fab"; b.type="button"; b.setAttribute("aria-label","Pedir un cambio a Claude"); b.addEventListener("click", pedOpen); document.body.appendChild(b); }

  b.innerHTML = `${PED_ICON}<span>Pedir cambio</span>${n?`<span class="ped-badge">${n}</span>`:""}`;

/* ======================= SERIES UNA POR UNA + DESCANSO + NOTAS POR MÁQUINA =======================
   · Cada ejercicio muestra sus series (S1, S2, S3…). Al tildar una, arranca sola la cuenta del descanso.
   · Cada serie puede tener sus propias repeticiones y kilos; al guardar, el peso del ejercicio es el mayor
     de las series (así las reglas del ciclo base + agregado / base / 50% siguen funcionando igual).
   · Notas por ejercicio (no por día): ajuste del asiento, agarre, qué máquina. Se ven siempre arriba. */
const NOTE_ICON = '<svg viewBox="0 0 24 24" fill="none"><path d="M6 3.5h9l3.5 3.5v13.5H6z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 11h6M9 14.5h6M9 18h3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
const SET_CHECK = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3L13 4.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let exNotes = {};
function ensureDetalle(en){
  const n = Math.max(0, Number(en.series)||0);
  if(!Array.isArray(en.detalle)) en.detalle = [];
  while(en.detalle.length < n) en.detalle.push({ reps:String(en.reps||""), peso:String(en.peso||""), ok:false });
  if(en.detalle.length > n) en.detalle.length = n;
  return en.detalle;
}
function normalizeEntrySets(en){
  ensureDetalle(en);
  const ws = en.detalle.map(st=>Number(st.peso)||0).filter(Boolean);
  if(ws.length) en.peso = String(Math.max(...ws));
  // si cambiaste los kilos de una serie, el agregado se recalcula solo (lo levantado − la base)
  if(en.base!==undefined && Number(en.base) && Number(en.peso)) en.extra = Math.max(0, Number(en.peso)-Number(en.base));
}
function setsBlockHtml(en, ei){
  const det = ensureDetalle(en);
  if(!det.length) return "";
  if(!exOpen(en)) return "";   // se despliega con el tilde de "Empezar" o con la flecha
  const nextI = det.findIndex(st=>!st.ok);
  return `<div class="sets">
    <div class="sets-head"><span>Hecha</span><span>Serie</span><span>Repeticiones</span><span>Kilos</span></div>
    ${det.map((st,si)=>`<div class="set-row ${st.ok?"ok":""} ${si===nextI?"next":""}">
      <button type="button" class="set-ok" data-setok="${ei}:${si}" aria-pressed="${!!st.ok}" aria-label="Serie ${si+1} ${st.ok?"hecha":"pendiente"}">${SET_CHECK}</button>
      <span class="set-lbl">S${si+1}</span>
      <select data-role="set-reps" data-ei="${ei}" data-si="${si}" aria-label="Repeticiones serie ${si+1}">${numberOptionsHtml(30, st.reps)}</select>
      <select data-role="set-peso" data-ei="${ei}" data-si="${si}" aria-label="Kilos serie ${si+1}">${pesoOptionsHtml(st.peso)}</select>
    </div>`).join("")}
  </div>`;
}
function exNoteLine(exId){
  const t = (exNotes[exId]||"").trim();
  return t ? `<div class="ex-note-line"><b>Nota:</b> ${t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}</div>` : "";
}

document.addEventListener("change", e=>{

  // (antes, al guardar, el peso volvía al de las series tildadas y parecía que no te dejaba cambiarlo).
  const todas = en.detalle.every(st=>st.ok);
  en.detalle.forEach(st=>{ if(todas || !st.ok){ st.reps = String(en.reps||""); st.peso = String(en.peso||""); } });

document.addEventListener("click", async e=>{

  const en = dayDraft.entries[ei]; if(!en) return;

  redrawDayEditor(); refreshNoteButtons();
  if(st.ok){
    const allDone = dayDraft.entries.every(x=> !x.exerciseId || ensureDetalle(x).every(z=>z.ok));
    if(allDone){ restStop(); toast("¡Entreno completo! Tocá Guardar registro 💪"); }
    else {
      restStart();
      if(en.detalle.every(z=>z.ok)){
        const nx = dayDraft.entries.find(x=> x.exerciseId && !ensureDetalle(x).every(z=>z.ok));
        const nex = nx && exerciseById(nx.exerciseId);
        if(nex) toast(`✓ Terminado · Sigue: ${nex.n}`);
      }
    }

    if(dayDraft.dateStr <= todayStr()) try{

/* ---- Tilde "Empezar" al lado del nombre: arranca / para el esquema de series de ese ejercicio ----
   Estados de cada ejercicio del día:
   · sin empezar  → tilde gris (el próximo, naranja con "Empezar")
   · en curso     → tilde naranja; tocarlo lo PARA
   · parado       → tocarlo lo retoma
   · terminado    → tilde verde; tocarlo despliega / contrae las series
   Flecha al lado: despliega o contrae las series cuando quieras.
   Punto rojo chico: el ejercicio se empezó pero quedaron series sin hacer. */
function exDone(en){ const d=ensureDetalle(en); return d.length>0 && d.every(z=>z.ok); }
function exTouched(en){ return !!en.empezado || ensureDetalle(en).some(z=>z.ok); }
function exActive(en){ return exTouched(en) && !en.detenido && !exDone(en); }
function exOpen(en){ return en.abierto===undefined ? exActive(en) : !!en.abierto; }
function exCardState(en){ return exDone(en) ? "ex-done" : (exActive(en) ? "ex-active" : ""); }
function exStartBtnHtml(d, en, ei){
  const open = exOpen(en);
  const arrow = `<button type="button" class="ex-arrow" data-exarrow="${ei}" title="${open?"Contraer series":"Desplegar series"}" aria-label="${open?"Contraer series":"Desplegar series"}" aria-expanded="${open}">${open?ICON.arrowUp:ICON.arrowDown}</button>`;
  const pending = exTouched(en) && !exDone(en) && !exActive(en);
  const dot = pending ? `<span class="ex-dot" title="Faltan series por hacer" aria-label="Faltan series por hacer"></span>` : "";
  let cls = "", label = "Empezar este ejercicio", txt = "";
  if(exDone(en)){ cls="done"; label="Ejercicio terminado · tocá para ver u ocultar las series"; }
  else if(exActive(en)){ cls="on"; label="En curso · tocá para parar"; }
  else if(!exTouched(en)){
    const anyActive = d.entries.some(x=> x.exerciseId && exActive(x));
    const nextEi = d.entries.findIndex(x=> x.exerciseId && !exDone(x) && !exTouched(x));
    if(!anyActive && nextEi===ei){ cls="next"; txt="<span>Empezar</span>"; }
  } else { label = "Parado · tocá para retomar"; }
  return `<div class="ex-ctrl">${dot}<button type="button" class="ex-start ${cls}" data-exstart="${ei}" title="${label}" aria-label="${label}">${SET_CHECK}${txt}</button>${arrow}</div>`;
}
async function autosaveDay(){
  if(dayDraft && dayDraft.dateStr > todayStr()) return;   // un día que todavía no llegó no se guarda solo
  try{
    const entries = JSON.parse(JSON.stringify(dayDraft.entries.filter(x=>x.exerciseId)));
    entries.forEach(normalizeEntrySets);
    await saveSession(dayDraft.dateStr, { date:dayDraft.dateStr, entries, notes:dayDraft.notes||"" });
  }catch(_){}
}
document.addEventListener("click", async e=>{
  const b = e.target.closest && e.target.closest("[data-exstart]");
  if(!b || !dayDraft) return;
  syncDayDraftFromDom();
  const ei = Number(b.dataset.exstart), en = dayDraft.entries[ei]; if(!en) return;
  ensureDetalle(en);
  let starting = false;
  if(exDone(en)){ en.abierto = !exOpen(en); }                       // terminado: ver / ocultar
  else if(exActive(en) && !en.detalle.some(z=>z.ok)){
    // lo abriste solo para mirar (ninguna serie hecha): vuelve a quedar como si nunca lo hubieras tocado
    delete en.empezado; delete en.detenido; en.abierto = false; restStop();
    const nadaHoy = !dayDraft.entries.some(x=> x.exerciseId && (x.empezado || ensureDetalle(x).some(z=>z.ok)));
    if(nadaHoy && autoTimer && dayDraft.dateStr===todayStr()){
      try{ releaseWakeLock(); stopKeepAlive(); await saveTimer(todayStr(), { date:todayStr(), totalMs:autoTimer.prevMs, runningSince:null }); }catch(_){}
      autoTimer = null;
    }
    if(nadaHoy && state.sessions[dayDraft.dateStr] && !sessionHasWork(state.sessions[dayDraft.dateStr])){
      try{ await deleteSession(dayDraft.dateStr); }catch(_){}
      dayDraftDirty = false; redrawDayEditor(); refreshNoteButtons(); toast("Sin empezar"); return;
    }
  }
  else if(exActive(en)){ en.detenido = true; en.abierto = false; restStop(); toast("Ejercicio parado · quedan series"); }   // en curso con series hechas: parar
  else {                                                             // sin empezar o parado: arrancar
    starting = true;
    dayDraft.entries.forEach((x,i)=>{ if(i!==ei && x.exerciseId){ if(exActive(x)) x.detenido = true; x.abierto = false; } });  // los demás se contraen
    en.empezado = true; en.detenido = false; en.abierto = true;
  }
  dayDraftDirty = true;
  redrawDayEditor(); refreshNoteButtons();
  if(starting){
    const card = document.querySelector(`[data-card-ei="${ei}"]`);
    if(card) card.scrollIntoView({ behavior:"smooth", block:"start" });
    if(dayDraft.dateStr===todayStr() && !runningTimerDate()){ autoTimer = { prevMs: timerMsFor(todayStr()) }; try{ await timerStart(); }catch(_){} }
  }
  await autosaveDay();
});

/* ---- Temporizador de descanso ---- */
const REST_SECS = 45;                              // descanso entre series: SIEMPRE 45 segundos
const Rest = { secs: REST_SECS, endAt: 0, tick: null };
try{ localStorage.removeItem("entrenador-descanso-45"); }catch(_){}
function restFmt(ms){ const t=Math.max(0,Math.ceil(ms/1000)); return Math.floor(t/60)+":"+String(t%60).padStart(2,"0"); }
function restBar(){
  let b = document.getElementById("rest-bar");
  if(!b){ b=document.createElement("div"); b.id="rest-bar"; b.className="rest-bar"; b.setAttribute("role","timer"); document.body.appendChild(b);
    b.addEventListener("click", ev=>{ const a = ev.target.closest("[data-rest]"); if(!a) return; const k=a.dataset.rest;
      if(k==="skip") restStop();
      else { const d = k==="plus"?15:-15;   // ±15 solo para este descanso; el próximo vuelve a 45 s
        Rest.endAt = Math.max(Date.now()+1000, Rest.endAt + d*1000); restRender(); if(!Rest.tick) Rest.tick=setInterval(restRender,250); } });
  }
  return b;
}
function restStart(){
  try{ ensureAudio(); }catch(_){}
  Rest.secs = REST_SECS;
  Rest.endAt = Date.now() + REST_SECS*1000;
  const b = restBar(); b.hidden = false; b.classList.remove("blink");
  clearInterval(Rest.tick); Rest.tick = setInterval(restRender, 250); restRender();
}
function restStop(){ clearInterval(Rest.tick); Rest.tick=null; const b=document.getElementById("rest-bar"); if(b){ b.hidden = true; b.classList.remove("blink"); } }
// Campanadas de ring, bien fuertes: 4 tandas de 3 golpes (~4 s). Usa los tonos donde el oído es más
// sensible (2–4 kHz) y pasa por el compresor + saturador del aviso, que lo lleva al máximo del volumen.
function restBells(){
  ensureAudio(); if(!audioCtx) return;
  const t0 = audioCtx.currentTime + 0.03;
  const golpes = [0,0.24,0.48, 1.1,1.34,1.58, 2.2,2.44,2.68, 3.3,3.54,3.78];
  golpes.forEach(off=>{
    [[2000,1],[2850,0.8],[3500,0.6],[4600,0.35],[1000,0.5]].forEach(([f,a])=> tone(t0+off, 1.3, f, "sine", a, { decay:true }));
  });
}
function restRender(){
  const b = restBar(), left = Rest.endAt - Date.now();
  if(left <= 0){
    clearInterval(Rest.tick); Rest.tick = null;
    b.hidden = true; b.classList.remove("blink");                      // a los 45 s se apaga
    try{ playAlarmSound(restSound); }catch(_){}                         // sonido elegido al terminar el descanso
    try{ undim(); }catch(_){}                                           // se ilumina para ver el próximo paso
    try{ if(navigator.vibrate) navigator.vibrate([400,150,400,150,800]); }catch(_){}
    return;
  }
  b.classList.toggle("blink", left <= 10000);                          // últimos 10 s: parpadea
  b.innerHTML = `<div><div class="rl">Descanso · ${Rest.secs}s</div><div class="rt">${restFmt(left)}</div></div>
    <button type="button" data-rest="minus" aria-label="Restar 15 segundos">−15</button>
    <button type="button" data-rest="plus" aria-label="Sumar 15 segundos">+15</button>
    <button type="button" data-rest="skip">Saltar</button>
    <button type="button" data-action="alarm-settings" title="Elegir sonido" aria-label="Elegir sonido del descanso">🔔</button>`;
}

/* ======================= EJERCICIO NUEVO: CLASIFICACIÓN AUTOMÁTICA =======================
   Al agregar un ejercicio a mano, Claude (dentro de la app) lo ubica en su grupo muscular, le pone
   músculos principales y secundarios, equipo, tipo de movimiento y el paso a paso, igual que los demás.
   La foto no se puede bajar de internet desde la app: queda un pedido automático "Buscar foto" en el
   buzón, y Claude la agrega cuando le decís "revisá los pedidos". */
async function autoCompleteExercise(ex){
  let sample = null;
  try{ sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; }catch(_){}
  if(!sample){ pedidoFoto(ex, true); return; }
  const prompt = `Sos entrenador de gimnasio. Clasificá este ejercicio de gimnasio escrito por un usuario argentino (puede tener errores de tipeo): "${ex.n}".
Respondé SOLO un objeto JSON con estas claves:
- "n": el nombre corregido y claro en español rioplatense (mantené el sentido; si el nombre ya está bien, dejalo igual; si tiene una aclaración entre paréntesis, conservala)
- "cat": una de ${JSON.stringify(CATS)}
- "mus": músculos principales, lista con valores de ${JSON.stringify(MUSCLES)}
- "mus2": músculos secundarios, misma lista de valores (puede ir vacía)
- "eq": equipo, uno de ["Máquina","Mancuernas","Barra","Polea","Peso corporal","Banda elástica","Ninguno"]
- "pat": uno de ${JSON.stringify(Object.keys(PATTERN_LABEL))}
- "pasos": 4 pasos cortos (máx. 15 palabras cada uno) de cómo se hace bien, en voseo ("Sentate", "Tomá")
- "foto_busqueda": nombre del ejercicio en inglés para buscar una foto (ej: "cable crossover")`;
  try{
    const r = await sample.json(prompt, { modelTier:"quick" });
    const okList = (a)=> Array.isArray(a) ? a.filter(m=>MUSCLES.includes(m)) : [];
    const upd = Object.assign({}, ex, {
      n: (typeof r.n==="string" && r.n.trim()) ? r.n.trim() : ex.n,
      cat: CATS.includes(r.cat) ? r.cat : ex.cat,
      mus: okList(r.mus).length ? okList(r.mus) : ex.mus,
      mus2: okList(r.mus2),
      eq: typeof r.eq==="string" ? r.eq : ex.eq,
      pat: PATTERN_LABEL[r.pat] ? r.pat : ex.pat,
      cues: Array.isArray(r.pasos) ? r.pasos.filter(x=>typeof x==="string" && x.trim()).slice(0,6) : ex.cues,
      fotoBusqueda: typeof r.foto_busqueda==="string" ? r.foto_busqueda : "",
      fotoPendiente: !hasPhoto(ex.id),
      autoClasificado: new Date().toISOString()
    });
    await saveExercise(upd);
    toast(`✓ ${upd.n} · ${upd.cat} · ${upd.mus.map(m=>MUSCLE_LABEL[m]).join(", ")||"sin músculo"}`);
    pedidoFoto(upd, false);
  }catch(e){
    if(e && e.code==="not_granted") toast("Sin permiso para clasificar: completalo en Ejercicios");
    else toast("No se pudo clasificar ahora: queda pedido para Claude");
    pedidoFoto(ex, true);
  }
}
async function pedidoFoto(ex, tambienClasificar){
  if(!db || hasPhoto(ex.id)) return;
  const id = new Date().toISOString().replace(/[-:T.Z]/g,"").slice(0,14)+"-"+uid().slice(0,6);
  const texto = (tambienClasificar ? "Clasificar (grupo muscular, pasos) y " : "") +
    `buscar foto de vista previa para el ejercicio nuevo "${ex.n}"` + (ex.fotoBusqueda?` (en inglés: ${ex.fotoBusqueda})`:"") + ` · id ${ex.id}`;
  try{ await db.doc("pedidos/"+id).set({ id, texto, objetivo:{ tipo:"ejercicio", texto:ex.n, tocado:ex.id }, vista:"ejercicios", dia:todayStr(), estado:"pendiente", creado:new Date().toISOString(), auto:true }); }catch(_){}
}


/* ======================= DÍAS MARCADOS: FERIADOS, NO LABORABLES, ENFERMO =======================
   Feriados nacionales de Argentina cargados de fábrica (oct–dic 2026, incluye el feriado extraordinario
   del 9/11 por la visita del Papa León XIV). Martin puede marcar cualquier día como Enfermo, Feriado /
   no laborable u Otro motivo, o quitar la marca. Los días marcados no cuentan como "faltó" en el mes. */
const DAY_MARKS = {
  feriado:  { label:"Feriado",         icon:"📅", wm:"FERIADO" },
  nolab:    { label:"No laborable",    icon:"📅", wm:"NO LABORABLE" },
  enfermo:  { label:"Enfermo",         icon:"🤒", wm:"ENFERMO" },
  otro:     { label:"No fui",          icon:"🚫", wm:"NO FUI" }
};
const FERIADOS_2026 = {
  "2026-10-12": { tipo:"feriado", motivo:"Diversidad Cultural" },
  "2026-11-09": { tipo:"feriado", motivo:"Visita del Papa" },
  "2026-11-23": { tipo:"feriado", motivo:"Soberanía Nacional" },
  "2026-12-07": { tipo:"nolab",   motivo:"Puente turístico" },
  "2026-12-08": { tipo:"feriado", motivo:"Inmaculada Concepción" },
  "2026-12-25": { tipo:"feriado", motivo:"Navidad" }
};
let dayMarksDb = {};   // { "2026-10-20": {tipo:"enfermo"} | {tipo:"ninguno"} }
function dayMark(ds){
  const u = dayMarksDb[ds];
  if(u) return (u.tipo==="ninguno" || u.tipo==="habilitado") ? null : u;
  return FERIADOS_2026[ds] || null;
}
// Feriado en el que el gym abre igual: el día cuenta normal (plan, estadística) y se ve un chip chico.
function dayEnabledHoliday(ds){ const u = dayMarksDb[ds]; return (u && u.tipo==="habilitado") ? (FERIADOS_2026[ds] || { tipo:"feriado", motivo:"" }) : null; }
function dayMarkControlsHtml(ds){
  const mk = dayMark(ds), hab = dayEnabledHoliday(ds);
  if(hab) return `<div class="daymark-box">
    <div class="daymark-title">🏋️ <b>Feriado con gym abierto</b>${hab.motivo?` (${hab.motivo})`:""} · el día cuenta normal</div>
    <div class="daymark-btns"><button type="button" class="btn btn-sm" data-daymark="volver" data-date="${ds}">📅 Volver a marcarlo feriado</button></div>
  </div>`;
  const btn = (tipo)=>`<button type="button" class="btn btn-sm ${mk&&mk.tipo===tipo?"btn-primary":""}" data-daymark="${tipo}" data-date="${ds}">${DAY_MARKS[tipo].icon} ${DAY_MARKS[tipo].label}</button>`;
  return `<div class="daymark-box">
    <div class="daymark-title">${mk?`Día marcado: <b>${DAY_MARKS[mk.tipo].icon} ${mk.motivo||DAY_MARKS[mk.tipo].label}</b> · no cuenta en contra`:"Marcar este día (no cuenta en contra en el mes)"}</div>
    ${mk && (mk.tipo==="feriado"||mk.tipo==="nolab") ? `<button type="button" class="btn btn-primary daymark-open" data-daymark="habilitado" data-date="${ds}">🏋️ El gym abre igual: habilitar este día</button>` : ""}
    <div class="daymark-btns">${btn("enfermo")}${btn("feriado")}${btn("nolab")}${btn("otro")}${mk?`<button type="button" class="btn btn-sm btn-ghost" data-daymark="ninguno" data-date="${ds}">Quitar marca</button>`:""}</div>
  </div>`;
}
document.addEventListener("click", async e=>{
  const b = e.target.closest && e.target.closest("[data-daymark]"); if(!b) return;
  const ds = b.dataset.date, tipo = b.dataset.daymark;
  const prev = dayMark(ds);
  if(tipo==="volver"){ const c = Object.assign({}, dayMarksDb); delete c[ds]; dayMarksDb = c; }
  else {
    const val = (tipo==="ninguno"||tipo==="habilitado") ? { tipo } : { tipo, motivo: (prev && prev.tipo===tipo && prev.motivo) ? prev.motivo : "" };
    dayMarksDb = Object.assign({}, dayMarksDb, { [ds]: val });
  }
  closeModal(); render();
  toast(tipo==="ninguno" ? "Marca quitada" : tipo==="habilitado" ? "Día habilitado: el gym abre, cuenta normal" : tipo==="volver" ? "Vuelve a ser feriado" : `Día marcado: ${DAY_MARKS[tipo].label}`);
  if(!db) return;
  try{ await db.doc("meta/dias").set(dayMarksDb); }catch(_){ toast("No se pudo guardar la marca"); }
});
function monthComplianceHtml(y, m){
  const t = todayStr(); let plan=0, done=0, marked=0;
  const last = new Date(y, m+1, 0).getDate();
  for(let d=1; d<=last; d++){
    const ds = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    if(ds > t) break;
    const wd = dsToDate(ds).getDay(); if(wd<1 || wd>5) continue;
    const dow = dowKeyFromDate(dsToDate(ds));
    const s = state.sessions[ds], has = sessionHasWork(s);
    if(has){ plan++; done++; continue; }
    if(!(state.weekPlan[dow]||[]).length) continue;
    if(dayMark(ds)){ marked++; continue; }
    if(ds === t) continue;   // hoy todavía no cuenta en contra
    plan++;
  }
  if(!plan && !marked) return "";
  const pct = plan ? Math.round(done/plan*100) : 0;
  return `<div class="month-comp"><span><b class="mono">${done}</b> de <b class="mono">${plan}</b> días entrenados hasta hoy</span><span class="mc-pct mono">${plan?pct+"%":"—"}</span>${marked?`<span class="mc-note">${marked} día${marked===1?"":"s"} marcado${marked===1?"":"s"} (feriado / enfermo) no cuenta${marked===1?"":"n"}</span>`:""}</div>`;
}
(function dayMarksInit(){
  let tries=0;
  const w = setInterval(()=>{ tries++;
    if(db){ clearInterval(w); db.doc("meta/dias").onSnapshot(snap=>{ dayMarksDb = (snap.exists && snap.data()) || {}; render(); }, ()=>{}); }
    else if(tries>(window.__STANDALONE__?1e9:40)) clearInterval(w);
  }, 500);
})();

function aliDay(d){ return aliData[d] || { date:d }; }
function aliEsc(t){ return String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function aliN(v){ const n = Number(v); return isFinite(n) ? n : 0; }
function aliR(v){ return Math.round(aliN(v)); }
function aliTot(items){ return (items||[]).reduce((t,x)=>({ kcal:t.kcal+aliN(x.kcal), p:t.p+aliN(x.p), c:t.c+aliN(x.c), f:t.f+aliN(x.f) }), {kcal:0,p:0,c:0,f:0}); }

// "Frecuentes": lo que ya cargaste, con sus valores por gramo, para volver a sumarlo en un toque.
function aliFrecuentes(){
  const m = {};
  Object.values(aliData).forEach(r=> (r.items||[]).forEach(x=>{
    if(!x.n || !aliN(x.g)) return; const k = x.n.toLowerCase();
    if(!m[k]) m[k] = { n:x.n, g:aliN(x.g), kcal:aliN(x.kcal), p:aliN(x.p), c:aliN(x.c), f:aliN(x.f), veces:0, last:"" };
    m[k].veces++; if((r.date||"") >= m[k].last){ Object.assign(m[k], { g:aliN(x.g), kcal:aliN(x.kcal), p:aliN(x.p), c:aliN(x.c), f:aliN(x.f), last:r.date||"" }); }
  }));
  return Object.values(m).sort((a,b)=>b.veces-a.veces || (b.last>a.last?1:-1));
}
function aliSearch(q){
  q = (q||"").trim().toLowerCase(); if(q.length<2) return [];
  const norm = s=> s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const nq = norm(q), out = [];
  aliFrecuentes().forEach(x=>{ if(norm(x.n).includes(nq)) out.push({ tipo:"Tus comidas", n:x.n, g:x.g, kcal:x.kcal, p:x.p, c:x.c, f:x.f }); });
  fdTodos().forEach(x=>{ if(norm(x.n).includes(nq) && !out.some(o=>o.n.toLowerCase()===x.n.toLowerCase())) out.push({ tipo: x.mio ? "★ Mi base" : "Base", n:x.n, g:x.g, por:x.u, kcal:x.kcal, p:x.p, c:x.c, f:x.f }); });
  ALI_FOODS.forEach(([n,k,p,c,f,g,por])=>{ if(norm(n).includes(nq) && !out.some(o=>o.n.toLowerCase()===n.toLowerCase())){
    const r = g/100; out.push({ tipo:"Base", n, g, por, kcal:k*r, p:p*r, c:c*r, f:f*r }); } });
  return out.slice(0,8);
}

function aliScale(it, g){ g = Math.max(0, aliN(g)); const r = it.b.g ? g/it.b.g : 1;
  Object.assign(it, { g:Math.round(g), kcal:aliR(it.b.kcal*r), p:+(it.b.p*r).toFixed(1), c:+(it.b.c*r).toFixed(1), f:+(it.b.f*r).toFixed(1) }); }

/* ---------- Dibujos: anillo de calorías, barras de macros, semana ---------- */
function aliRing(val, goal){
  const R = 52, L = 2*Math.PI*R, pct = goal ? val/goal : 0, over = pct>1.05;
  const dash = Math.min(1,pct)*L, rest = Math.max(0, goal-val);
  return `<svg class="af-ring" viewBox="0 0 130 130" role="img" aria-label="${aliR(val)} de ${aliR(goal)} kcal">
    <circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
    ${dash>0?`<circle cx="65" cy="65" r="${R}" fill="none" stroke="${over?"var(--danger)":"var(--accent)"}" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${dash} ${L}" transform="rotate(-90 65 65)"/>`:""}
    <text x="65" y="60" text-anchor="middle" class="af-ring-big">${aliR(val)}</text>
    <text x="65" y="78" text-anchor="middle" class="af-ring-sm">de ${aliR(goal)} kcal</text>
    <text x="65" y="94" text-anchor="middle" class="af-ring-sm" style="fill:${over?"var(--danger)":"var(--good)"}">${over?"+"+aliR(val-goal)+" de más":"quedan "+aliR(rest)}</text></svg>`;
}
function aliBar(lbl, val, goal, color){
  const pct = goal ? Math.min(100, val/goal*100) : 0;
  return `<div class="af-bar"><div class="af-bar-top"><span><i style="background:${color}"></i>${lbl}</span><b>${aliR(val)}<small> / ${aliR(goal)} g</small></b></div>
    <div class="af-bar-track"><div style="width:${pct}%;background:${color}"></div></div></div>`;
}
function aliWeek(d){
  const days = []; for(let i=6;i>=0;i--){ const k = addDays(d,-i); days.push([k, aliTot(aliDay(k).items).kcal]); }
  const goal = aliN(aliCfg.kcal)||2000, max = Math.max(goal*1.15, ...days.map(x=>x[1])), W=320, H=120, bw=30, gap=(W-7*bw)/6;
  const y = v=> H-18 - (v/max)*(H-30);
  const DOW = ["D","L","M","M","J","V","S"];
  return `<svg class="af-week" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calorías de los últimos 7 días">
    ${days.map(([k,v],i)=>{ const x = i*(bw+gap), h = Math.max(v?2:0, H-18-y(v)); const over = v>goal*1.05;
      return `<g class="af-wk" data-ali="go" data-d="${k}"><title>${fmtShort(k)} · ${aliR(v)} kcal</title>
        <rect x="${x}" y="${y(v)}" width="${bw}" height="${h}" rx="4" fill="${v?(over?"var(--danger)":"var(--accent)"):"var(--surface-2)"}" opacity="${k===d?1:.7}"/>
        <rect x="${x}" y="0" width="${bw}" height="${H}" fill="transparent"/>
        <text x="${x+bw/2}" y="${H-4}" text-anchor="middle" class="af-ax" ${k===d?'style="font-weight:700;fill:var(--ink)"':""}>${DOW[dsToDate(k).getDay()]}</text></g>`; }).join("")}
    <line x1="0" x2="${W}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--ink-2)" stroke-dasharray="4 4" stroke-width="1"/>
    <text x="${W}" y="${y(goal)-4}" text-anchor="end" class="af-ax">objetivo</text></svg>`;
}

/* ---------- Peso: actual (último pesaje) vs objetivo, y tendencia según comida + entreno ----------
   El peso NO se edita en el cuadro: se carga a propósito con "Registrar pesaje" (queda en el día).
   Tendencia = balance calórico: lo que comiste − lo que gastaste (metabolismo × vida diaria + entreno
   cronometrado). 7.700 kcal de diferencia ≈ 1 kg. Además, si hay 2 o más pesajes, compara con la balanza real. */
const ALI_KCAL_KG = 7700;
function aliPesoAl(d){ const ks = Object.keys(aliData).filter(k=>k<=d && aliN(aliData[k].peso)>0).sort(); const k = ks.pop(); return k ? { kg:aliN(aliData[k].peso), d:k } : null; }
function aliGasto(d){
  const c = aliCfg, p = aliPesoAl(d), kg = (p && p.kg) || aliN(c.peso) || 80, cm = aliN(c.altura), ed = aliN(c.edad) || 40;
  const bmr = cm ? 10*kg + 6.25*cm - 5*ed + (c.sexo==="m"?-161:5) : 22*kg;
  const min = typeof dayMin==="function" ? dayMin(d) : 0;
  const entreno = 5 * kg * (min/60);          // pesas moderadas ≈ 5 MET
  return { total: bmr*1.3 + entreno, bmr, entreno, min };
}
function aliBalance(d){ const its = aliDay(d).items || []; if(!its.length) return null; return aliTot(its).kcal - aliGasto(d).total; }
function aliTrend(d){
  const dias = []; for(let i=1;i<=7;i++){ const k = addDays(d,-i); const b = aliBalance(k); if(b!=null) dias.push(b); }
  const hoy = aliBalance(d);
  const base = dias.length ? dias : (hoy!=null ? [hoy] : []);
  if(!base.length) return null;
  const prom = base.reduce((a,b)=>a+b,0)/base.length;
  const kgSem = prom*7/ALI_KCAL_KG;
  // balanza real: primer y último pesaje de los últimos 30 días
  const ps = Object.keys(aliData).filter(k=>k<=d && k>=addDays(d,-30) && aliN(aliData[k].peso)>0).sort();
  let real = null;
  if(ps.length>=2){ const dd = (dsToDate(ps[ps.length-1])-dsToDate(ps[0]))/864e5; if(dd>=5) real = (aliN(aliData[ps[ps.length-1]].peso)-aliN(aliData[ps[0]].peso))/(dd/7); }
  return { kgSem, prom, n: dias.length, soloHoy: !dias.length, hoy, real };
}
function aliPesoBox(d){
  const p = aliPesoAl(d), obj = aliN(aliCfg.pesoObj);
  const dif = p && obj ? +(p.kg-obj).toFixed(1) : null;
  return `<div class="ali-box af-peso"><label>Peso</label>
    <div class="af-peso-row"><span>Actual</span><b>${p?String(p.kg).replace(".",",")+" kg":"—"}</b></div>
    <div class="af-peso-row"><span>Objetivo</span>${obj?`<b>${String(obj).replace(".",",")} kg</b>`:`<button class="pg-exlink" data-ali="cfgpeso">definir</button>`}</div>
    <div class="af-peso-foot">${p?`pesaje ${p.d===todayStr()?"de hoy":fmtShort(p.d)}`:"sin pesajes"}${dif?` · ${dif>0?"faltan "+String(dif).replace(".",",")+" kg":"sobran "+String(-dif).replace(".",",")+" kg"}`:dif===0?" · ¡en el objetivo!":""}</div>
    ${aliUI.pesar?`<div class="af-pesar"><input type="number" inputmode="decimal" step="0.1" id="af-peso-in" placeholder="kg" value="${p&&p.d===d?p.kg:""}"><button class="btn btn-sm btn-primary" data-ali="pesoOk">✓</button><button class="btn btn-sm btn-ghost" data-ali="pesar">✕</button></div>`
      :`<button class="btn btn-sm af-pesar-btn" data-ali="pesar">⚖️ Registrar pesaje</button>`}
  </div>`;
}
function aliTrendBox(d){
  const t = aliTrend(d), p = aliPesoAl(d), obj = aliN(aliCfg.pesoObj), g = aliGasto(d);
  if(!t) return `<div class="ali-box af-trend"><label>Tendencia de peso</label><div class="af-trend-sym">·</div><div class="af-peso-foot">Cargá tus comidas y te muestro si vas subiendo, bajando o igual.</div></div>`;
  const dir = Math.abs(t.kgSem) < 0.1 ? 0 : t.kgSem > 0 ? 1 : -1;
  const quiere = p && obj ? Math.sign(obj - p.kg) : 0;           // -1 bajar, 1 subir, 0 mantener
  const bien = quiere===0 ? dir===0 : dir===quiere;
  const col = dir===0 ? (quiere===0 ? "var(--good)" : "var(--ink-2)") : (bien ? "var(--good)" : "var(--danger)");
  const sym = dir===0 ? "=" : dir>0 ? "▲" : "▼";
  const txt = dir===0 ? "Igualando" : dir>0 ? "Subiendo" : "Bajando";
  const kg = v=> (v>0?"+":"")+v.toFixed(2).replace(".",",");
  let eta = "";
  if(p && obj && dir!==0 && bien){ const sem = Math.abs(p.kg-obj)/Math.abs(t.kgSem); if(sem<200){ const f = new Date(); f.setDate(f.getDate()+Math.round(sem*7)); eta = `Al objetivo ≈ ${f.toLocaleDateString("es-AR",{month:"short",year:"numeric"})}`; } }
  return `<div class="ali-box af-trend"><label>Tendencia de peso</label>
    <div class="af-trend-sym" style="color:${col}">${sym} <span>${txt}</span></div>
    <div class="af-trend-kg" style="color:${col}">${kg(t.kgSem)} kg/semana</div>
    <div class="af-peso-foot">${t.soloHoy?"Con lo de hoy (parcial)":`Promedio de ${t.n} día${t.n>1?"s":""} cargado${t.n>1?"s":""}`} · ${t.prom>=0?"+":""}${aliR(t.prom)} kcal/día</div>
    ${t.real!=null?`<div class="af-peso-foot">Balanza real: ${kg(t.real)} kg/semana</div>`:""}
    ${eta?`<div class="af-peso-foot"><b>${eta}</b></div>`:""}
    <details class="af-trend-det"><summary>¿Cómo se calcula?</summary>
      <p>Gasto de hoy ≈ <b>${aliR(g.total)} kcal</b>: metabolismo ${aliR(g.bmr)} × 1,3 por la vida diaria${g.min?` + entreno ${Math.round(g.min)} min ≈ ${aliR(g.entreno)} kcal`:""}.</p>
      <p>Comido − gastado = balance. 7.700 kcal de diferencia ≈ 1 kg. Los días sin comidas cargadas no cuentan. Es una estimación: la balanza manda.</p></details>
  </div>`;
}

/* ---------- IA: foto o texto → lista de alimentos ---------- */
async function aliAnalyze({file, files, texto, correccion}){
  const varias = files && files.length > 1;
  await aliGetSample();
  if(!aiOn()){ aliUI.err = aiErrMsg({code:"no_ai"}); return renderAlimentacion(); }
  if(aliUI.abort) aliUI.abort.abort();
  const ac = new AbortController(); aliUI.abort = ac;
  aliUI.busy = true; aliUI.err = ""; aliUI.file = file || null;
  const prev = aliUI.draft;
  let thumb = prev && prev.thumb || null;
  if(file && !correccion){ try{ thumb = await aliThumb(file); }catch(_){ thumb = null; } }
  renderAlimentacion();
  const prompt = `Sos nutricionista deportivo en Argentina. ${varias?`Te paso ${files.length} FOTOS de distintos alimentos o grupos de alimentos del usuario: juntá todo lo que se ve en una sola lista de ingredientes (tipo "alimentos").`:file?"Te paso una FOTO de una comida.":""}${texto?` El usuario la describe así: "${texto}".`:""}
Identificá cada alimento ${file?"visible en la foto":"mencionado"} (separá lo que se pueda: ej. milanesa / puré / ensalada), estimá la porción en gramos (o ml para bebidas) y calculá los valores nutricionales de ESA porción.
Tené en cuenta comidas y porciones típicas argentinas (milanesa, empanadas, asado, facturas, mate, guisos, etc.) y el tamaño del plato o cubiertos para estimar cantidades. Si dudás, elegí lo más probable y bajá "conf". Contá el aceite o aderezo visible.
${correccion?`Estimación anterior: ${JSON.stringify((prev&&prev.items||[]).map(x=>({n:x.n,g:x.g,kcal:x.kcal,p:x.p,c:x.c,f:x.f})))}
CORRECCIÓN del usuario: "${correccion}". Rehacé la estimación aplicando la corrección.
`:""}Respondé SOLO un objeto JSON, sin texto extra:
{"tipo":"plato (comida servida) | heladera (heladera/alacena) | alimentos (grupo de productos o ingredientes sin cocinar)","titulo":"nombre corto","items":[{"n":"alimento","g":gramos,"kcal":kcal,"p":proteína_g,"c":carbohidratos_g,"f":grasas_g,"conf":0_a_1}],"ingredientes":["si es heladera o alimentos: lista de ingredientes que se ven, con cantidad aproximada"],"salud":1_a_10,"nota":"consejo breve (máx. 18 palabras, voseo) para alguien que entrena en el gimnasio"}
Si no hay comida: {"titulo":"","items":[],"nota":"No veo comida en la foto"}.`;
  try{
    const opts = { signal: ac.signal, onText: ()=>{ const t = document.getElementById("af-busy-txt"); if(t) t.textContent = "Calculando porciones y macros…"; } };
    if(files && files.length) opts.images = files; else if(file) opts.images = [file];
    const res = await aiJSON(prompt, opts);
    if(ac.signal.aborted) return;
    const its = (res && Array.isArray(res.items) ? res.items : []).map(aliDraftItem);
    aliUI.draft = { src: file||(prev&&prev.src==="foto"&&correccion) ? "foto" : "texto", thumb, titulo: res&&res.titulo || "", nota: res&&res.nota || "",
      tipo: varias ? "alimentos" : (res && /heladera|alimentos/.test(res.tipo||"")) ? (/heladera/.test(res.tipo)?"heladera":"alimentos") : "plato", nFotos: files ? files.length : 1,
      ingredientes: (res && Array.isArray(res.ingredientes) ? res.ingredientes : []).map(x=> typeof x==="string" ? x : x && (x.n||x.nombre) ? (x.n||x.nombre)+(x.cant?` (${x.cant})`:"") : "").filter(Boolean),
      salud: res&&res.salud, items: its, meal: prev&&prev.meal || aliMealNow(), texto, file: file || (prev&&prev.file) || null };
    if(!its.length && !(aliUI.draft.ingredientes||[]).length) aliUI.err = (res&&res.nota) || "No encontré alimentos. Probá otra foto o describilo.";
    const desc = document.getElementById("af-desc"); if(desc && texto) desc.value = "";
  }catch(e){
    aliUI.err = aiErrMsg(e);
  }finally{
    if(aliUI.abort===ac){ aliUI.busy = false; aliUI.abort = null; }
    renderAlimentacion();
  }
}
// Miniatura chiquita (≈5 KB) para ver en la lista qué comiste; la foto original no se guarda.
async function aliThumb(file){
  const bmp = await createImageBitmap(file);
  const S = 112, k = S/Math.max(bmp.width,bmp.height);
  const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width*k); cv.height = Math.round(bmp.height*k);
  cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height); bmp.close && bmp.close();
  return cv.toDataURL("image/jpeg",0.6);
}

(function aliInit(){
  try{ const raw = localStorage.getItem("entrenador-alimentacion"); if(raw) aliData = JSON.parse(raw)||{}; }catch(_){}
  try{ const raw = localStorage.getItem("entrenador-ali-cfg"); if(raw) aliCfg = Object.assign({}, ALI_CFG_DEF, JSON.parse(raw)); }catch(_){}
  aliGetSample().then(()=>{ if(state.view==="alimentacion") renderAlimentacion(); });
  let tries = 0;
  const w = setInterval(()=>{ tries++;
    if(db){ clearInterval(w);
      const busyField = ()=> rxBusyFocus();
      db.collection("alimentacion").onSnapshot(snap=>{
        const t = {}; snap.docs.forEach(x=>{ t[x.id] = x.data(); });
        aliData = t;
        if(state.view==="alimentacion" && !busyField() && (RX.sub==="registro" || RX.sub==="nutri" || RX.sub==="meta")) renderAlimentacion();
      }, ()=>{});
      db.doc("alimentacion_cfg/objetivos").onSnapshot(s=>{
        const v = s && (typeof s.data==="function" ? s.data() : s); if(v && typeof v==="object") aliCfg = Object.assign({}, ALI_CFG_DEF, v);
        if(state.view==="alimentacion" && !busyField()) renderAlimentacion();
      }, ()=>{});
    }
    else if(tries>(window.__STANDALONE__?1e9:40)) clearInterval(w);
  }, 500);
})();

/* ======================= IA: Claude (PC) o Gemini (celular) =======================
   En la versión de PC (claude.ai) la IA es Claude, que ya viene incluido: no hace falta clave.
   Esa vista no deja conectarse a servicios de afuera, así que Gemini queda para la app del celular:
   ahí se pega una clave gratuita de Google AI Studio en "Nutri IA → Motor de IA". */
function aiGemKey(){ try{ return localStorage.getItem("entrenador-gemini-key")||""; }catch(_){ return ""; } }
function aiGemModel(){ try{ return localStorage.getItem("entrenador-gemini-model")||"gemini-flash-latest"; }catch(_){ return "gemini-flash-latest"; } }
function aiOn(){ return !!aliSample || !!aiGemKey(); }
function aiImgOn(){ return aliSample ? aliImgOk : !!aiGemKey(); }
function aiMotor(){ return aliSample ? "Claude" : aiGemKey() ? "Gemini" : ""; }
async function aiB64(file){
  const bmp = await createImageBitmap(file); const k = Math.min(1, 1280/Math.max(bmp.width,bmp.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width*k); cv.height = Math.round(bmp.height*k);
  cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height); bmp.close && bmp.close();
  return cv.toDataURL("image/jpeg",0.82).split(",")[1];
}
// Si un modelo está saturado (503), con límite (429) o ya no existe (404), prueba solo con el siguiente.
const AI_GEM_FALLBACK = ["gemini-flash-latest","gemini-3-flash-preview","gemini-flash-lite-latest","gemini-3.1-flash-lite"];
async function aiGemini(contents, json, signal){
  const models = [aiGemModel(), ...AI_GEM_FALLBACK].filter((m,i,a)=>m && a.indexOf(m)===i);
  let last = null;
  for(const m of models){
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`, {
      method:"POST", signal, headers:{ "Content-Type":"application/json", "x-goog-api-key":aiGemKey() },
      body: JSON.stringify({ contents, generationConfig: json ? { responseMimeType:"application/json", temperature:0.4 } : { temperature:0.6 } }) });
    if(r.ok){
      const j = await r.json();
      return ((((j.candidates||[])[0]||{}).content||{}).parts||[]).map(p=>p.text||"").join("");
    }
    last = r.status;
    if(r.status===400 || r.status===401 || r.status===403) throw { code:"bad_key", message:"Gemini "+r.status };
    if(![404,429,500,503].includes(r.status)) break;
  }
  throw { code: last===429 ? "rate_limited" : last===503 ? "busy" : "ai_error", message:"Gemini "+last };
}
async function aiJSON(prompt, { images, signal, onText } = {}){
  const s = await aliGetSample();
  if(s){ const o = { signal, onText }; if(images && images.length) o.images = images; return s.json(prompt, o); }
  if(!aiGemKey()) throw { code:"no_ai", message:"Sin IA configurada" };
  const parts = [{ text:prompt }];
  for(const f of (images||[])) parts.push({ inline_data:{ mime_type:"image/jpeg", data: await aiB64(f) } });
  const t = await aiGemini([{ role:"user", parts }], true, signal);
  return JSON.parse(t.replace(/^\s*```(?:json)?/,"").replace(/```\s*$/,""));
}
async function aiChat(turns, { signal, onText } = {}){
  const s = await aliGetSample();
  if(s){ const r = await s(turns, { signal, onText, cache:false }); return r.text; }
  if(!aiGemKey()) throw { code:"no_ai", message:"Sin IA configurada" };
  return aiGemini(turns.map(t=>({ role: t.role==="assistant" ? "model" : "user", parts:[{ text:t.content }] })), false, signal);
}
function aiErrMsg(e){
  const c = e && e.code;
  return c==="cancelled" ? "" : c==="not_granted" ? "Hace falta permitir que la app le consulte a la IA (aparece un aviso la primera vez)."
    : c==="images_unavailable" ? "Esta vista no puede mandar fotos: escribí los ingredientes." : c==="image_rejected" ? "No pude leer esa imagen: probá con JPG o PNG."
    : c==="rate_limited" ? "Muchas consultas seguidas: esperá un minuto." : c==="no_ai" ? "No hay IA configurada (en el celular: Nutri IA → Motor de IA → clave de Gemini)."
    : c==="busy" ? "Los servidores de Gemini están saturados en este momento. Probá de nuevo en unos minutos." : c==="bad_key" ? "La clave de Gemini no funciona: revisala en Nutri IA → Motor de IA." : "No se pudo ("+((e&&e.message)||"error")+"). Probá de nuevo.";
}

  const w = Math.floor(r), f = r-w; const fr = f===0.5?"½":f===0.25?"¼":f===0.75?"¾":""; return (w?String(w):"")+(fr||(w?"":"0")); }

async function rxGenerar(modo, files){
  if(!aiOn()){ RX.err = aiErrMsg({code:"no_ai"}); return renderAlimentacion(); }
  if(RX.abort) RX.abort.abort(); const ac = new AbortController(); RX.abort = ac;
  RX.busy = modo; RX.err = ""; renderAlimentacion();
  const S = modo==="armo" ? RX.armo : RX.hel;
  try{
    const res = await aiJSON(rxRecPrompt({ ings:S.ings, n: modo==="armo"?1:Math.max(1, Math.min(10, +S.cant||4)), tipo:S.tipo, min: S.min||"60", obj: S.obj || "rico, casero y con buena proteína",
      porc:S.porc, deseo: S.deseo, foto: !!(files && files.length) }), { images: files, signal: ac.signal });
    if(ac.signal.aborted) return;
    if(res && Array.isArray(res.ingredientes) && res.ingredientes.length){
      const have = new Set(S.ings.map(x=>rxNorm(x.n)));
      res.ingredientes.forEach(x=>{ const n = (x.n||"").trim(); if(n && !have.has(rxNorm(n))){ S.ings.push({ n, cant:x.cant||"" }); have.add(rxNorm(n)); } });
    }
    const recs = (res && Array.isArray(res.recetas) ? res.recetas : []).map(r=>Object.assign(r, { src:"ia", id:"ia-"+aliUid() }));
    if(modo==="armo") RX.armo.receta = recs[0] || null; else RX.hel.recetas = recs;
    if(!recs.length) RX.err = "No pude armar recetas con eso. Sumá algún ingrediente más.";

async function rxIdentificar(files, who){ // foto(s) de productos → ingredientes (Yo armo / Plan)
  const S = rxS(who || "armo");
  if(!aiOn()){ RX.err = aiErrMsg({code:"no_ai"}); return renderAlimentacion(); }
  const ac = new AbortController(); RX.abort = ac; RX.busy = "foto"; RX.err = ""; RX.fotosN = files.length; renderAlimentacion();
  try{
    const res = await aiJSON(`Mirá la(s) foto(s): son productos o ingredientes de cocina de un usuario argentino. Listá cada ingrediente con su cantidad aproximada si se ve (paquete de 1 kg, 6 huevos, etc.). Respondé SOLO JSON: {"ingredientes":[{"n":"nombre del ingrediente","cant":"cantidad aprox o vacío"}]}`, { images:files, signal:ac.signal });
    const have = new Set(S.ings.map(x=>rxNorm(x.n))); let nuevos = 0;
    (res && res.ingredientes || []).forEach(x=>{ const n = (x.n||"").trim(); if(n && !have.has(rxNorm(n))){ S.ings.push({ n, cant:x.cant||"" }); have.add(rxNorm(n)); nuevos++; } });
    if(!(res && res.ingredientes && res.ingredientes.length)) RX.err = "No reconocí productos en la foto.";
    else toast(`📷 ${nuevos} ingrediente${nuevos===1?"":"s"} reconocido${nuevos===1?"":"s"} en ${files.length} foto${files.length===1?"":"s"}`);
  }catch(e){ RX.err = aiErrMsg(e); }
  finally{ if(RX.abort===ac){ RX.busy = false; RX.abort = null; } renderAlimentacion(); }
}

const CANT_RE = /^(?:\d+(?:[.,]\d+)?|un|una|uno|unos|unas|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|doce|media|medio|algo|un poco)\s*(?:(?:kilos?|kg|gramos?|grs?|g|litros?|lts?|l|cc|paquetes?|paq|cajas?|latas?|botellas?|bolsas?|sobres?|potes?|docenas?|unidades?|u|frascos?|maples?|atados?|cuartos?|fetas?)\s*)?(?:de\s+)?/i;
const PROD_FIX = { "rayado":"rallado", "tirabuson":"tirabuzón", "tirabuzon":"tirabuzón", "costeletas":"costeleta", "fideo ":"fideos ", "jamon":"jamón", "limon":"limón", "melon":"melón", "azucar":"azúcar", "atun":"atún", "jabon":"jabón", "cafe\\b":"café", "pure ":"puré " };
function rxLimpiarProd(s){
  let t = String(s||"").trim().replace(/\s+/g," ");
  for(let i=0;i<2;i++) t = t.replace(CANT_RE, "").trim();
  Object.entries(PROD_FIX).forEach(([a,b])=>{ t = (t+" ").replace(new RegExp(a,"gi"), b).trim(); });
  return t ? t.charAt(0).toUpperCase()+t.slice(1) : "";

function rxGondolaDe(t){
  const n = " "+rxNorm(t)+" ";
  for(const g of GONDOLAS) if(g[2].some(x=>rxNorm(x)===n.trim())) return g[0];
  let best = null, len = 0;
  Object.entries(GONDOLA_KEYS).forEach(([g,ks])=> ks.forEach(k=>{ const kk = rxNorm(k); if(n.includes(kk) && kk.length>len){ best = g; len = kk.length; } }));
  return best || "otros";
}
function rxComprasAgrupadas(items){
  const grupos = GONDOLAS.map(g=>({ k:g[0], n:g[1], its:[] })).concat([{ k:"otros", n:"📦 Otros", its:[] }]);
  items.forEach(x=>{ const g = grupos.find(gr=>gr.k===rxGondolaDe(x.t)); g.its.push(x); });
  grupos.forEach(g=> g.its.sort((a,b)=> a.t.localeCompare(b.t, "es")));
  return grupos.filter(g=>g.its.length);
}
function rxComprasTexto(){
  const pend = (RX.compras.items||[]).filter(x=>!x.ok), grupos = rxComprasAgrupadas(pend);
  const f = new Date().toLocaleDateString("es-AR",{ weekday:"long", day:"numeric", month:"numeric" });
  return `🛒 *LISTA DE COMPRAS* · ${f}\n` + grupos.map(g=>`\n*${g.n}*\n` + g.its.map(x=>`☐ ${x.t}`).join("\n")).join("\n") + `\n\n_${pend.length} productos · Entrenador Personal_`;
}

function rxAddCompras(list, src){

/* ======================= 🎯 MI META (peso, recordatorios de pesaje y plan sugerido) =======================
   - Meta: peso actual (último pesaje) → objetivo, ritmo recomendado y fecha estimada.
   - Recordatorio de pesaje: todos los lunes del mes en curso, hasta 2 horarios.
       · Dentro de la app: aviso + sonido a esa hora (con la app abierta) y cartel los lunes hasta que te pesás.
       · Para que suene aunque la app esté cerrada: "Agregar al calendario del celular" arma los eventos
         de los lunes que quedan del mes, con alarma, y el calendario del celular avisa solo.
   - Plan en 4 partes (Meta · Alimentación · Entrenamiento · Hábitos) calculado con tus datos reales:
     comidas cargadas, minutos entrenados (cronómetro), agua y pesajes. Más un plan semanal opcional con IA. */
const MT = { iaTxt:"", iaBusy:false, iaErr:"" };
function mtLunesDelMes(ref){ // lunes del mes de "ref" desde hoy en adelante
  const d = dsToDate(ref || todayStr()), y = d.getFullYear(), m = d.getMonth(), out = [];
  for(let i=1;i<=31;i++){ const x = new Date(y, m, i); if(x.getMonth()!==m) break; if(x.getDay()===1 && todayStr(x) >= todayStr()) out.push(todayStr(x)); }
  return out;
}
function mtRec(){ const r = aliCfg.recPeso || {}; return { h1: r.h1 || "08:00", h2: r.h2 || "", on: r.on !== false, mes: r.mes || "" }; }
function mtStats(){
  const hoy = todayStr(), dias = [];
  for(let i=1;i<=14;i++) dias.push(addDays(hoy,-i));
  const comidos = dias.filter(k=>(aliDay(k).items||[]).length);
  const tot = comidos.map(k=>aliTot(aliDay(k).items));
  const avg = f=> tot.length ? tot.reduce((a,t)=>a+t[f],0)/tot.length : 0;
  const ent = dias.map(k=> typeof dayMin==="function" ? dayMin(k) : 0).filter(m=>m>5);
  const aguaDias = dias.filter(k=>aliN(aliDay(k).agua)>0);
  const pes = Object.keys(aliData).filter(k=>k>=addDays(hoy,-30) && aliN(aliData[k].peso)>0).length;
  const gasto = dias.slice(0,7).reduce((a,k)=>a+aliGasto(k).total,0)/7;
  return { diasCargados: comidos.length, kcal: avg("kcal"), p: avg("p"), c: avg("c"), f: avg("f"),
    entDias: ent.length, entMin: ent.length ? ent.reduce((a,b)=>a+b,0)/ent.length : 0,
    agua: aguaDias.length ? aguaDias.reduce((a,k)=>a+aliN(aliDay(k).agua),0)/aguaDias.length : 0, pesajes: pes, gasto };
}
function mtPlan(){
  const hoy = todayStr(), p = aliPesoAl(hoy), obj = aliN(aliCfg.pesoObj), s = mtStats(), t = aliTrend(hoy);
  if(!p || !obj) return { s, falta:true };
  const dif = p.kg - obj, quiere = Math.abs(dif) < 0.5 ? 0 : dif > 0 ? -1 : 1;
  // ritmo recomendado: bajar ≈0,75% del peso por semana (máx 1 kg) · subir ≈0,25% (máx 0,35 kg)
  let ritmo = quiere<0 ? Math.min(1, p.kg*0.0075) : quiere>0 ? Math.min(0.35, p.kg*0.0025) : 0;
  const ajuste = quiere * ritmo * ALI_KCAL_KG / 7;                    // kcal/día a sumar (−) o restar
  // nunca más de 25% por debajo del gasto ni menos de un piso mínimo: se baja más lento pero sin perder músculo
  const piso = Math.max(s.gasto*0.75, aliCfg.sexo==="m" ? 1300 : 1600);
  const kcal = Math.round(Math.max(s.gasto + ajuste, quiere<0 ? piso : 0)/50)*50;
  if(quiere<0) ritmo = Math.max(0.1, (s.gasto - kcal)*7/ALI_KCAL_KG);
  const semanas = ritmo ? Math.abs(dif)/ritmo : 0;
  const fecha = new Date(); fecha.setDate(fecha.getDate()+Math.round(semanas*7));
  const pesoRef = quiere<0 ? Math.max(obj, p.kg*0.85) : p.kg;          // proteína sobre un peso "de referencia"
  const prot = Math.round(pesoRef * (quiere<0 ? 2 : 1.8) / 5)*5;
  const gras = Math.round(kcal*0.27/9/5)*5;
  const carb = Math.max(80, Math.round((kcal - prot*4 - gras*9)/4/5)*5);
  return { s, t, p, obj, dif, quiere, ritmo, semanas, fecha, kcal, prot, gras, carb };
}

function mtICS(){
  const R = mtRec(), lunes = mtLunesDelMes(), hs = [R.h1, R.h2].filter(Boolean);
  const pad = n=> String(n).padStart(2,"0"), now = new Date();
  const stamp = now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+"T"+pad(now.getUTCHours())+pad(now.getUTCMinutes())+"00Z";
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Entrenador Personal//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  lunes.forEach(k=> hs.forEach((h,i)=>{
    const dt = k.replace(/-/g,"")+"T"+h.replace(":","")+"00";
    L.push("BEGIN:VEVENT","UID:pesaje-"+dt+"-"+i+"@entrenador","DTSTAMP:"+stamp,"DTSTART:"+dt,"DURATION:PT10M",
      "SUMMARY:⚖️ Pesarte (Entrenador)","DESCRIPTION:En ayunas y antes de desayunar. Cargalo en la app: Alimentación → Mi meta → Registrar pesaje.",
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Hora de pesarte","TRIGGER:PT0M","END:VALARM","END:VEVENT");
  }));
  L.push("END:VCALENDAR");
  const blob = new Blob([L.join("\r\n")], { type:"text/calendar" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "recordatorio-pesaje-"+todayStr().slice(0,7)+".ics";
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  return lunes.length*hs.length;
}
