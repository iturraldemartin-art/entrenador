/* ======================= 📦 CICLOS DE ALIMENTACIÓN =======================
   Cada uno cierra el ciclo cuando quiere (botón en Mi meta). Al cerrar:
     1. Se guarda una ESTADÍSTICA de todo el período (alimentación, peso, agua, ayunos y, solo como
        lectura, lo que pasó en el gym) en "alimentacion_ciclos/<id>", con una serie diaria compacta.
     2. Se descarga una copia completa de Alimentación (archivo .json) por las dudas.
     3. Alimentación vuelve a cero: comidas, agua, notas, pesajes e historial de ayunos.
   NO se toca: el gym (sesiones, rutinas, reglas, fases, cronómetro), objetivos, peso objetivo,
   recordatorios, recetario, Mis recetas, lista de compras ni la clave de IA.
   El último peso pasa al nuevo ciclo como punto de partida. */
let mtCiclos = {};
function mtCicloIni(){
  if(aliCfg.cicloIni) return aliCfg.cicloIni;
  const ks = Object.keys(aliData).sort(); return ks[0] || todayStr();
}
function mtResumen(ini, fin){
  const dias = daysIn([ini, fin]);
  const conComida = dias.filter(d=>(aliDay(d).items||[]).length);
  const tots = conComida.map(d=>aliTot(aliDay(d).items));
  const avg = (arr, f)=> arr.length ? arr.reduce((a,x)=>a+f(x),0)/arr.length : 0;
  const pes = dias.filter(d=>aliN(aliDay(d).peso)>0);
  const pIni = pes.length ? aliN(aliDay(pes[0]).peso) : null, pFin = pes.length ? aliN(aliDay(pes[pes.length-1]).peso) : null;
  const agua = dias.filter(d=>aliN(aliDay(d).agua)>0);
  const t0 = dsToDate(ini).getTime(), t1 = dsToDate(fin).getTime() + 864e5;
  const ay = (RX.ayuno.hist||[]).filter(x=>x.s>=t0 && x.s<t1);
  let gym = null;
  try{ if(typeof periodStats==="function"){ const g = periodStats([ini, fin]); gym = { sesiones:g.sesiones, diasCrono:g.diasMin, minutos:Math.round(g.min), series:g.series, ejercicios:g.nEj }; } }catch(_){}
  const r1 = v=> Math.round(v*10)/10;
  return {
    ini, fin, cerrado: todayStr(), dias: dias.length, diasConComida: conComida.length,
    kcal: Math.round(avg(tots,t=>t.kcal)), p: Math.round(avg(tots,t=>t.p)), c: Math.round(avg(tots,t=>t.c)), f: Math.round(avg(tots,t=>t.f)),
    alimentos: conComida.reduce((a,d)=>a+(aliDay(d).items||[]).length,0),
    pesoIni: pIni, pesoFin: pFin, pesoCambio: pIni!=null && pFin!=null ? r1(pFin-pIni) : null, pesajes: pes.length, pesoObj: aliN(aliCfg.pesoObj)||null,
    agua: r1(avg(agua, d=>aliN(aliDay(d).agua))),
    ayunos: ay.length, ayunosCumplidos: ay.filter(x=>(x.e-x.s)/3.6e6 >= x.plan).length, ayunoHoras: r1(avg(ay, x=>(x.e-x.s)/3.6e6)),
    objetivo: { kcal:aliN(aliCfg.kcal), p:aliN(aliCfg.p), c:aliN(aliCfg.c), f:aliN(aliCfg.f) },
    gym,
    serie: dias.filter(d=>(aliDay(d).items||[]).length || aliN(aliDay(d).peso)>0).map(d=>{ const x = aliDay(d), t = aliTot(x.items);
      const o = { d }; if((x.items||[]).length){ o.kcal = Math.round(t.kcal); o.p = Math.round(t.p); } if(aliN(x.peso)>0) o.peso = aliN(x.peso); if(aliN(x.agua)>0) o.agua = aliN(x.agua); return o; })
  };
}
function mtCicloCard(c, actual){

    <div class="mt-ciclo-grid">
      <div><small>Peso</small><b>${n1(c.pesoIni)} → ${n1(c.pesoFin)}</b>${cam!=null?`<em class="${cam<0?"down":cam>0?"up":""}">${cam>0?"+":""}${n1(cam)} kg</em>`:""}</div>
      <div><small>Calorías prom.</small><b>${c.kcal||"—"}</b><em>${c.diasConComida} días cargados</em></div>
      <div><small>Proteína prom.</small><b>${c.p||"—"} g</b><em>C ${c.c||0} · G ${c.f||0}</em></div>
      <div><small>Agua prom.</small><b>${c.agua?n1(c.agua)+" vasos":"—"}</b><em>${c.pesajes} pesajes</em></div>
      <div><small>Ayunos</small><b>${c.ayunos}</b><em>${c.ayunos?c.ayunosCumplidos+" cumplidos · "+n1(c.ayunoHoras)+" h prom.":"—"}</em></div>
      ${c.gym?`<div><small>Gym (solo lectura)</small><b>${c.gym.sesiones} entrenos</b><em>${fmtMin(c.gym.minutos)} · ${c.gym.series} series</em></div>`:""}

function mtCiclosHtml(){

function mtDescargar(nombre, obj){
  const blob = new Blob([JSON.stringify(obj, null, 1)], { type:"application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 3000);
}
async function mtCerrarCiclo(){
  const ini = mtCicloIni(), hoy = todayStr(), R = mtResumen(ini, hoy);
  const ok = confirm(`¿Cerrar el ciclo de alimentación ${fmtShort(ini)} → ${fmtShort(hoy)}?\n\n✔ Se guarda la estadística (${R.diasConComida} días con comidas, peso ${R.pesoIni??"—"} → ${R.pesoFin??"—"}).\n✔ Se descarga una copia completa.\n✖ Se borran comidas, agua, notas, pesajes e historial de ayunos.\n\nNO se toca el gym, tus rutinas ni las reglas. Tus objetivos, recetas y lista de compras quedan.`);
  if(!ok) return;
  const id = ini+"_"+hoy+"_"+Date.now().toString(36);
  const fechas = Object.keys(aliData);
  // 1) copia completa
  mtDescargar(`alimentacion-ciclo-${ini}_a_${hoy}.json`, { tipo:"copia-alimentacion", desde:ini, hasta:hoy, alimentacion:aliData, ayuno:RX.ayuno, objetivos:aliCfg, resumen:R });
  // 2) estadística
  const res = Object.assign({ id }, R);
  mtCiclos = Object.assign({}, mtCiclos, { [id]:res });
  try{ if(db) await db.doc("alimentacion_ciclos/"+id).set(res); else localStorage.setItem("entrenador-ali-ciclos", JSON.stringify(mtCiclos)); }
  catch(_){ toast("No se pudo guardar la estadística en la nube: no se borró nada"); return; }
  // 3) Alimentación a cero (el último peso pasa al ciclo nuevo como punto de partida)
  const ult = aliPesoAl(hoy);
  for(const d of fechas){ try{ if(db) await db.doc("alimentacion/"+d).delete(); }catch(_){} }
  aliData = {};
  if(ult){ aliData[hoy] = { date:hoy, peso:ult.kg }; await aliSave(hoy); }
  if(!db){ try{ localStorage.setItem("entrenador-alimentacion", JSON.stringify(aliData)); }catch(_){} }
  RX.ayuno = { plan: RX.ayuno.plan || 16, start:null, hist:[] }; rxSaveCfg("ayuno");
  aliCfg.cicloIni = hoy; aliSaveCfg();
  aliUI.draft = null; MT.iaTxt = "";
  toast("📦 Ciclo cerrado: estadística guardada y Alimentación en cero");
  renderAlimentacion();
}
document.addEventListener("click", async e=>{
  const b = e.target.closest && e.target.closest("[data-mt]"); if(!b) return;
  if(b.dataset.mt==="cerrar") return mtCerrarCiclo();
  if(b.dataset.mt==="cicdel"){
    if(!confirm("¿Borrar este resumen de ciclo? (los datos del ciclo ya se habían borrado al cerrarlo)")) return;
    const id = b.dataset.k, m = Object.assign({}, mtCiclos); delete m[id]; mtCiclos = m;
    try{ if(db) await db.doc("alimentacion_ciclos/"+id).delete(); else localStorage.setItem("entrenador-ali-ciclos", JSON.stringify(mtCiclos)); }catch(_){}
    renderAlimentacion();
  }
});
(function mtCiclosInit(){
  try{ const c = localStorage.getItem("entrenador-ali-ciclos"); if(c) mtCiclos = JSON.parse(c)||{}; }catch(_){}
  let tries = 0;
  const w = setInterval(()=>{ tries++;
    if(db){ clearInterval(w);
      db.collection("alimentacion_ciclos").onSnapshot(snap=>{ const t = {}; snap.docs.forEach(x=>{ t[x.id] = Object.assign({ id:x.id }, x.data()); }); mtCiclos = t;
        if(state.view==="alimentacion" && RX.sub==="meta" && !rxBusyFocus()) renderAlimentacion(); }, ()=>{});
    } else if(tries>(window.__STANDALONE__?1e9:40)) clearInterval(w);
  }, 500);
})();

   La comida se arma como un PLATO COMPLETO: principal + acompañamiento (guarnición, pan, untables) + bebida + postre.
   Cada cosa va por UNIDADES NATURALES (rodajas, vasos de 300 cc, unidades grandes, porciones) y se suma todo.
   Los huevos tienen armador propio: cantidad + preparación (frito, duro, poché, revuelto, omelet, tortilla)
   + queso (tipo y cantidad) + agregados.

   Región (NOA, NEA, Cuyo, Pampeana, Patagonia): ordena frutas, verduras, lácteos y pescados de la zona, y se le pasa
   a la IA en recetas, heladera, plan y chat. Las carnes (vaca, pollo, cerdo) son iguales en todo el país; para pescado:

let alimMios = {};
function fdTodos(){ return FD.concat(Object.values(alimMios).filter(x=>x && x.tipo!=="plato").map(x=>Object.assign({ mio:true }, x))); }
function fdPlatosMios(){ return Object.values(alimMios).filter(x=>x && x.tipo==="plato"); }
function fdBuscar(q, sec){
  const nq = rxNorm(q).trim(); const reg = regionAct();
  let L = fdTodos().filter(x=> !sec || FD_SEC_OF[x.sec]===sec);
  if(nq) L = L.filter(x=> rxNorm(x.n).includes(nq));
  else L = L.filter(x=> !x.reg || x.reg.includes(reg) || x.mio);           // sin búsqueda: solo lo común + lo de tu zona
  return L.sort((a,b)=> (b.mio?2:0)+(b.reg&&b.reg.includes(reg)?1:0) - ((a.mio?2:0)+(a.reg&&a.reg.includes(reg)?1:0)));
}
// "3 tomates", "4 huevos", "lechuga" → busca en la base para no dejar alimentos en 0 kcal
function fdMatch(nombre){
  const m = String(nombre||"").trim().match(/^(\d+(?:[.,]\d+)?)\s*(.*)$/); const qty = m ? parseFloat(m[1].replace(",",".")) : 1;
  const txt = rxNorm(m ? m[2] : nombre).replace(/s\b/g,"").replace(/\bde\b/g," ").replace(/\s+/g," ").trim(); if(!txt) return null;
  const words = txt.split(" ").filter(w=>w.length>2);
  let best = null, score = 0;
  fdTodos().forEach(x=>{ const n = rxNorm(x.n).replace(/s\b/g,""); const s = words.filter(w=>n.includes(w)).length / Math.max(1, words.length);
    if(s>score || (s===score && best && n.length<rxNorm(best.n).length)){ score = s; best = x; } });
  if(score < 0.6) return null;
  return { x:best, qty };
}

/* ---------- Estado del armador ---------- */
function plNuevo(meal){ aliUI.plato = { meal: meal || aliMealNow(), items:[], open:null, q:{}, egg:null, otro:null }; }
function plAdd(x, qty){
  const P = aliUI.plato; const ex = P.items.find(i=>i.fid && i.fid===x.id);
  if(ex){ ex.qty = +(ex.qty + (qty||1)).toFixed(2); return; }
  P.items.push({ k:aliUid(), fid:x.id||null, n:x.n, u:x.u||"1 porción", g:aliN(x.g), kcal:aliN(x.kcal), p:aliN(x.p), c:aliN(x.c), f:aliN(x.f), qty:qty||1, sec:FD_SEC_OF[x.sec]||x.sec||"prin" });
}
function plTot(items){ return (items||[]).reduce((t,i)=>({ kcal:t.kcal+i.kcal*i.qty, p:t.p+i.p*i.qty, c:t.c+i.c*i.qty, f:t.f+i.f*i.qty }), {kcal:0,p:0,c:0,f:0}); }
function plEggCalc(E){
  const pr = EGG_PREP[E.prep] || EGG_PREP.revuelto, q = EGG_QUESO[E.queso||""], n = Math.max(1, aliN(E.n)), qq = E.queso ? Math.max(0, aliN(E.quesoQ)||1) : 0;
  let t = { kcal:pr[1]*n + q[1]*qq, p:pr[2]*n + q[2]*qq, c:pr[3]*n + q[3]*qq, f:pr[4]*n + q[4]*qq };
  (E.extras||[]).forEach(k=>{ const x = EGG_EXTRA[k]; if(x){ t.kcal+=x[1]; t.p+=x[2]; t.c+=x[3]; t.f+=x[4]; } });
  const nom = (["omelet","tortilla"].includes(E.prep) ? `${pr[0]} de ${n} huevo${n>1?"s":""}` : `${n} huevo${n>1?"s":""} ${pr[0].toLowerCase()}`)
    + (E.queso ? ` con queso ${q[0].toLowerCase()} (${qq} ${q[5]})` : "") + ((E.extras||[]).length ? ` + ${(E.extras||[]).map(k=>EGG_EXTRA[k][0].replace(/\s*\(.*\)/,"").toLowerCase()).join(", ")}` : "");
  return { n:nom, t };
}

document.addEventListener("click", async e=>{
  const b = e.target.closest && e.target.closest("[data-pl]"); if(!b) return;
  const a = b.dataset.pl, k = b.dataset.k;
  if(a==="nuevo"){ plNuevo(b.dataset.meal); aliUI.mqLista = null; aliUI.draft = null; renderAlimentacion(); const el = document.querySelector(".pl-box"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  const P = aliUI.plato; if(!P) return;
  if(a==="abrir"){ P.open = b.dataset.sec; P.otro = null; return renderAlimentacion(); }
  if(a==="cerrar"){ P.open = null; P.egg = null; P.otro = null; return renderAlimentacion(); }
  if(a==="add"){ const x = fdTodos().find(i=>i.id===k); if(x){ plAdd(x, 1); P.q[P.open] = ""; } return renderAlimentacion(); }
  if(a==="miplato"){ const m = alimMios[k]; if(m) (m.items||[]).forEach(i=> P.items.push(Object.assign({}, i, { k:aliUid() }))); return renderAlimentacion(); }
  if(a==="mas" || a==="menos"){ const i = P.items.find(x=>x.k===k); if(i){ const st = i.qty<1 || (a==="menos" && i.qty<=1) ? 0.5 : 1; i.qty = Math.max(0.5, +(i.qty + (a==="mas"?st:-st)).toFixed(2)); } return renderAlimentacion(); }
  if(a==="quitar"){ P.items = P.items.filter(x=>x.k!==k); return renderAlimentacion(); }
  if(a==="egg"){ P.egg = P.egg ? null : { n:2, prep:"revuelto", queso:"", quesoQ:1, extras:[] }; return renderAlimentacion(); }
  if(a==="egg-n"){ P.egg.n = Math.max(1, Math.min(12, aliN(P.egg.n) + (+b.dataset.d))); return renderAlimentacion(); }
  if(a==="egg-prep"){ P.egg.prep = k; return renderAlimentacion(); }
  if(a==="egg-queso"){ P.egg.queso = k; return renderAlimentacion(); }
  if(a==="egg-qq"){ P.egg.quesoQ = Math.max(1, Math.min(10, (aliN(P.egg.quesoQ)||1) + (+b.dataset.d))); return renderAlimentacion(); }
  if(a==="egg-x"){ const x = P.egg.extras || []; P.egg.extras = x.includes(k) ? x.filter(i=>i!==k) : x.concat([k]); return renderAlimentacion(); }
  if(a==="egg-ok"){ const r = plEggCalc(P.egg); P.items.push({ k:aliUid(), fid:null, n:r.n, u:"1 plato", g:aliN(P.egg.n)*55, kcal:aliR(r.t.kcal), p:+r.t.p.toFixed(1), c:+r.t.c.toFixed(1), f:+r.t.f.toFixed(1), qty:1, sec:"prin" }); P.egg = null; return renderAlimentacion(); }
  if(a==="otro"){ P.otro = b.dataset.sec; renderAlimentacion(); const f = document.getElementById("pl-o-n"); if(f){ f.value = P.q[P.otro]||""; f.focus(); } return; }
  if(a==="otro-x"){ P.otro = null; return renderAlimentacion(); }
  if(a==="otro-ia"){
    const n = (document.getElementById("pl-o-n")||{}).value||"", u = (document.getElementById("pl-o-u")||{}).value||"1 porción";
    if(!n.trim()){ toast("Escribí el nombre"); return; }
    b.disabled = true; b.textContent = "Calculando…";
    try{
      const r = await aiJSON(`Nutricionista argentino. Valores para "${n}" en la cantidad "${u}". ${regTxt()} Respondé SOLO JSON: {"g":gramos_o_ml,"kcal":kcal,"p":proteína_g,"c":carbos_g,"f":grasas_g}`);
      [["pl-o-g","g"],["pl-o-k","kcal"],["pl-o-p","p"],["pl-o-c","c"],["pl-o-f","f"]].forEach(([id,f])=>{ const el = document.getElementById(id); if(el && r && r[f]!=null) el.value = Math.round(aliN(r[f])*10)/10; });
      const uu = document.getElementById("pl-o-u"); if(uu && !uu.value) uu.value = u;
    }catch(err){ toast(aiErrMsg(err)); }
    b.disabled = false; b.textContent = "✨ Calcular kcal con IA"; return;
  }
  if(a==="otro-ok"){
    const v = id=> (document.getElementById(id)||{}).value||"";
    const n = v("pl-o-n").trim(); if(!n){ toast("Escribí el nombre"); return; }
    if(!aliN(v("pl-o-k"))){ toast("Poné las kcal (o calculalas con IA)"); return; }
    const sec = b.dataset.sec==="acom" ? "guar" : b.dataset.sec;

/* ---------- Que nada quede en 0 kcal: completa con la base y, si hace falta, con IA ---------- */
async function aliCompletarKcal(items){
  const faltan = [];
  items.forEach(x=>{
    if(aliN(x.kcal)>0 || !x.n) return;
    const m = fdMatch(x.n);
    if(m){ const u = m.x, q = m.qty; Object.assign(x, { kcal:aliR(u.kcal*q), p:+(u.p*q).toFixed(1), c:+(u.c*q).toFixed(1), f:+(u.f*q).toFixed(1), g:aliR(u.g*q) }); }
    else faltan.push(x);
  });
  if(faltan.length && aiOn()){
    try{
      const r = await aiJSON(`Nutricionista argentino. Estimá calorías y macros de cada alimento tal como lo escribió el usuario (si dice "3 tomates" son 3 unidades medianas). ${regTxt()}
Alimentos: ${JSON.stringify(faltan.map(x=>x.n))}
Respondé SOLO JSON: {"items":[{"n":"igual al recibido","g":gramos_totales,"kcal":kcal_totales,"p":prot_g,"c":carbos_g,"f":grasas_g}]}`);
      (r && r.items || []).forEach((v,i)=>{ const x = faltan[i]; if(x && v) Object.assign(x, { kcal:aliR(v.kcal), p:+aliN(v.p).toFixed(1), c:+aliN(v.c).toFixed(1), f:+aliN(v.f).toFixed(1), g:aliR(v.g)||x.g }); });
    }catch(_){}
  }
  return items;
}

const MQ_TABS = [["carnes","🥩 Carnes y pescados"],["platos","🍝 Platos"],["huevos","🥚 Huevos"],["guar","🥗 Guarniciones"],["pan","🍞 Panes"],["unt","🧈 Untables"],["beb","🥤 Bebidas"],["post","🍎 Frutas y postres"],["mios","★ Mi base"],["zona","📍 Mi zona"]];
const MQ_CARNE = new Set(["mila-h","mila-f","mila-p","napo","suprema","pech","pollo-h","bife","nalga","asado","vacio","chori","morci","hamb-c","hamb-p","estofado","bondiola","matambre","cordero","cabrito",

function mqTab(x){ if(x.mio) return "mios"; if(x.sec==="prin") return x.id && x.id.indexOf("h-")===0 ? "huevos" : MQ_CARNE.has(x.id) ? "carnes" : "platos"; return x.sec; }
function mqLista(tab){
  const reg = regionAct();
  if(tab==="zona") return fdTodos().filter(x=>x.reg && x.reg.includes(reg));
  return fdTodos().filter(x=> mqTab(x)===tab && (!x.reg || x.reg.includes(reg) || x.mio));
}
function mqBuscar(q){
  const nq = rxNorm(q).trim(); if(!nq) return [];
  const reg = regionAct(), L = fdTodos().filter(x=> rxNorm(x.n).includes(nq));
  return L.sort((a,b)=>{ const sa = rxNorm(a.n).startsWith(nq)?0:1, sb = rxNorm(b.n).startsWith(nq)?0:1; if(sa!==sb) return sa-sb;
    const ra = a.reg&&a.reg.includes(reg)?0:1, rb = b.reg&&b.reg.includes(reg)?0:1; return ra-rb; }).slice(0,14);
}
function mqChip(x, meal){ return `<button class="mq-op" data-mq="add" data-meal="${meal}" data-k="${aliEsc(x.id)}">${x.reg&&x.reg.includes(regionAct())?"📍 ":""}${x.mio?"★ ":""}${aliEsc(x.n)}<small>${aliEsc(x.u)} · ${aliR(x.kcal)} kcal</small></button>`; }
function mqHtml(meal){
  const L = aliUI.mqLista && aliUI.mqLista.meal===meal ? aliUI.mqLista : null;
  return `<div class="mq">
    <div class="mq-row"><input type="text" class="mq-in" data-meal="${meal}" placeholder="＋ Agregar: escribí hu, pa, ma…" autocomplete="off">
      <button class="btn btn-sm" data-mq="lista" data-meal="${meal}">${L?"✕ Cerrar":"📋 Lista"}</button></div>
    <div class="mq-drop" data-meal="${meal}"></div>
    ${L ? `<div class="mq-panel">
      <div class="mq-tabs">${MQ_TABS.map(([k,l])=>`<button class="mq-tab ${L.tab===k?"on":""}" data-mq="tab" data-meal="${meal}" data-k="${k}">${l}</button>`).join("")}</div>
      <div class="mq-ops">${mqLista(L.tab).map(x=>mqChip(x, meal)).join("") || `<span class="af-muted">${L.tab==="mios"?"Todavía no cargaste alimentos propios: usá ＋ Otro en Armar mi plato.":"Nada en esta pestaña."}</span>`}</div>
      ${L.tab==="huevos"?`<button class="btn btn-sm" data-pl="nuevo" data-meal="${meal}">🥚 Armar omelet / huevos con queso y agregados</button>`:""}
    </div>` : ""}
  </div>`;
}
function mqAgregar(meal, x){
  const d = aliDate || todayStr(), r = aliDay(d);
  const it = { id:aliUid(), meal, fid:x.id, n:x.n, u:x.u, q:1, uk:{ g:aliN(x.g), kcal:aliN(x.kcal), p:aliN(x.p), c:aliN(x.c), f:aliN(x.f) },
    g:aliR(x.g), kcal:aliR(x.kcal), p:+aliN(x.p).toFixed(1), c:+aliN(x.c).toFixed(1), f:+aliN(x.f).toFixed(1), src:"lista", t:Date.now() };
  aliData[d] = Object.assign({}, r, { items:(r.items||[]).concat([it]) }); aliSave(d);
  toast(`✓ ${x.n} (${x.u}) · ${aliR(x.kcal)} kcal`);
}
function mqCant(id, delta){
  const d = aliDate || todayStr(), r = aliDay(d);
  aliData[d] = Object.assign({}, r, { items:(r.items||[]).map(x=>{
    if(x.id!==id || !x.uk) return x;
    const q = Math.max(0.5, +((aliN(x.q)||1) + delta).toFixed(2)), u = x.uk;
    return Object.assign({}, x, { q, g:aliR(u.g*q), kcal:aliR(u.kcal*q), p:+(u.p*q).toFixed(1), c:+(u.c*q).toFixed(1), f:+(u.f*q).toFixed(1) });
  }) });
  aliSave(d); renderAlimentacion();
}
document.addEventListener("input", e=>{
  const t = e.target; if(!t.classList || !t.classList.contains("mq-in")) return;
  const meal = t.dataset.meal, drop = document.querySelector(`.mq-drop[data-meal="${meal}"]`); if(!drop) return;
  const res = mqBuscar(t.value);
  drop.innerHTML = !t.value.trim() ? "" : res.length ? `<div class="mq-ops">${res.map(x=>mqChip(x, meal)).join("")}</div>`
    : `<div class="af-muted">No está en la base. <button class="pg-exlink" data-mq="ia" data-meal="${meal}">Calcularlo con IA y agregarlo</button> o <button class="pg-exlink" data-pl="nuevo" data-meal="${meal}">cargarlo a mano</button>.</div>`;
});
document.addEventListener("click", async e=>{
  const b = e.target.closest && e.target.closest("[data-mq]"); if(!b) return;
  const a = b.dataset.mq, meal = b.dataset.meal;
  if(a==="lista"){ aliUI.mqLista = aliUI.mqLista && aliUI.mqLista.meal===meal ? null : { meal, tab:"carnes" }; return renderAlimentacion(); }
  if(a==="tab"){ aliUI.mqLista = { meal, tab:b.dataset.k }; return renderAlimentacion(); }
  if(a==="add"){ const x = fdTodos().find(i=>i.id===b.dataset.k); if(x){ mqAgregar(meal, x); renderAlimentacion(); } return; }
  if(a==="mas" || a==="menos") return mqCant(b.dataset.k, a==="mas" ? 1 : -1);
  if(a==="ia"){
    const inp = document.querySelector(`.mq-in[data-meal="${meal}"]`), txt = inp && inp.value.trim(); if(!txt) return;
    if(!aiOn()){ toast("Falta la clave de Gemini (Nutri IA → Motor de IA)"); return; }
    b.textContent = "Calculando…";
    const it = { n:txt, kcal:0, g:100 }; await aliCompletarKcal([it]);
    if(!aliN(it.kcal)){ toast("No pude calcularlo"); return; }
    const x = await plGuardarMio({ tipo:"alimento", n:txt, sec:"prin", u:"1 porción", g:aliN(it.g)||100, kcal:aliN(it.kcal), p:aliN(it.p), c:aliN(it.c), f:aliN(it.f) });
    mqAgregar(meal, x); renderAlimentacion();
  }
});

function vidThumb(id){ try{ return vidThumb0(id); }catch(_){ return null; } }
function vidThumb0(id){
  const v = exVid(id); if(!v) return null;
  const def = EX_VIDEO_LINKS[id];
  if(def && def.url===v.url && EX_VID_THUMBS[id]) return EX_VID_THUMBS[id];
  const p = vidParse(v.url); return p && p.tipo==="yt" ? `https://i.ytimg.com/vi/${p.id}/hqdefault.jpg` : "";
}
function exVid(id){ const v = exVideosDb[id]; return (v && v.url) ? v : (v && v.borrado ? null : EX_VIDEO_LINKS[id] || null); }
function vidParse(url){
  const u = String(url||"");
  let m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:shorts\/|watch\?v=|embed\/|live\/))([\w-]{11})/); if(m) return { tipo:"yt", id:m[1] };
  m = u.match(/instagram\.com\/(?:reel|p|tv)\/([\w-]+)/); if(m) return { tipo:"ig", id:m[1] };
  if(/^https:\/\/[^\s"'<>]+\.(?:mp4|webm)(?:\?[^\s"'<>]*)?$/i.test(u)) return { tipo:"mp4", id:u };
  return null;
}
document.addEventListener("error", e=>{ const v = e.target; if(!v || !v.classList || !v.classList.contains("exv-mp4")) return;
  const d = document.createElement("div"); d.className = "exv-err"; d.textContent = "No se pudo cargar el video acá. Tocá «Abrir» para verlo en la página original."; v.replaceWith(d); }, true);
function segTxt(s){ s = Math.max(0, Math.round(Number(s)||0)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function txtSeg(t){ t = String(t||"").trim(); if(!t) return 0; if(t.includes(":")){ const [a,b] = t.split(":"); return (Number(a)||0)*60 + (Number(b)||0); } return Number(t)||0; }
function exVidHtml(ex){
  const v = exVid(ex.id), edit = `<button type="button" class="btn btn-sm btn-ghost" data-exvid="${ex.id}">✏️ ${v?"Cambiar video":"Agregar video"}</button>`;
  if(!v) return `<div class="exv">${edit}</div>`;
  const p = vidParse(v.url), st = Number(v.start)||0;
  let player = "";
  if(p && p.tipo==="yt") player = `<iframe class="exv-yt" src="https://www.youtube-nocookie.com/embed/${p.id}?start=${st}&playsinline=1&rel=0&modestbranding=1&loop=1&playlist=${p.id}" title="Video de ${aliEsc(ex.n)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
  else if(p && p.tipo==="ig") player = `<iframe class="exv-ig" src="https://www.instagram.com/reel/${p.id}/embed/" title="Video de ${aliEsc(ex.n)}" allowfullscreen loading="lazy"></iframe>`;
  else if(p && p.tipo==="mp4") player = `<video class="exv-mp4" src="${aliEsc(p.id)}${st?"#t="+st:""}" ${vidThumb(ex.id)?`poster="${vidThumb(ex.id)}"`:""} autoplay muted loop playsinline controls preload="metadata" title="Video de ${aliEsc(ex.n)}"></video>`;
  const abrir = p && p.tipo==="yt" ? `https://www.youtube.com/watch?v=${p.id}${st?`&t=${st}s`:""}` : (v.pagina || v.url);
  return `<div class="exv">
    ${player}
    ${(st || v.nota) ? `<div class="exv-nota">${st && p && p.tipo==="ig" ? `⏩ <b>Adelantá hasta ${segTxt(st)}</b> · ` : st ? `▶ Arranca en ${segTxt(st)} · ` : ""}${aliEsc(v.nota||"")}</div>` : ""}
    <div class="exv-acc"><a class="btn btn-sm" href="${aliEsc(abrir)}" target="_blank" rel="noopener">↗ Abrir en ${p && p.tipo==="ig" ? "Instagram" : p && p.tipo==="yt" ? "YouTube" : aliEsc(v.fuente || "el navegador")}</a>${edit}</div>
  </div>`;
}
document.addEventListener("click", e=>{
  const b = e.target.closest && e.target.closest("[data-exvid]"); if(!b) return;
  const id = b.dataset.exvid, ex = exerciseById(id), v = exVid(id) || {};
  openModal(`<div class="modal-head"><div><h2>Video del ejercicio</h2><div style="color:var(--ink-2);font-size:.85rem;">${ex?ex.n:""}</div></div>
    <button class="modal-close" type="button" data-action="close-modal">${ICON.close}</button></div>
    <div class="field"><label for="exv-url">Link de YouTube, Instagram o video .mp4</label><input type="text" id="exv-url" value="${aliEsc(v.url||"")}" placeholder="https://youtube.com/shorts/… o https://www.instagram.com/reel/…"></div>
    <div class="field-row"><div class="field"><label for="exv-st">Empezar en (min:seg)</label><input type="text" id="exv-st" value="${segTxt(v.start||0)}" placeholder="0:12"></div></div>
    <div class="field"><label for="exv-nota">Aclaración</label><input type="text" id="exv-nota" value="${aliEsc(v.nota||"")}" placeholder="Ej: es el 2º ejercicio del video"></div>
    <p class="af-muted" style="margin:0;">YouTube arranca solo en ese segundo. Instagram no lo permite: la app te muestra "adelantá hasta…".</p>
    <div class="modal-foot">${exVid(id)?`<button class="btn btn-danger btn-ghost" type="button" data-exvid-del="${id}">Quitar video</button>`:""}<button class="btn" type="button" data-action="close-modal">Cancelar</button><button class="btn btn-primary" type="button" data-exvid-save="${id}">Guardar</button></div>`);
});
document.addEventListener("click", async e=>{
  const s = e.target.closest && e.target.closest("[data-exvid-save],[data-exvid-del]"); if(!s) return;
  const id = s.dataset.exvidSave || s.dataset.exvidDel;
  let val;
  if(s.dataset.exvidDel) val = { borrado:true };
  else { const url = (document.getElementById("exv-url")||{}).value.trim();
    if(url && !vidParse(url)){ toast("El link tiene que ser de YouTube, Instagram o un video .mp4"); return; }
    val = url ? { url, start:txtSeg((document.getElementById("exv-st")||{}).value), nota:((document.getElementById("exv-nota")||{}).value||"").trim() } : { borrado:true }; }
  exVideosDb = Object.assign({}, exVideosDb, { [id]: val });
  closeModal(); try{ render(); }catch(_){}
  if(!db){ toast("Sin conexión: no se guardó"); return; }
  try{ await db.doc("meta/videos").set(exVideosDb); toast("🎬 Video guardado"); }catch(_){ toast("No se pudo guardar el video"); }
});

/* ======================= CB · COMBINACIONES DE SERIES =======================
   Botón "CB" en cada ejercicio de Hoy (al lado de la nota). Solo aparece la combinación si la cargás.
   Tipos: series continuas, rest-pause, drop set, pirámide, superserie o libre.
   Bloques: repeticiones × veces (ej: 7×2 → 5×2 → 3×2), retención en segundos (isometría en la contracción)
   y descanso entre bloques (0 = sin descanso, continuo). Queda guardado por ejercicio en "meta/combos".
   "▶ Guía" abre un paso a paso a pantalla completa con timer de retención y de descanso. */
const CB_TIPOS = { continuas:"Series continuas", restpause:"Rest-pause", drop:"Drop set", piramide:"Pirámide", superserie:"Superserie", libre:"Libre" };
let exCombos = {}, cbEdit = null, cbRun = null;
function cbDelNombre(name){ // "retención 5 [7x2+5x2+3x2]" escrito en el nombre del ejercicio
  const n = String(name||""), b = n.match(/\[([^\]]+)\]/); if(!b) return null;
  const bloques = b[1].split("+").map(s=>s.trim().match(/^(\d+)\s*[x×]\s*(\d+)$/i)).filter(Boolean).map(m=>({ r:+m[1], x:+m[2] }));
  if(!bloques.length) return null;
  const ret = n.match(/retenci[oó]n\s*(\d+)/i);
  return { tipo:"continuas", ret: ret ? +ret[1] : 0, bloques, desc:0, nota:"", delNombre:true };
}
function exCombo(id){ const c = exCombos[id]; if(c && c.borrado) return null; if(c && c.bloques && c.bloques.length) return c; const ex = exerciseById(id); return ex ? cbDelNombre(ex.n) : null; }
function cbResumen(c){ const tot = c.bloques.reduce((a,b)=>a+b.r*b.x,0);
  return `${CB_TIPOS[c.tipo]||"Combinación"}${c.ret?` · retención ${c.ret} s`:""} · ${c.bloques.map(b=>`${b.r}×${b.x}`).join(" → ")} = ${tot} reps${c.desc?` · descanso ${c.desc} s`:" · sin descanso"}`; }
function exCbLine(id){ const c = exCombo(id); if(!c) return "";
  return `<div class="ex-cb-line"><span class="ex-cb-tag">CB</span><span>${cbResumen(c)}</span><button type="button" class="btn btn-sm" data-cbgo="${id}">▶ Guía</button></div>`; }
function exCbBtn(id){ const has = !!exCombo(id); return `<button type="button" class="btn btn-sm btn-ghost ex-cb-btn ${has?"has":""}" data-excb="${id}" title="Combinación de series (CB)" aria-label="Combinación de series">CB</button>`; }
function cbModal(){
  const c = cbEdit, ex = exerciseById(c.id);
  openModal(`<div class="modal-head"><div><h2>CB · Combinación de series</h2><div style="color:var(--ink-2);font-size:.85rem;">${ex?ex.n:""} · se guarda para este ejercicio</div></div>
    <button class="modal-close" type="button" data-action="close-modal">${ICON.close}</button></div>
    <div class="field"><label>Tipo</label><div class="pl-chips">${Object.entries(CB_TIPOS).map(([k,l])=>`<button type="button" class="chip filter-chip ${c.tipo===k?"on":""}" data-cbt="${k}">${l}</button>`).join("")}</div></div>
    <div class="field"><label>Bloques (repeticiones × veces)</label>
      ${c.bloques.map((b,i)=>`<div class="cb-bl"><span>Bloque ${i+1}</span>
        <div class="pl-step"><button type="button" data-cbb="${i}:r:-1">−</button><b>${b.r}</b><button type="button" data-cbb="${i}:r:1">+</button></div><small>reps</small>
        <span>×</span><div class="pl-step"><button type="button" data-cbb="${i}:x:-1">−</button><b>${b.x}</b><button type="button" data-cbb="${i}:x:1">+</button></div><small>veces</small>
        <button type="button" class="btn btn-icon btn-ghost btn-sm" data-cbdel="${i}" aria-label="Quitar bloque">✕</button></div>`).join("")}
      <button type="button" class="btn btn-sm btn-ghost" data-cbadd="1">＋ Agregar bloque</button></div>
    <div class="field-row">
      <div class="field"><label>Retención (seg)</label><div class="pl-step"><button type="button" data-cbn="ret:-1">−</button><b>${c.ret}</b><button type="button" data-cbn="ret:1">+</button></div></div>
      <div class="field"><label>Descanso entre bloques (seg)</label><div class="pl-step"><button type="button" data-cbn="desc:-15">−</button><b>${c.desc}</b><button type="button" data-cbn="desc:15">+</button></div></div>
    </div>
    <div class="field"><label for="cb-nota">Nota</label><input type="text" id="cb-nota" value="${aliEsc(c.nota||"")}" placeholder="Ej: bajada lenta en 3 segundos"></div>
    <div class="cb-prev">${c.bloques.length ? cbResumen(c) : "Agregá al menos un bloque"}</div>
    <div class="modal-foot">${exCombos[c.id] && !exCombos[c.id].borrado ? `<button class="btn btn-danger btn-ghost" type="button" data-cbsave="del">Quitar CB</button>`:""}<button class="btn" type="button" data-action="close-modal">Cancelar</button><button class="btn btn-primary" type="button" data-cbsave="ok" ${c.bloques.length?"":"disabled"}>Guardar CB</button></div>`);
}
document.addEventListener("click", async e=>{
  const t = e.target.closest && e.target.closest("[data-excb],[data-cbt],[data-cbb],[data-cbdel],[data-cbadd],[data-cbn],[data-cbsave],[data-cbgo],[data-cbrun]"); if(!t) return;
  const ds = t.dataset;
  if(ds.excb){ try{ syncDayDraftFromDom(); }catch(_){} const base = exCombo(ds.excb) || { tipo:"continuas", ret:0, bloques:[{ r:10, x:1 }], desc:0, nota:"" };
    cbEdit = Object.assign({ id:ds.excb }, JSON.parse(JSON.stringify(base))); return cbModal(); }
  if(!cbEdit && !ds.cbgo && !ds.cbrun) return;
  const keepNota = ()=>{ const n = document.getElementById("cb-nota"); if(n && cbEdit) cbEdit.nota = n.value; };
  if(ds.cbt){ keepNota(); cbEdit.tipo = ds.cbt; return cbModal(); }
  if(ds.cbb){ keepNota(); const [i,f,d] = ds.cbb.split(":"); const b = cbEdit.bloques[+i]; b[f] = Math.max(1, Math.min(f==="r"?50:10, b[f] + (+d))); return cbModal(); }
  if(ds.cbdel){ keepNota(); cbEdit.bloques.splice(+ds.cbdel,1); return cbModal(); }
  if(ds.cbadd){ keepNota(); const last = cbEdit.bloques[cbEdit.bloques.length-1]; cbEdit.bloques.push({ r: last ? Math.max(1,last.r-2) : 10, x: last ? last.x : 1 }); return cbModal(); }
  if(ds.cbn){ keepNota(); const [f,d] = ds.cbn.split(":"); cbEdit[f] = Math.max(0, Math.min(f==="ret"?60:300, (cbEdit[f]||0) + (+d))); return cbModal(); }
  if(ds.cbsave){ keepNota(); const id = cbEdit.id;
    const val = ds.cbsave==="del" ? { borrado:true } : { tipo:cbEdit.tipo, ret:cbEdit.ret, bloques:cbEdit.bloques, desc:cbEdit.desc, nota:(cbEdit.nota||"").trim() };
    exCombos = Object.assign({}, exCombos, { [id]: val }); cbEdit = null; closeModal(); try{ redrawDayEditor(); }catch(_){ try{ render(); }catch(__){} }
    if(!db){ toast("Sin conexión: no se guardó"); return; }
    try{ await db.doc("meta/combos").set(exCombos); toast(ds.cbsave==="del" ? "CB quitada" : "CB guardada"); }catch(_){ toast("No se pudo guardar"); }
    return; }
  if(ds.cbgo){ const c = exCombo(ds.cbgo); if(!c) return; const ex = exerciseById(ds.cbgo);
    const pasos = []; c.bloques.forEach((b,bi)=>{ for(let k=1;k<=b.x;k++){ pasos.push({ txt:`${b.r} repeticiones`, sub:`Bloque ${bi+1} · tanda ${k} de ${b.x}`, reps:b.r });
      const ultimo = bi===c.bloques.length-1 && k===b.x; if(!ultimo && c.desc) pasos.push({ desc:c.desc }); } });
    cbRun = { n: ex ? ex.n : "", c, pasos, i:0, t:0, timer:null, hechas:0 }; try{ if(typeof requestWakeLock==="function") requestWakeLock(); }catch(_){} return cbRender(); }
  if(ds.cbrun){ const R = cbRun; if(!R) return;
    if(ds.cbrun==="x"){ clearInterval(R.timer); cbRun = null; return cbRender(); }
    if(ds.cbrun==="prev"){ clearInterval(R.timer); R.t = 0; R.i = Math.max(0, R.i-1); return cbRender(); }
    if(ds.cbrun==="next"){ clearInterval(R.timer); R.t = 0; const p = R.pasos[R.i]; if(p && p.reps) R.hechas += p.reps;
      if(R.i < R.pasos.length-1){ R.i++; const q = R.pasos[R.i]; if(q.desc) cbTimer(q.desc); return cbRender(); }
      clearInterval(R.timer); cbRun = null; toast("💪 Combinación terminada"); return cbRender(); }
    if(ds.cbrun==="ret"){ cbTimer(R.c.ret); return cbRender(); }
  }
});
function cbTimer(seg){ const R = cbRun; if(!R || !seg) return; clearInterval(R.timer); R.t = seg;
  R.timer = setInterval(()=>{ if(!cbRun){ clearInterval(R.timer); return; } R.t--; if(R.t<=0){ clearInterval(R.timer); R.t = 0; try{ rxBeep(); }catch(_){} } cbRender(); }, 1000); }
function cbRender(){
  let o = document.getElementById("cb-run");
  if(!cbRun){ if(o) o.remove(); return; }
  if(!o){ o = document.createElement("div"); o.id = "cb-run"; o.setAttribute("role","dialog"); o.setAttribute("aria-modal","true"); document.body.appendChild(o); }
  const R = cbRun, p = R.pasos[R.i], tot = R.c.bloques.reduce((a,b)=>a+b.r*b.x,0);
  o.innerHTML = `<div class="rx-cook-in">
    <div class="rx-cook-top"><b>CB · ${aliEsc(R.n)}</b><span>Paso ${R.i+1} de ${R.pasos.length}</span><button class="btn btn-sm" data-cbrun="x">✕ Salir</button></div>
    <div class="rx-cook-bar"><div style="width:${(R.i+1)/R.pasos.length*100}%"></div></div>
    ${p.desc ? `<p class="rx-cook-step">😮‍💨 Descanso</p><div class="rx-cook-timer"><span class="mono">${segTxt(R.t)}</span></div>`
      : `<div class="cb-sub">${aliEsc(p.sub)}</div><p class="rx-cook-step">${aliEsc(p.txt)}</p>
         ${R.c.ret ? `<div class="rx-cook-timer">${R.t>0 ? `<span class="mono">${R.t}</span><span>retené…</span>` : `<button class="btn btn-primary" data-cbrun="ret">⏱ Retención ${R.c.ret} s</button>`}<small class="af-muted">en la contracción de cada repetición</small></div>` : ""}`}
    <div class="af-muted">Llevás ${R.hechas} de ${tot} repeticiones${R.c.nota?` · ${aliEsc(R.c.nota)}`:""}</div>
    <div class="rx-cook-nav"><button class="btn" data-cbrun="prev" ${R.i?"":"disabled"}>← Anterior</button><button class="btn btn-primary" data-cbrun="next">${R.i<R.pasos.length-1?"Hecho, siguiente →":"✓ Terminé"}</button></div>
  </div>`;
}
(function cbInit(){
  let tries = 0;
  const w = setInterval(()=>{ tries++;
    if(db){ clearInterval(w);
      db.doc("meta/combos").onSnapshot(s=>{ exCombos = (s.exists && s.data()) || {}; if(document.getElementById("day-editor") && typeof dayDraft!=="undefined" && dayDraft){ try{ syncDayDraftFromDom(); redrawDayEditor(); }catch(_){} } }, ()=>{});
      db.doc("meta/videos").onSnapshot(s=>{ exVideosDb = (s.exists && s.data()) || {}; }, ()=>{});
    } else if(tries>(window.__STANDALONE__?1e9:40)) clearInterval(w);
  }, 500);
})();

/* ======================= GUARDAR IDEAS =======================
   Anotás (escribiendo o DICTANDO, que pasa la voz a texto al instante) o grabás un audio.
   Todo queda guardado en ESTE celular (IndexedDB). "Enviar a Claude" arma un archivo de texto con
   todas las ideas pendientes + los audios, y abre el menú Compartir del celular para mandarlos
   (al chat de Claude, a WhatsApp, a Drive…). Claude lee el texto; los audios quedan de respaldo. */
const Ideas = { list:[], rec:null, recChunks:[], recStart:0, recTick:null, dict:null, dictOn:false };
function ideasDb(){
  return new Promise((ok,ko)=>{ try{
    const r = indexedDB.open("entrenador-ideas", 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("ideas", { keyPath:"id" });
    r.onsuccess = ()=> ok(r.result); r.onerror = ()=> ko(r.error);
  }catch(e){ ko(e); } });
}
async function ideasLoad(){
  try{ const dbi = await ideasDb();
    Ideas.list = await new Promise(ok=>{ const q = dbi.transaction("ideas").objectStore("ideas").getAll(); q.onsuccess=()=>ok(q.result||[]); q.onerror=()=>ok([]); });
    Ideas.list.sort((a,b)=> a.id<b.id?1:-1);
  }catch(_){ Ideas.list = []; }
  if(state.view==="guardar") renderGuardar();
}
async function ideasPut(it){ try{ const dbi = await ideasDb(); await new Promise(ok=>{ const tx=dbi.transaction("ideas","readwrite"); tx.objectStore("ideas").put(it); tx.oncomplete=ok; tx.onerror=ok; }); }catch(_){} }
async function ideasDel(id){ try{ const dbi = await ideasDb(); await new Promise(ok=>{ const tx=dbi.transaction("ideas","readwrite"); tx.objectStore("ideas").delete(id); tx.oncomplete=ok; tx.onerror=ok; }); }catch(_){} }
function ideaFecha(id){ const d=new Date(Number(id.split("-")[0])); return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}); }
function ideaAudioExt(mime){ return /mp4|m4a|aac/.test(mime||"") ? "m4a" : (/ogg/.test(mime||"") ? "ogg" : "webm"); }
function ideasPanelHtml(){
  const pend = Ideas.list.filter(x=>!x.enviada);
  const canDict = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  const canRec = !!(navigator.mediaDevices && window.MediaRecorder);
  const esc = t=> String(t||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  return `<div class="today-panel guia">
    <div class="guia-root">💡 GUARDAR IDEAS</div>
    <p style="font-size:.86rem;color:var(--ink-2);margin:10px 0 10px;">Se te ocurre algo en el gym → escribilo, <b>dictalo</b> (pasa la voz a texto) o grabá un audio. Después tocá <b>Enviar a Claude</b> y pegás/adjuntás en el chat.</p>
    <div class="idea-new">
      <textarea id="idea-txt" placeholder="Ej: que el descanso suene también en el reloj…">${esc(Ideas.borrador||"")}</textarea>
      <div class="idea-tools">
        ${canDict?`<button type="button" class="btn ${Ideas.dictOn?"rec-on":""}" data-idea="dict">${Ideas.dictOn?"⏹ Parar dictado":"🗣️ Dictar"}</button>`:""}
        ${canRec?`<button type="button" class="btn ${Ideas.rec?"rec-on":""}" data-idea="rec">${Ideas.rec?`⏹ Parar audio <span id="idea-rec-t">0:00</span>`:"🎙️ Grabar audio"}</button>`:""}
        <button type="button" class="btn btn-primary" data-idea="save" style="margin-left:auto;">Guardar idea</button>
      </div>
    </div>
    ${Ideas.list.length?`<ul class="idea-list">${Ideas.list.map(it=>`<li class="idea-item ${it.enviada?"sent":""}">
      <div class="idea-meta"><span>${ideaFecha(it.id)}${it.enviada?" · ✓ enviada":""}${it.audio?" · 🎙️ audio":""}</span>
        <button type="button" class="btn btn-sm btn-ghost" data-idea="del" data-id="${it.id}" title="Borrar idea">🗑</button></div>
      ${it.texto?`<p class="idea-txt">${esc(it.texto)}</p>`:""}
      ${it.audio?`<audio controls preload="none" data-idea-audio="${it.id}"></audio>`:""}
    </li>`).join("")}</ul>`:`<p style="font-size:.84rem;color:var(--ink-2);margin-top:12px;">Todavía no guardaste ideas.</p>`}
    <div class="idea-send">
      <button type="button" class="btn btn-primary" data-idea="send" ${pend.length?"":"disabled"}>📤 Enviar a Claude${pend.length?` (${pend.length})`:""}</button>
      ${Ideas.list.some(x=>x.enviada)?`<button type="button" class="btn btn-sm" data-idea="clear-sent">Borrar las enviadas</button>`:""}
    </div>
    <div class="rules-note" style="margin-top:12px;">✍️ Claude lee el <b>texto</b> (lo escrito y lo dictado). Los audios van de respaldo: Claude no siempre puede escucharlos, así que para pedidos importantes usá <b>Dictar</b>.</div>
  </div>`;
}
function ideasAttachAudio(){
  document.querySelectorAll("[data-idea-audio]").forEach(a=>{
    const it = Ideas.list.find(x=>x.id===a.dataset.ideaAudio);
    if(it && it.audio && !a.src){ a.src = URL.createObjectURL(it.audio); }
  });
}
function ideasKeepDraft(){ const t=document.getElementById("idea-txt"); if(t) Ideas.borrador = t.value; }
async function ideaRecToggle(){
  ideasKeepDraft();
  if(Ideas.rec){ try{ Ideas.rec.stop(); }catch(_){} return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    const mime = ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg"].find(m=> MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
    const rec = new MediaRecorder(stream, mime?{ mimeType:mime }:undefined);
    Ideas.recChunks = []; Ideas.rec = rec; Ideas.recStart = Date.now();
    rec.ondataavailable = e=>{ if(e.data && e.data.size) Ideas.recChunks.push(e.data); };
    rec.onstop = ()=>{
      stream.getTracks().forEach(t=>t.stop());
      clearInterval(Ideas.recTick); Ideas.recTick = null;
      Ideas.pendingAudio = new Blob(Ideas.recChunks, { type: rec.mimeType || mime || "audio/webm" });
      Ideas.pendingDur = Math.round((Date.now()-Ideas.recStart)/1000);
      Ideas.rec = null; renderGuardar();
      toast(`🎙️ Audio de ${Ideas.pendingDur}s listo · tocá Guardar idea`);
    };
    rec.start(1000);
    Ideas.recTick = setInterval(()=>{ const el=document.getElementById("idea-rec-t"); if(el){ const s=Math.round((Date.now()-Ideas.recStart)/1000); el.textContent = Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); } }, 500);
    renderGuardar();
  }catch(e){ Ideas.rec = null; toast("No se pudo usar el micrófono · dale permiso a la app"); }
}
function ideaDictToggle(){
  ideasKeepDraft();
  if(Ideas.dictOn && Ideas.dict){ try{ Ideas.dict.stop(); }catch(_){} return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if(!SR) return;
  const r = new SR(); r.lang = "es-AR"; r.continuous = true; r.interimResults = true;
  const base = (Ideas.borrador||"").trim();
  let finalTxt = "";
  r.onresult = e=>{
    let interim = "";
    for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) finalTxt += t+" "; else interim += t; }
    const ta = document.getElementById("idea-txt"); const v = (base?base+" ":"")+finalTxt+interim;
    if(ta) ta.value = v; Ideas.borrador = (base?base+" ":"")+finalTxt;
  };
  r.onend = ()=>{ Ideas.dictOn = false; Ideas.dict = null; ideasKeepDraft(); renderGuardar(); };
  r.onerror = ev=>{ if(ev.error==="not-allowed") toast("Dale permiso al micrófono para dictar"); };
  Ideas.dict = r; Ideas.dictOn = true;
  try{ r.start(); }catch(_){ Ideas.dictOn = false; }
  renderGuardar();
}
async function ideaSave(){
  ideasKeepDraft();
  const texto = (Ideas.borrador||"").trim();
  if(!texto && !Ideas.pendingAudio){ toast("Escribí, dictá o grabá algo primero"); return; }
  const it = { id: Date.now()+"-"+Math.random().toString(36).slice(2,6), texto, enviada:false };
  if(Ideas.pendingAudio){ it.audio = Ideas.pendingAudio; it.mime = Ideas.pendingAudio.type; it.dur = Ideas.pendingDur; }
  await ideasPut(it);
  Ideas.borrador = ""; Ideas.pendingAudio = null;
  await ideasLoad(); toast("💡 Idea guardada");
}
async function ideasSend(){
  const pend = Ideas.list.filter(x=>!x.enviada).slice().reverse();   // de la más vieja a la más nueva
  if(!pend.length) return;
  const stamp = todayStr();
  const files = [];
  let txt = `IDEAS PARA LA APP "ENTRENADOR PERSONAL" · ${fmtDateLong(stamp)}\nVersión de la app: ${typeof APP_VERSION!=="undefined"?APP_VERSION:""}\n\n`;
  pend.forEach((it,i)=>{
    let aname = "";
    if(it.audio){ aname = `idea-${i+1}-audio.${ideaAudioExt(it.mime)}`; files.push(new File([it.audio], aname, { type: (it.mime||"audio/webm").split(";")[0] })); }
    txt += `${i+1}. [${ideaFecha(it.id)}] ${it.texto||"(solo audio)"}${aname?`\n   🎙️ Audio adjunto: ${aname} (${it.dur||"?"} s)`:""}\n\n`;
  });
  txt += "Claude: aplicá estos cambios en la app (si algo no se entiende, preguntame).\n";
  const tfile = new File([txt], `ideas-entrenador-${stamp}.txt`, { type:"text/plain" });
  files.unshift(tfile);
  let ok = false;
  try{
    if(navigator.canShare && navigator.canShare({ files })){ await navigator.share({ files, title:"Ideas para la app", text:"Ideas para Entrenador Personal" }); ok = true; }
    else if(navigator.canShare && navigator.canShare({ files:[tfile] })){ await navigator.share({ files:[tfile], title:"Ideas para la app" }); ok = true; if(files.length>1) ideasDownload(files.slice(1)); }
  }catch(e){ if(e && e.name==="AbortError") return; }
  if(!ok){ ideasDownload(files); try{ await navigator.clipboard.writeText(txt); toast("📋 Texto copiado y archivos descargados · pegalos en el chat de Claude"); }catch(_){ toast("Archivos descargados · adjuntalos en el chat de Claude"); } }
  for(const it of pend){ it.enviada = true; await ideasPut(it); }
  await ideasLoad();
}
function ideasDownload(files){
  files.forEach((f,i)=> setTimeout(()=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000); }, i*400));
}
document.addEventListener("click", async e=>{
  const b = e.target.closest && e.target.closest("[data-idea]"); if(!b) return;
  const k = b.dataset.idea;
  if(k==="rec") return ideaRecToggle();
  if(k==="dict") return ideaDictToggle();
  if(k==="save") return ideaSave();
  if(k==="send") return ideasSend();
  if(k==="del"){ if(!armConfirm(b, "¿Borrar?")) return; await ideasDel(b.dataset.id); return ideasLoad(); }
  if(k==="clear-sent"){ for(const it of Ideas.list.filter(x=>x.enviada)) await ideasDel(it.id); return ideasLoad(); }
});
document.addEventListener("input", e=>{ if(e.target && e.target.id==="idea-txt") Ideas.borrador = e.target.value; });
ideasLoad();

/* ======================= INIT ======================= */
initStorage();
})();
</script>
